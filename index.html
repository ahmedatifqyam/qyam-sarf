function canActOn(req){
  if(req.status==='completed' || req.status==='rejected') return false;
  if(req.status==='pending_decision'){
    return !!myDecisionStep(req, state.user.id);
  }
  if(req.status==='pending_transfer_approval'){
    const target = cfoApprovalTarget(req);
    if(target.mode==='normal' || target.mode==='delegate_user'){
      const full = state.users.find(u=>u.id===state.user.id);
      const asCfo = state.user.role==='cfo' && (!full || userHasCompany(full, req.companyId));
      return asCfo || (target.mode==='delegate_user' && !!target.userId && target.userId===state.user.id);   // المالي يبقى قادراً أثناء التفويض
    }
    return !!target.userId && target.userId===state.user.id;
  }
  if(TAIL_FLOW.includes(req.status)){
    const full = state.users.find(u=>u.id===state.user.id);
    if(full && !userHasCompany(full, req.companyId)) return false;   // محاسب شركة لا ينفّذ طلبات شركة أخرى
    return state.user.role===STATUS_ROLE_MAP[req.status];
  }
  // ===== توافق مع طلبات تجريبية متبقية من النظام القديم (قبل تفعيل محرك المسار الجديد) =====
  const requiredRole = STATUS_ROLE_MAP[req.status];
  if(!requiredRole) return false;
  if(requiredRole==='accountant' || requiredRole==='cfo'){
    return state.user.role===requiredRole;
  }
  // dept_manager / senior_manager / executive_manager: مطلوب شخص محدد حسب سلسلة manager_id
  const step = (req.approvalSteps||[]).find(s=>s.roleLabel===req.status);
  return !!step && step.approverId===state.user.id;
}

async function approve(req){
  const me = state.users.find(u=>u.id===state.user.id);
  const needsSignature = ['dept_manager','senior_manager','executive_manager','cfo'].includes(state.user.role);
  const canManualSign = ['dept_manager','senior_manager','executive_manager','cfo','accountant'].includes(state.user.role);
  if(needsSignature && me && (!me.signatureData || !me.stampData)){
    state.returnTo = req.id;
    state.view = 'account';
    render();
    return;
  }
  if(state.user.role==='accountant' && req.status==='pending_transfer_request'){
    const center = req.centerId ? state.centers.find(c=>c.id===req.centerId) : null;
    const requireTransferRef = !center || center.requireBankTransferRef!==false;
    if(requireTransferRef){
      state.transferFormReqId = req.id;
      render();
      return;
    }
  }
  if(canManualSign && me && me.signatureMode==='manual'){
    state.manualSignReqId = req.id;
    render();
    return;
  }
  await finalizeApprove(req, null);
}

async function finalizeApprove(req, signatureOverride){
  const label = 'اعتماد';
  const delegationNote = (req.status==='pending_transfer_approval' && state.user.role!=='cfo') ? 'بالتفويض عن المدير المالي' : '';
  await pushHistory(req, {step:req.status, actor: state.user.name, userId: state.user.id, action: label, note:delegationNote, time: fmtDate(), signatureOverride: signatureOverride||''});
  let newStatus;
  if(req.status==='pending_decision'){
    const group = currentDecisionGroup(req);
    const step = group.find(s=>s.approverId===state.user.id) || currentDecisionStep(req);
    const nowIso = new Date().toISOString();
    if(step){
      await db.from('request_approval_steps').update({status:'approved', acted_at:nowIso}).eq('id', step.id);
      step.status='approved'; step.actedAt=nowIso;
      // بقية معتمدي نفس الخطوة (الأصلي أو المحال إليه): تُغلق لأن الأسبق حسم
      for(const o of group){
        if(o===step || o.status!=='pending') continue;
        await db.from('request_approval_steps').update({status:'skipped', acted_at:nowIso, note:'أُغلقت لاعتماد '+state.user.name}).eq('id', o.id);
        o.status='skipped'; o.actedAt=nowIso;
      }
      // لو هذا المعتمِد نفسه وارد بخطوة لاحقة بنفس الطلب فلا نسأله مرة ثانية
      for(const o of (req.approvalSteps||[])){
        if(o.status==='pending' && o.approverId===state.user.id && o.sequenceOrder>step.sequenceOrder){
          await db.from('request_approval_steps').update({status:'skipped', acted_at:nowIso, note:'اعتُمدت ضمن خطوة سابقة'}).eq('id', o.id);
          o.status='skipped'; o.actedAt=nowIso;
        }
      }
      // إحالة يدوية: اعتماد ثم إضافة خطوة للمدير الأعلى مباشرة بعد هذه الخطوة
      const esc = state.pendingEscalate; state.pendingEscalate = null;
      if(esc && esc.reqId===req.id && esc.targetId){
        for(const o of (req.approvalSteps||[]).filter(x=>x.sequenceOrder>step.sequenceOrder).sort((a,b)=>b.sequenceOrder-a.sequenceOrder)){
          await db.from('request_approval_steps').update({sequence_order:o.sequenceOrder+1}).eq('id', o.id);
          o.sequenceOrder += 1;
        }
        const row = {id:'as_'+req.id+'_m'+Date.now(), request_id:req.id, approver_id:esc.targetId, sequence_order:step.sequenceOrder+1, role_label:'pending_decision', status:'pending', kind:'primary', escalated_from:state.user.id};
        const ins = await db.from('request_approval_steps').insert(row);
        if(await dbCheck(ins, 'إضافة خطوة الإحالة')){
          req.approvalSteps.push({id:row.id, approverId:row.approver_id, sequenceOrder:row.sequence_order, roleLabel:row.role_label, status:'pending', actedAt:null, note:'', kind:'primary', escalatedFrom:state.user.id, activatedAt:null});
          req.approvalSteps.sort((a,b)=>a.sequenceOrder-b.sequenceOrder);
          const tName = (state.users.find(u=>u.id===esc.targetId)||{}).name||'';
          await pushHistory(req, {step:'pending_decision', actor:state.user.name, userId:state.user.id, action:'إحالة للمدير الأعلى', note:'أحال الاعتماد إلى '+tName, time: fmtDate()});
        }
      }
    }
    // الخطوة التالية تبدأ مهلتها الآن
    const nextGroup = currentDecisionGroup(req);
    if(nextGroup.length){
      const nowIso2 = new Date().toISOString();
      for(const o of nextGroup){
        await db.from('request_approval_steps').update({activated_at:nowIso2}).eq('id', o.id);
        o.activatedAt = nowIso2;
      }
    }
    newStatus = nextGroup.length ? 'pending_decision' : 'pending_transfer_request';
  } else if(req.status==='pending_transfer_request'){
    const company = state.companies.find(c=>c.id===req.companyId);
    if(company && company.cfoDelegationMode==='skip'){
      await pushHistory(req, {step:'pending_transfer_approval', actor:'النظام', userId:null, action:'تخطٍّ تلقائي', note:'المدير المالي لا يستخدم النظام (حسب إعدادات الشركة)', time: fmtDate()});
      newStatus = 'pending_disbursement';
    } else {
      newStatus = 'pending_transfer_approval';
    }
  } else if(req.status==='pending_transfer_approval'){
    newStatus = 'pending_disbursement';
  } else {
    // توافق مع النظام القديم (طلبات تجريبية متبقية بأدوار ثابتة)
    const step = (req.approvalSteps||[]).find(s=>s.roleLabel===req.status);
    if(step){
      await db.from('request_approval_steps').update({status:'approved', acted_at:new Date().toISOString()}).eq('id', step.id);
      step.status='approved'; step.actedAt=new Date().toISOString();
    }
    const tailOrder = ['pending_accountant','pending_cfo','completed'];
    const i = tailOrder.indexOf(req.status);
    newStatus = i>=0 ? tailOrder[i+1] : 'pending_transfer_request';
  }
  await setRequestStatus(req, newStatus);
  showToast('تم اعتماد الطلب', 'success');
  render();
}

async function rebuildRequestPath(req){
  const creator = state.users.find(u=>u.id===req.createdById);
  if(!creator){ showToast('تعذر إيجاد صاحب الطلب', 'error'); return; }
  const {steps: newSteps, error: chainError} = buildDecisionChain(creator);
  if(chainError){
    showToast('تعذّر إعادة البناء: '+chainError, 'error');
    return;
  }
  const delResult = await db.from('request_approval_steps').delete().eq('request_id', req.id);
  if(!(await dbCheck(delResult, 'حذف مسار الاعتماد القديم'))) return;
  const stepRows = newSteps.map((s,i)=>({id:'as_'+req.id+'_r'+Date.now()+'_'+i, request_id:req.id, approver_id:s.approverId, sequence_order:i+1, role_label:'pending_decision', status:'pending'}));
  if(stepRows.length){
    const insResult = await db.from('request_approval_steps').insert(stepRows);
    if(!(await dbCheck(insResult, 'بناء مسار الاعتماد الجديد'))) return;
  }
  req.approvalSteps = stepRows.map(s=>({id:s.id, approverId:s.approver_id, sequenceOrder:s.sequence_order, roleLabel:s.role_label, status:'pending', actedAt:null, note:''}));
  const newStatus = stepRows.length ? 'pending_decision' : 'pending_transfer_request';
  if(newStatus !== req.status){
    await pushHistory(req, {step:req.status, actor: state.user.name, userId: state.user.id, action:'إعادة بناء مسار الاعتماد', note:'', time: fmtDate()});
    await setRequestStatus(req, newStatus);
  }
  showToast('تم إعادة بناء مسار الاعتماد حسب "من يعتمد طلبه" الحالي', 'success');
  render();
}
// ============================================================
// إعادة المسار والاعتماد — تُستخدم عندما اعتمد أحد أو وصل الطلب للذيل
// ============================================================
async function rebuildRequestPathAndReset(req){
  if(!confirm('سيتم إعادة بناء مسار الاعتماد وإلغاء جميع الاعتمادات السابقة.\nهل أنت متأكد؟')) return;

  const creator = state.users.find(u=>u.id===req.createdById);
  if(!creator){ showToast('تعذر إيجاد صاحب الطلب', 'error'); return; }
  const {steps: newSteps, error: chainError} = buildDecisionChain(creator);
  if(chainError){
    showToast('تعذّر إعادة البناء: '+chainError, 'error');
    return;
  }

  // جمع المعتمدين السابقين (من اعتمد فعلياً أو كان في الذيل)
  const prevApprovers = (req.approvalSteps||[])
    .filter(s=>s.actedAt || s.status==='approved')
    .map(s=>s.approverId)
    .filter((v,i,a)=>a.indexOf(v)===i);

  // حذف مسار الاعتماد القديم
  const delResult = await db.from('request_approval_steps').delete().eq('request_id', req.id);
  if(!(await dbCheck(delResult, 'حذف مسار الاعتماد القديم'))) return;

  // بناء مسار جديد
  const stepRows = newSteps.map((s,i)=>({
    id:'as_'+req.id+'_r'+Date.now()+'_'+i,
    request_id:req.id,
    approver_id:s.approverId,
    sequence_order:i+1,
    role_label:'pending_decision',
    status:'pending'
  }));
  if(stepRows.length){
    const insResult = await db.from('request_approval_steps').insert(stepRows);
    if(!(await dbCheck(insResult, 'بناء مسار الاعتماد الجديد'))) return;
  }
  req.approvalSteps = stepRows.map(s=>({
    id:s.id, approverId:s.approver_id, sequenceOrder:s.sequence_order,
    roleLabel:s.role_label, status:'pending', actedAt:null, note:''
  }));

  // إضافة سجل تاريخي
  await pushHistory(req, {step:req.status, actor: state.user.name, userId: state.user.id,
    action:'إعادة المسار والاعتماد',
    note:'تم إعادة بناء مسار الاعتماد وإلغاء الاعتمادات السابقة. المعتمدون السابقون: '+
      (prevApprovers.map(id=>{ const u=state.users.find(x=>x.id===id); return u?u.name:id; }).join('، ')||'—'),
    time: fmtDate()
  });

  // إضافة إشعار path_reset لكل معتمد سابق في تاريخ الطلب
  for(const approverId of prevApprovers){
    await pushHistory(req, {
      step:'path_reset_notify',
      actor: state.user.name,
      userId: state.user.id,
      action:'path_reset',
      note:'notif_target:'+approverId,
      time: fmtDate()
    });
  }

  // تحديث الحالة للـ pending_decision
  const newStatus = stepRows.length ? 'pending_decision' : 'pending_transfer_request';
  await setRequestStatus(req, newStatus);

  showToast('تم إعادة بناء المسار — '+(prevApprovers.length ? 'أُرسل إشعار للمعتمدين السابقين' : 'لم يكن هناك اعتمادات سابقة'), 'success');
  render();
}

function setupManualSignCanvas(){
  const canvas = document.getElementById('manualSignCanvas');
  if(!canvas) return;
  const me = state.users.find(u=>u.id===state.user.id);
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = (me && me.signatureWidth) || 2.2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = (me && me.signatureColor) || '#1B2733';
  let drawing=false, lastX=0, lastY=0;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x: cx*(canvas.width/rect.width), y: cy*(canvas.height/rect.height)};
  }
  function start(e){ drawing=true; const p=pos(e); lastX=p.x; lastY=p.y; e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

function clearManualSignCanvas(){
  const canvas = document.getElementById('manualSignCanvas');
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
}

}

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = e=>resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function saveAccount(){
  const me = state.users.find(u=>u.id===state.user.id);
  const newName = document.getElementById('accName').value.trim();
  const newPass = document.getElementById('accPass').value.trim();
  const newEmail = document.getElementById('accEmail').value.trim();
  const newNameEn = document.getElementById('accNameEn').value.trim();
  const newIban = document.getElementById('accIban').value.trim();
  const newCivilId = document.getElementById('accCivilId').value.trim();
  const idInfoFile = document.getElementById('accIdFile').files[0];
  const bankInfoFile = document.getElementById('accBankFile').files[0];
  const signModeEl = document.getElementById('accSignatureMode');
  const signColorEl = document.getElementById('accSignColor');
  const signWidthEl = document.getElementById('accSignWidth');
  const idFile = document.getElementById('accSignFile').files[0];
  const bankFile = document.getElementById('accStampFile').files[0];
  const stampFile2 = document.getElementById('accStampFile2') ? document.getElementById('accStampFile2').files[0] : null;

  const updates = {};
  if(newName){ updates.name = newName; }
  if(newPass){ updates.password = newPass; }
  updates.email = newEmail;
  updates.name_en = newNameEn;
  updates.iban = newIban;
  updates.national_id = newCivilId;
  if(idInfoFile){ updates.id_file_data = await readFileAsDataURL(idInfoFile); }
  if(bankInfoFile){ updates.bank_file_data = await readFileAsDataURL(bankInfoFile); }
  if(signModeEl){ updates.signature_mode = signModeEl.value; }
  if(signColorEl){ updates.signature_color = signColorEl.value; }
  if(signWidthEl){ updates.signature_width = parseFloat(signWidthEl.value); }
  if(idFile){ updates.signature_data = await readFileAsDataURL(idFile); }
  else if(state.pendingCanvasSignature){ updates.signature_data = state.pendingCanvasSignature; }
  if(bankFile){ updates.stamp_data = await readFileAsDataURL(bankFile); }
  if(stampFile2){ updates.stamp_data_2 = await readFileAsDataURL(stampFile2); }

  const updResult = await db.from('users').update(updates).eq('id', me.id);
  if(!(await dbCheck(updResult, 'حفظ بيانات الحساب'))) return;
  if(updates.name){ me.name = updates.name; state.user.name = updates.name; }
  if(updates.password) me.password = updates.password;
  me.email = updates.email;
  me.nameEn = updates.name_en;
  me.iban = updates.iban;
  me.civilId = updates.national_id;
  if(updates.id_file_data) me.idFileData = updates.id_file_data;
  if(updates.bank_file_data) me.bankFileData = updates.bank_file_data;
  if(updates.signature_mode) me.signatureMode = updates.signature_mode;
  if(updates.signature_color) me.signatureColor = updates.signature_color;
  if(updates.signature_width) me.signatureWidth = updates.signature_width;
  if(updates.signature_data) me.signatureData = updates.signature_data;
  if(updates.stamp_data) me.stampData = updates.stamp_data;
  if(updates.stamp_data_2) me.stampData2 = updates.stamp_data_2;

  if(me.nameEn && me.iban){
    let master = state.beneficiaries.find(x=>x.name===me.name);
    const payload = {name: me.name, name_en: me.nameEn, iban: me.iban};
    if(me.idFileData) payload.id_file_data = me.idFileData;
    if(me.bankFileData) payload.bank_file_data = me.bankFileData;
    await dbCheck(await db.from('beneficiaries_master').upsert(payload, {onConflict:'name'}), 'حفظ بيانات المستفيد');
    if(!master){
      state.beneficiaries.push({name: me.name, nameEn: me.nameEn, iban: me.iban, idFileData: me.idFileData||'', bankFileData: me.bankFileData||''});
    } else {
      master.nameEn = me.nameEn; master.iban = me.iban;
      if(me.idFileData) master.idFileData = me.idFileData;
      if(me.bankFileData) master.bankFileData = me.bankFileData;
    }
  }

  if(state.returnTo){
    state.activeReqId = state.returnTo;
    state.returnTo = null;
    state.view = 'detail';
  } else {
    state.view = 'dashboard';
  }
  showToast('تم حفظ بياناتك', 'success');
  state.pendingCanvasSignature = null;
  render();
}

  const req = state.requests.find(r=>r.id===state.rejectModalReqId);

  await pushHistory(req, {step:req.status, actor: state.user.name, userId: state.user.id, action:'رفض الطلب', note, time: fmtDate()});
  const rgroup = req.status==='pending_decision' ? currentDecisionGroup(req) : [];
  const step = req.status==='pending_decision' ? (rgroup.find(s=>s.approverId===state.user.id) || currentDecisionStep(req)) : (req.approvalSteps||[]).find(s=>s.roleLabel===req.status);
  if(step){
    await db.from('request_approval_steps').update({status:'rejected', acted_at:new Date().toISOString(), note}).eq('id', step.id);
    step.status='rejected'; step.actedAt=new Date().toISOString();

  }
  await setRequestStatus(req, 'rejected');
  showToast('تم رفض الطلب', 'success');
  render();
}

function generateQRSvg(text, sizePx){
  try{
    if(typeof qrcode==='undefined') return '';
    let qr = null;
    for(let tn=4; tn<=40 && !qr; tn+=2){
      try{
        const candidate = qrcode(tn, 'L');
        candidate.addData(text);
        candidate.make();
        qr = candidate;
      }catch(innerErr){ qr = null; }
    }
    if(!qr) return '';
    const count = qr.getModuleCount();
    const cellSize = sizePx / count;
    let rects = '';
    for(let r=0;r<count;r++){
      for(let c=0;c<count;c++){
        if(qr.isDark(r,c)){
          rects += `<rect x="${(c*cellSize).toFixed(2)}" y="${(r*cellSize).toFixed(2)}" width="${(cellSize+0.5).toFixed(2)}" height="${(cellSize+0.5).toFixed(2)}"/>`;
        }
      }
    }
    return `<svg viewBox="0 0 ${sizePx} ${sizePx}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;shape-rendering:crispEdges;"><rect width="100%" height="100%" fill="#fff"/><g fill="#111">${rects}</g></svg>`;
  }catch(e){
    console.error('تعذر توليد رمز QR', e);
    return '';
  }
}
function renderRequestQRCode(req, extraClass){
  try{
  const verifyUrl = 'https://ahmedatifqyam.github.io/qyam-sarf/?verify=' + encodeURIComponent(req.id);

  if(!svg) return '';
  return `
    <div class="request-qr-block${extraClass ? ' '+extraClass : ''}">

  }catch(e){
    console.error('تعذر عرض رمز QR', e);
    return '';
  }
}

function findApprovalEntryForRole(req, role){
  const matches = req.history.filter(h=>{
    if(h.action!=='اعتماد') return false;
    const u = state.users.find(x=>x.id===h.userId);
    return u && u.role===role;
  });
  return matches.length ? matches[matches.length-1] : null;
}

  if(role==='cfo') return req.history.find(h=>h.step==='pending_transfer_approval' && h.action==='اعتماد') || null;
  return findApprovalEntryForRole(req, role);
}

function buildBeneficiaryTable(b, i){

function mmToPx(mm){
  const ref = document.createElement('div');
  ref.style.cssText = `position:absolute;visibility:hidden;height:${mm}mm;width:0;`;
  document.body.appendChild(ref);
  const px = ref.getBoundingClientRect().height;
  document.body.removeChild(ref);
  return px;
}

function measureAndPaginateBeneficiaries(req, headerHtml, footerHtml, signatureOverlayHtml){

  const PAGE_HEIGHT_MM = 297;
  const CONTENT_WIDTH_MM = 200;

  try{
    const maxContentPx = mmToPx(PAGE_HEIGHT_MM - LETTERHEAD_TOP_MM - LETTERHEAD_BOTTOM_MM);

    const measureDiv = document.createElement('div');
    measureDiv.className = 'print-measure';
    measureDiv.style.cssText = `position:absolute;visibility:hidden;top:-9999px;left:-9999px;width:${CONTENT_WIDTH_MM}mm;font-family:'Times New Roman', Times, serif;`;
    document.body.appendChild(measureDiv);

    measureDiv.innerHTML = headerHtml;
    const headerPx = measureDiv.getBoundingClientRect().height;

    measureDiv.innerHTML = footerHtml;
    const footerPx = measureDiv.getBoundingClientRect().height;

    const continuationLineHtml = '<p class="doc-body-text" style="margin-top:0;font-weight:700;">تابع جدول المستفيدين:</p>';
    measureDiv.innerHTML = continuationLineHtml;
    const continuationPx = measureDiv.getBoundingClientRect().height;

    measureDiv.innerHTML = buildAmountTableHeader();
    const theadPx = measureDiv.getBoundingClientRect().height;

    // كل مستفيد الآن جدول مستقل بحد ذاته، فقياس ارتفاعه مباشر وبسيط بدون تعقيد rowspan
    const groupHeights = req.beneficiaries.map((b,i)=>{
      measureDiv.innerHTML = buildBeneficiaryTable(b, i);
      return measureDiv.getBoundingClientRect().height;
    });

    document.body.removeChild(measureDiv);

    const chunks = [];
    let currentChunk = [];
    let used = headerPx + theadPx;
    req.beneficiaries.forEach((b,i)=>{
      const h = groupHeights[i] || 0;
      if(used + h > maxContentPx && currentChunk.length>0){
        chunks.push(currentChunk);
        currentChunk = [];
        used = continuationPx + theadPx;
      }
      currentChunk.push(b);
      used += h;
    });
    if(currentChunk.length>0 || chunks.length===0) chunks.push(currentChunk);

    if(used + footerPx > maxContentPx){
      const lastChunk = chunks[chunks.length-1];
      if(lastChunk && lastChunk.length>1){
        // اسحب آخر مستفيد من الصفحة الأخيرة ليرافق الإجمالي والتوقيعات بالصفحة الجديدة
        // (بدل ما تكون صفحة فاضية تماماً من أي مستفيد)
        const pulled = lastChunk.pop();
        chunks.push([pulled]);
      } else {
        chunks.push([]);
      }
    }
    return chunks;
  }catch(e){
    console.error('تعذر قياس تقسيم الصفحات، استخدام التقسيم الاحتياطي', e);
    const MAX_PER_PAGE = 10;
    const MAX_LAST_PAGE = 5;
    const fallback = [];
    for(let idx=0; idx<req.beneficiaries.length; idx+=MAX_PER_PAGE){
      fallback.push(req.beneficiaries.slice(idx, idx+MAX_PER_PAGE));
    }
    if(fallback.length===0) fallback.push([]);
    if(fallback[fallback.length-1].length > MAX_LAST_PAGE){
      fallback.push([]);
    }
    return fallback;
  }
}

  const signatureOverlay = renderSignatureArea(req);

  const chunks = measureAndPaginateBeneficiaries(req, header, footer, signatureOverlay);

  let offset = 0;

  return pages;

function renderPrintPreview(app){
  const req = state.requests.find(r=>r.id===state.activeReqId);

  const reqCompany = state.companies.find(c=>c.id===req.companyId);
  let letterhead = (reqCompany && reqCompany.logoData) ? reqCompany.logoData : LETTERHEAD_IMG;
  if(req.origin==='center' && req.centerId){
    const lhUnit = effectiveLetterheadUnit(req.centerId);   // الوحدة أو أقرب وحدة أم لها ترويسة
    if(lhUnit) letterhead = lhUnit.letterheadData;
  }

  const attachmentImages = [];
  req.beneficiaries.forEach(b=>{
    const master = state.beneficiaries.find(x=>x.name===b.name);
    if(master){
      if(master.idFileData) attachmentImages.push({name:b.name, img:master.idFileData});
      if(master.bankFileData) attachmentImages.push({name:b.name, img:master.bankFileData});
    }
  });

  const letterPages = renderLetterPages(req);

  const USABLE_W_MM = 189.68, USABLE_H_MM = 276.68, TITLE_RESERVE_MM = 10;
  const PX_TO_MM = 25.4 / 96;
  const dims = state.attachmentDims || {};
  const items = attachmentImages.map(a=>{
    const d = dims[a.img] || {w:1,h:1};
    let wMM = d.w * PX_TO_MM, hMM = d.h * PX_TO_MM;
    if(wMM > USABLE_W_MM){ hMM = hMM * (USABLE_W_MM / wMM); wMM = USABLE_W_MM; }
    if(hMM > USABLE_H_MM){ wMM = wMM * (USABLE_H_MM / hMM); hMM = USABLE_H_MM; }
    const dispH = hMM + TITLE_RESERVE_MM;
    return {...a, wMM, hMM, dispH};
  });
  const attachmentChunks = [];
  let curChunk = [], curH = 0;
  items.forEach(item=>{
    if(curH + item.dispH > USABLE_H_MM && curChunk.length>0){
      attachmentChunks.push(curChunk); curChunk = []; curH = 0;
    }
    curChunk.push(item); curH += item.dispH;
  });
  if(curChunk.length) attachmentChunks.push(curChunk);

  const cancelledWatermark = req.isCancelled ? `<div class="print-watermark">ملغى</div>` : '';

  const totalPages = letterPages.length + attachmentChunks.length;
  const footerSpec = printFooterSpec(req);
  const mainContentHtml = letterPages.map((pageHtml, idx)=>`
    <div class="doc-page with-letterhead" style="background-image:url('${letterhead}')">
      ${cancelledWatermark}
      ${pageHtml}
      ${renderRequestQRCode(req)}
      ${footerHtml(footerSpec, idx+1, totalPages)}
    </div>`).join('');

  const attachmentPages = attachmentChunks.map((chunk,i)=>`
    <div class="doc-page attachment-page attachment-flow-page">
      ${chunk.map(a=>`
        <div class="attachment-flow-block">
          <div class="attachment-title">مرفقات المستفيد: ${a.name}</div>
          <img src="${a.img}" style="width:${a.wMM.toFixed(1)}mm;height:${a.hMM.toFixed(1)}mm;cursor:zoom-in;" onclick="openFilePreviewModal('${a.img}', 'مرفق ${a.name}')">
        </div>
      `).join('')}
      ${footerHtml(footerSpec, i+1, attachmentChunks.length, 'مرفقات — ')}
    </div>`).join('');

  app.innerHTML = `
    <div class="preview-bar no-print">
      <span class="back-link" onclick="state.view='detail'; render();" style="margin:0;">→ رجوع للطلب</span>
      <button class="btn btn-primary btn-lg" onclick="window.print()">طباعة / تحميل PDF</button>
    </div>
    <p class="sub no-print">هذه معاينة مطابقة تماماً للصفحات التي ستُطبع أو تُحفظ كملف PDF (${totalPages} صفحة). يمكن تحميل أي مرفق بالضغط عليه ثم زر "تحميل" بالنافذة اللي تفتح.</p>
    <div class="doc-pages-wrap">
      ${mainContentHtml}
    </div>
    ${attachmentPages}
  `;
}

// ينسخ أزرار الصفوف الرئيسية للصفحة (الموسومة data-bar-actions) إلى الشريط السفلي العام، وتبقى الأصلية بمكانها
// يضمن وجود الشريط السفلي داخل #app (صفحة الهيكل تُرسم أحياناً بعد الانتظار أو تُعاد جزئياً فتمسح الشريط)
function ensureBottomBar(){
  const app = document.getElementById('app'); if(!app) return;
  // عند صفحة إنشاء/تعديل الطلب: أخفِ global-floating-bar وأظهر sticky-submit-bar فقط
  if(state.view==='newRequest'){
    const gfb = document.querySelector('.global-floating-bar');
    if(gfb) gfb.style.display='none';
    syncBottomBarMetrics();
    return;
  }
  // في باقي الصفحات: أظهر global-floating-bar وأخفِ sticky-submit-bar
  const gfb = document.querySelector('.global-floating-bar');
  if(gfb) gfb.style.display='';
  if(app.querySelector('.global-floating-bar')) { moveRowsToBottomBar(); syncBottomBarMetrics(); return; }
  const html = renderGlobalFloatingBar();
  if(html) app.insertAdjacentHTML('beforeend', html);
  moveRowsToBottomBar();
  syncBottomBarMetrics();
}
function moveRowsToBottomBar(){
  const target = document.querySelector('.global-floating-bar .gfb-actions');
  if(!target) return;
  document.querySelectorAll('#app [data-bar-actions]').forEach(row=>{
    const key = row.getAttribute('data-bar-key');
    if(key && state.barToggles && state.barToggles[key]===false) return; // هذا الزر مخفي من الشريط السفلي حسب إعداد الأدمن
    // نسطّح الأزرار: أي حاوية وسيطة (مثل زوج معاينة/تحميل) تُفكّك، فيدخل كل زر مباشرة بالصف الواحد
    const flat = [];
    Array.from(row.children).forEach(ch=>{
      if(ch.tagName==='BUTTON' || ch.tagName==='A') flat.push(ch);
      else { const inner = ch.querySelectorAll('button'); if(inner.length) inner.forEach(x=>flat.push(x)); else flat.push(ch); }
    });
    flat.forEach(btn=>{
      const copy = btn.cloneNode(true);
      copy.removeAttribute('id');
      // الشريط السفلي كله بالحجم الخامس (105×40): أزيل أي حجم آخر. الزر المزدوج يبقى سطره الأول فقط، ونصه الكامل في التلميح
      copy.className = copy.className.replace(/\bbtn-(lg2?|md2?|sm2?|xs2?)\b/g,'').trim() + ' btn-sm';
      if(copy.querySelector('.bl1')){
        const full = Array.from(copy.querySelectorAll('span')).map(x=>x.textContent.trim()).filter(Boolean).join(' ');
        const first = copy.querySelector('.bl1').textContent.trim();
        copy.textContent = first;
        if(!copy.getAttribute('title')) copy.setAttribute('title', full);
      }
      target.appendChild(copy);
    });
  });
}
// يضبط ارتفاع الشريط السفلي الفعلي: مسافة تمرير الحقول + الفاصل السفلي + زر الميزانية العائم
function syncBottomBarMetrics(){
  const bar = document.querySelector('.global-floating-bar') || document.querySelector('.sticky-submit-bar');
  const h = bar ? Math.ceil(bar.getBoundingClientRect().height) : 0;
  document.documentElement.style.setProperty('--bar-h', h + 'px');
  document.querySelectorAll('.gfb-spacer').forEach(sp=>{ sp.style.height = (h + 10) + 'px'; });
}
window.addEventListener('resize', syncBottomBarMetrics);
// عند الانتقال لحقل (Tab أو ضغط)، لا يبقى مخفياً خلف الشريط السفلي
document.addEventListener('focusin', function(e){
  const el = e.target;
  if(!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.closest('.modal-box')) return;
  setTimeout(()=>{
    const bar = document.querySelector('.global-floating-bar') || document.querySelector('.sticky-submit-bar');
    if(!bar) return;
    const overlap = el.getBoundingClientRect().bottom - (bar.getBoundingClientRect().top - 12);
    if(overlap > 0) window.scrollBy({top: overlap, behavior:'auto'});
  }, 60);
});

function exportAnalyticsCSV(){
  const rows = state._analyticsRows || [];

  csv += 'الجهة,عدد الطلبات المصروفة,إجمالي المصروف (د.ك)\n';
  rows.forEach(r=>{ csv += `"${r.name}",${r.count},${r.total}\n`; });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `تقرير-مالي-${meta.selYear||''}-${meta.selMonth||'all'}.csv`;

}

function renderAnalytics(app){
  if(canSeeExec() && (state.analyticsTab||'exec')==='exec'){ renderExecTab(app); return; }
  const role = state.user.role;
  const me = state.users.find(u=>u.id===state.user.id);
  const scopedToOwnCenter = ['employee','dept_manager'].includes(role) && !!me.centerId;
  const myCenterId = scopedToOwnCenter ? me.centerId : null;

  const now = new Date();
  const selYear = state.analyticsYear || now.getFullYear();
  const selMonth = state.analyticsMonth || 'all';

  const years = new Set([now.getFullYear()]);
  state.requests.forEach(r=>{ if(r.createdAtRaw) years.add(new Date(r.createdAtRaw).getFullYear()); });
  const yearsList = Array.from(years).sort((a,b)=>b-a);

  const buckets = {};
  if(!scopedToOwnCenter){
    buckets['company'] = {name:'مصروفات الشركة المباشرة', total:0, count:0};
  }
  state.centers.forEach(c=>{
    if(scopedToOwnCenter && c.id!==myCenterId) return;
    buckets[c.id] = {name:c.name, total:0, count:0};
  });

    if(r.status!=='completed') return;
    if(!r.createdAtRaw) return;

    if(selMonth!=='all' && (d.getMonth()+1)!==Number(selMonth)) return;

  const months = [

        return `<div style="padding:12px 0;border-top:1px solid var(--line);"><b style="display:block;margin-bottom:8px;">${c.name}</b>${monthlyHtml}${annualHtml}</div>`;
      }).join('');

function toggleSignatureCanvas(){
  const wrap = document.getElementById('signCanvasWrap');
  wrap.style.display = wrap.style.display==='none' ? 'block' : 'none';
}

function setupSignatureCanvas(){
  const canvas = document.getElementById('signCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  function applyStyle(){
    const colorEl = document.getElementById('accSignColor');
    const widthEl = document.getElementById('accSignWidth');
    ctx.strokeStyle = colorEl ? colorEl.value : '#1B2733';
    ctx.lineWidth = widthEl ? parseFloat(widthEl.value) : 2.2;
  }
  ctx.lineCap = 'round';
  applyStyle();
  const colorEl = document.getElementById('accSignColor');
  const widthEl = document.getElementById('accSignWidth');
  if(colorEl) colorEl.addEventListener('change', applyStyle);
  if(widthEl) widthEl.addEventListener('change', applyStyle);
  let drawing = false, lastX=0, lastY=0;

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x: cx * (canvas.width/rect.width), y: cy * (canvas.height/rect.height)};
  }
  function start(e){ drawing = true; const p = pos(e); lastX=p.x; lastY=p.y; e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
    lastX=p.x; lastY=p.y; e.preventDefault();
  }
  function end(){ drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

function clearSignatureCanvas(){
  const canvas = document.getElementById('signCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('canvasSignStatus').textContent = '';
  state.pendingCanvasSignature = null;
}

function confirmSignatureCanvas(){
  const canvas = document.getElementById('signCanvas');
  state.pendingCanvasSignature = canvas.toDataURL('image/png');
  document.getElementById('canvasSignStatus').textContent = '✓ تم اعتماد التوقيع المرسوم — اضغط "حفظ" لتثبيته';
  document.getElementById('canvasSignStatus').style.color = 'var(--green)';
}


const SIG_DESIGNER_SCALE = 40; // بكسل لكل سنتيمتر

// ===================== التوقيعات بالتسلسل: موضع كل صندوق = موضع الخطوة بمسار الطلب =====================
const SIG_SEQ_RX = /^seq(\d+)_(\d+)$/;
const ORG_UNIT_ID = '__org_mgmt__';
const ORG_UNIT = {id:'__org_mgmt__', name:'إدارة المؤسسة', kind:'org', scope:'org', companyId:null, code:'ORG', parentId:null, letterheadData:'', footerMode:'company', footerText:''};

}
// يُعيد وحدة المؤسسة سواء كانت محفوظة أو من الثابت
function getOrgUnit(){ return state.centers.find(c=>c.scope==='org') || {...ORG_UNIT}; }
const SIG_ELEMENTS = ['stamp','signature','name','title','step','date'];
const SIG_FONTS = [
  {v:'', label:'الافتراضي (Tahoma)', sure:true}, {v:'Arial, sans-serif', label:'Arial', sure:true},
  {v:'"Times New Roman", serif', label:'Times New Roman', sure:true}, {v:'"Segoe UI", sans-serif', label:'Segoe UI', sure:true},
  {v:'"Traditional Arabic", serif', label:'Traditional Arabic', sure:false}, {v:'"Simplified Arabic", serif', label:'Simplified Arabic', sure:false},
  {v:'"Sakkal Majalla", serif', label:'Sakkal Majalla', sure:false}, {v:'Cairo, sans-serif', label:'Cairo (يحتاج إنترنت)', sure:false}
];
function seqKey(n, i){ return 'seq'+n+'_'+i; }
function sigRoleLabel(role){
  const m = SIG_SEQ_RX.exec(role||'');
  if(m) return 'الموضع '+m[2]+(m[2]==='1' ? ' — منشئ الطلب' : '');
  return findRole(role).name;
}
function currentSigCompany(){ return state.companies.find(c=>c.id===state.currentCompanyId) || {}; }
// مستطيل الصندوق رقم i (1 = المنشئ بأقصى اليمين، والبقية تبدأ من اليسار نحو اليمين افتراضياً)
// هندسة مواضع التوقيعات الافتراضية
// القاعدة:
//   الموضع 1 (المنشئ):   أقصى اليمين، نفس مقاس الصندوق، عناصره أصغر (k=0.82) — دائماً
//   الموضع N-1 و N عند N≥6: صغيران عمودياً (فوق بعض) أقصى اليسار، نفس مقاس الصندوق، عناصرهما أصغر (k=0.82)
//   المواضع الوسطى 2..N-2: صف واحد (أو صفان لو زادوا عن 4) بالحجم الكبير (k=1)
//   عند N≤5: كل المواضع 2..N بالحجم الكبير في الصف الأساسي
// ===================== هندسة التوقيعات الافتراضية (النسخة النهائية) =====================
// القاعدة:
//   N<=6: [2][3]..[N][1منشئ]  — الكبار يساراً ثم المنشئ
//   N=7:  [2][3][4][5][6↑/7↓][1منشئ]  — كبار ثم عمود صغير ثم المنشئ
//   N=8:  [2][3][4][5↑/8↓][6↑/7↓][1منشئ] — كبار ثم عمودان صغيران ثم المنشئ
//   الشريط المصغّر: صف واحد بنفس الترتيب
function seqBoxRect(context, N, i, dir){
  const W = 20*SIG_DESIGNER_SCALE, H = SIG_DESIGNER_CONTEXTS[context].heightCm*SIG_DESIGNER_SCALE;
  const gap = 6, pad = 4;
  // عدد الأعمدة الصغيرة (أزواج فوق/تحت): 0 عند N<=6، 1 عند N=7، 2 عند N=8
  const smallCols = Math.max(0, N - 6);
  const bigCount  = N - 1 - smallCols * 2;   // عدد الكبار (بلا منشئ)
  const totalCols = bigCount + smallCols + 1; // كبار + صغار + منشئ
  const bw     = (W - pad*2 - gap*(totalCols-1)) / totalCols;
  const bh_big = H - pad*2;
  const bh_sm  = (H - pad*2 - gap) / 2;
  // ترتيب الأعمدة من اليسار:
  //   0..bigCount-1        → الكبار (2، 3، 4...)
  //   bigCount..bigCount+smallCols-1 → الصغار (أزواج فوق/تحت)
  //   totalCols-1          → المنشئ (1)
  // الشريط المصغّر: نفس الترتيب بصف واحد
  if(context==='mini'){
    const bwM = (W - pad*2 - gap*(totalCols-1)) / totalCols;
    const bh_full = H - pad*2;
    const bh_half = (H - pad*2 - gap) / 2;
    if(i===1) return {x:pad+(totalCols-1)*(bwM+gap), y:pad, w:bwM, h:bh_full, isSmall:true};
    if(i>=2 && i<=bigCount+1){
      const idx = (dir==='rtl') ? (bigCount-(i-2)-1) : (i-2);
      return {x:pad+idx*(bwM+gap), y:pad, w:bwM, h:bh_full, isSmall:false};
    }
    const firstSmall = bigCount+2;
    for(let c=0;c<smallCols;c++){
      const topPos = firstSmall+c, botPos = N-c;
      const colX = pad+(bigCount+c)*(bwM+gap);
      if(i===topPos) return {x:colX, y:pad,           w:bwM, h:bh_half, isSmall:true};
      if(i===botPos) return {x:colX, y:pad+bh_half+gap, w:bwM, h:bh_half, isSmall:true};
    }
    return {x:pad, y:pad, w:bwM, h:bh_full, isSmall:false};
  }
  // المنشئ
  if(i===1) return {x:pad+(totalCols-1)*(bw+gap), y:pad, w:bw, h:bh_big, isSmall:true};
  // الكبار: 2..bigCount+1 → أعمدة 0..bigCount-1
  if(i>=2 && i<=bigCount+1){
    const idx = (dir==='rtl') ? (bigCount-(i-2)-1) : (i-2);
    return {x:pad+idx*(bw+gap), y:pad, w:bw, h:bh_big, isSmall:false};
  }
  // الصغار: يأتون بعد الكبار
  // N=7: firstSmall=6, زوج0: top=6,bot=7 → عمود bigCount
  // N=8: firstSmall=5, زوج0: top=5,bot=8 → عمود bigCount، زوج1: top=6,bot=7 → عمود bigCount+1
  const firstSmall = bigCount+2;
  for(let c=0;c<smallCols;c++){
    const topPos = firstSmall+c, botPos = N-c;
    const colX = pad+(bigCount+c)*(bw+gap);
    if(i===topPos) return {x:colX, y:pad,          w:bw, h:bh_sm, isSmall:true};
    if(i===botPos) return {x:colX, y:pad+bh_sm+gap, w:bw, h:bh_sm, isSmall:true};
  }
  return {x:pad, y:pad, w:bw, h:bh_big, isSmall:false}; // fallback
}
function defaultSeqConfig(context, N, i, dir){
  const R = seqBoxRect(context, N, i, dir||'ltr');
  // k=0.82 للمنشئ والموضعَين التنفيذيَّين الصغيرَين (N-1 و N عند N≥6)؛ k=1 لبقية المواضع
  const k = R.isSmall ? 0.82 : 1;
  const q = (fx,fy,fw,fh)=>({x:R.x+fx*R.w, y:R.y+fy*R.h, w:fw*R.w, h:fh*R.h});
  const r1 = v=>Math.round(v*10)/10;
  if(context==='mini'){
    // mini: التوقيع ظاهر ويملأ الصندوق، بقية العناصر مرتّبة (title→name→sig→stamp→date→step) لكن مخفية
    return {
      title:     {visible:false, ...q(.04,.02,.92,.18), fontSize:r1(7*k),   fontWeight:'700'},
      name:      {visible:false, ...q(.04,.21,.92,.18), fontSize:r1(6.5*k), fontWeight:'400'},
      signature: {visible:true,  ...q(.05,.05,.90,.90)},
      stamp:     {visible:false, ...q(.05,.50,.90,.30)},
      date:      {visible:false, ...q(.04,.82,.92,.12), fontSize:5,          fontWeight:'400'},
      step:      {visible:false, ...q(.04,.94,.92,.05), fontSize:r1(5*k),   fontWeight:'400'}
    };
  }
  // ترتيب: المسمى → الاسم → التوقيع → الختم → التاريخ → اسم الخطوة
  // كل العناصر في الـ80% العلوي (0.0→0.80)، 20% سفلي فراغ
  return {
    title:     {visible:true,  ...q(.04,.02,.92,.14), fontSize:r1(11*k), fontWeight:'700'},
    name:      {visible:true,  ...q(.04,.17,.92,.13), fontSize:r1(9*k),  fontWeight:'400'},
    signature: {visible:true,  ...q(.05,.31,.90,.26)},
    stamp:     {visible:true,  ...q(.05,.58,.90,.19)},
    date:      {visible:true,  ...q(.04,.78,.92,.10), fontSize:r1(7*k),  fontWeight:'400'},
    step:      {visible:true,  ...q(.04,.88,.92,.10), fontSize:r1(6.5*k),fontWeight:'400'}
  };
}
// يُكمل أي عنصر ناقص (مثل «اسم الخطوة» بتكوين قديم) من الافتراضي دون المساس بما ضُبط
function ensureSigCfg(cfg, context, role){
  const m = SIG_SEQ_RX.exec(role||'');
  const base = m ? defaultSeqConfig(context, +m[1], +m[2], currentSigCompany().signatureDir||'ltr') : defaultSigDesignerConfig(role, context);
  SIG_ELEMENTS.forEach(t=>{ if(!cfg[t]) cfg[t] = {...(base[t]||{visible:false,x:0,y:0,w:40,h:20}), visible:false}; });
  return cfg;
}
function useSeqSigs(req){
  const co = state.companies.find(c=>c.id===req.companyId) || {};
  return (co.signatureMode||'seq')!=='role' && (req.approvalSteps||[]).length>0;
}
// صناديق الطلب بترتيبها: المنشئ، معتمِدو القرار، ثم الخطوات التنفيذية (كل خطوة صندوق ولو وقّعها الشخص نفسه)
function sigSlotsForRequest(req){
  const slots = [], userOf = id=>state.users.find(u=>u.id===id);
  const co = state.companies.find(c=>c.id===req.companyId) || {};
  const last = pred => [...(req.history||[])].reverse().find(pred) || null;
  const cu = userOf(req.createdById), first = (req.history||[])[0];
  slots.push({kind:'creator', user:cu, actor:(first&&first.actor)||req.createdBy||(cu&&cu.name)||'', time:(first&&first.time)||'', step:'', signed:true, sigOverride:''});
  const orders = [...new Set((req.approvalSteps||[]).map(x=>x.sequenceOrder))].sort((a,b)=>a-b);
  orders.forEach(ord=>{
    const rows = req.approvalSteps.filter(x=>x.sequenceOrder===ord);
    const ok = rows.find(x=>x.status==='approved');
    if(ok){
      const e = last(h=>h.action==='اعتماد' && h.userId===ok.approverId && h.step==='pending_decision') || last(h=>h.action==='اعتماد' && h.userId===ok.approverId);
      slots.push({kind:'decision', user:userOf(ok.approverId), actor:(e&&e.actor)||(userOf(ok.approverId)||{}).name||'', time:(e&&e.time)||'', step:'', signed:true, sigOverride:(e&&e.signatureOverride)||''});
    } else {
      const pr = rows.find(x=>x.kind!=='escalation') || rows[0];
      slots.push({kind:'decision', user:userOf(pr.approverId), actor:'', time:'', step:'', signed:false, sigOverride:''});
    }
  });
  const exec = (step, label, delegNote)=>{
    const e = last(h=>h.step===step && h.action==='اعتماد');
    slots.push({kind:'exec', user:e?userOf(e.userId):null, actor:e?e.actor:'', time:e?e.time:'', signed:!!e, sigOverride:(e&&e.signatureOverride)||'',
      step: label + ((e && delegNote && e.note==='بالتفويض عن المدير المالي') ? ' (بالتفويض)' : '')});
  };
  exec('pending_transfer_request', 'نفّذ التحويل');
  if((co.cfoDelegationMode||'normal')!=='skip') exec('pending_transfer_approval', 'اعتمد التحويل', true);
  const d = last(h=>h.action==='تم الصرف');
  slots.push({kind:'exec', user:d?userOf(d.userId):null, actor:d?d.actor:'', time:d?d.time:'', step:'أكّد الصرف', signed:!!d, sigOverride:''});
  return slots;
}
function renderSeqSignatures(req, context){
  const PX = 0.25, slots = sigSlotsForRequest(req), N = slots.length;
  const co = state.companies.find(c=>c.id===req.companyId) || {};
  const saved = (state.sigLayoutConfigs && state.sigLayoutConfigs[context]) || {};
  let html = '';
  slots.forEach((sl, idx)=>{
    if(!sl.signed) return;
    const key = seqKey(N, idx+1);
    const cfg = (saved[key] && Object.keys(saved[key]).length) ? ensureSigCfg(JSON.parse(JSON.stringify(saved[key])), context, key) : defaultSeqConfig(context, N, idx+1, co.signatureDir||'ltr');
    const u = sl.user;
    const title = u ? ((u.jobTitle && u.jobTitle.trim()) || findRole(u.role).name) : '';
    const sigImg = sl.sigOverride || (u && u.signatureData) || '', stampImg = (u && u.stampData) || '';
    const box = b => `position:absolute;left:${b.x*PX}mm;top:${b.y*PX}mm;width:${b.w*PX}mm;height:${b.h*PX}mm;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;`;
    const txt = (t, text, cls, dfltW)=>{
      const b = cfg[t]; if(!b || !b.visible || !text) return '';
      const fam = b.fontFamily ? `font-family:${b.fontFamily};` : '';
      return `<div class="${cls}" style="${box(b)}font-size:${b.fontSize||9}px;font-weight:${b.fontWeight||dfltW};${fam}line-height:1.2;margin:0;">${escH(text)}</div>`;
    };
    const img = (t, src)=>{ const b = cfg[t]; return (b && b.visible && src) ? `<div style="${box(b)}"><img src="${src}" style="max-width:100%;max-height:100%;object-fit:contain;"></div>` : ''; };
    html += txt('title', title, 'sign-role-title', '700') + txt('name', sl.actor, 'sign-name', '400') + txt('step', sl.step, 'sign-step', '400')
          + img('signature', sigImg) + img('stamp', stampImg) + txt('date', toWesternDigits(sl.time)||'', 'sign-date', '400');
  });
  if(!html) return '';
  return context==='mini' ? `<div class="sign-mini-overlay">${html}</div>` : `<div class="sign-final-block-v2">${html}</div>`;
}

    step:      {visible:false,x:ox+10, y:214, w:slotW-20, h:14, fontSize:8}
  };
}
async function loadSigDesignerConfig(){
  let role = state.sigDesignerRole;
  if(!role || !sigDesignerKeys().includes(role)){ role = sigDesignerKeys()[0]; state.sigDesignerRole = role; }
  const context = state.sigDesignerContext || 'final';
  state.sigDesignerConfigFor = role+'|'+context;
  try{
    const {data, error} = await db.from('signature_layout_configs').select('*').eq('role', role).eq('context', context).maybeSingle();
    if(error) throw error;
    state.sigDesignerConfig = (data && data.config && Object.keys(data.config).length) ? data.config : defaultSigDesignerConfig(role, context);
  }catch(e){
    console.error('تعذر تحميل تكوين محرر التوقيعات (تأكد من تشغيل آخر نسخة من ملف SQL)', e);
    state.sigDesignerConfig = defaultSigDesignerConfig(role, context);
    showToast('تعذر تحميل التكوين المحفوظ من قاعدة البيانات — تأكد من تشغيل آخر تحديث SQL. يمكنك المتابعة بالإعدادات الافتراضية.', 'error');
  }
  render();
}
async function saveSigDesignerConfig(){
  const role = state.sigDesignerRole;
  const context = state.sigDesignerContext || 'final';
  const result = await db.from('signature_layout_configs').upsert({id:'sig_'+context+'_'+role, role, context, config: state.sigDesignerConfig, updated_at: new Date().toISOString()});
  if(!(await dbCheck(result, 'حفظ تكوين مواقع التوقيعات'))) return;
  if(!state.sigLayoutConfigs) state.sigLayoutConfigs = {final:{}, mini:{}};
  if(!state.sigLayoutConfigs[context]) state.sigLayoutConfigs[context] = {};
  state.sigLayoutConfigs[context][role] = JSON.parse(JSON.stringify(state.sigDesignerConfig));
  showToast('تم حفظ تكوين "' + sigRoleLabel(role) + '"', 'success');
}
function switchSigDesignerRole(role){
  state.sigDesignerRole = role;

function switchSigDesignerContext(context){

function sigDesignerKeys(){

async function setSigCompanyField(field, col, val){
  const co = currentSigCompany(); if(!co.id) return;

  if(!(await dbCheck(r, 'حفظ إعداد التوقيعات'))) return;

function setSigSeqN(n){
  const newN = +n;
  // حافظ على رقم الموضع الحالي لو كان ضمن العدد الجديد
  const curM = SIG_SEQ_RX.exec(state.sigDesignerRole||'');
  const curPos = curM ? +curM[2] : 1;
  state.sigSeqN = newN;
  state.sigDesignerRole = (curPos<=newN) ? seqKey(newN, curPos) : seqKey(newN, 1);
  state.sigDesignerConfig = null;

async function applySlotToAllCounts(){
  const ctx = state.sigDesignerContext || 'final';
  const curKey = state.sigDesignerRole; if(!curKey) return;
  const m = SIG_SEQ_RX.exec(curKey); if(!m){ showToast('هذا الأمر للتوقيعات بالتسلسل فقط','error'); return; }
  const N = +m[1], pos = +m[2];
  const cfg = state.sigDesignerConfig; if(!cfg) return;
  // استخرج إعدادات كل العناصر: visible + x,y,w,h داخل الصندوق + خط
  const elemCfg = {};
  ['stamp','signature','name','title','step','date'].forEach(t=>{
    if(cfg[t]) elemCfg[t] = {visible:cfg[t].visible, x:cfg[t].x, y:cfg[t].y, w:cfg[t].w, h:cfg[t].h,
      fontSize:cfg[t].fontSize, fontWeight:cfg[t].fontWeight, fontFamily:cfg[t].fontFamily};
  });
  const updates = [];
  for(let n=3; n<=10; n++){
    if(n===N) continue;
    const targetKey = seqKey(n, pos);
    const ctxCfgs = (state.sigLayoutConfigs && state.sigLayoutConfigs[ctx]) || {};
    const rc = (ctxCfgs[targetKey] && Object.keys(ctxCfgs[targetKey]).length)
      ? JSON.parse(JSON.stringify(ctxCfgs[targetKey]))
      : defaultSeqConfig(ctx, n, pos, currentSigCompany().signatureDir||'ltr');
    ['stamp','signature','name','title','step','date'].forEach(t=>{
      if(elemCfg[t]) rc[t] = {...(rc[t]||{}), ...elemCfg[t]};
    });
    updates.push({id:'sig_'+ctx+'_'+targetKey, role:targetKey, context:ctx, config:rc, updated_at:new Date().toISOString()});
  }
  if(updates.length){
    const r = await db.from('signature_layout_configs').upsert(updates);
    if(!(await dbCheck(r,'تطبيق الإعدادات على كل الأعداد'))) return;
    if(!state.sigLayoutConfigs[ctx]) state.sigLayoutConfigs[ctx]={};
    updates.forEach(u=>{ state.sigLayoutConfigs[ctx][u.role]=u.config; });
  }
  state.sigDesignerConfigFor = null;
  showToast('تم تطبيق الموضع '+pos+' على كل الأعداد ('+(n=>n-1)(10)+' موضع محدَّث)','success');
}

function sigDesignerStartDrag(e, boxType, mode){
  e.preventDefault();
  e.stopPropagation();
  const b = state.sigDesignerConfig[boxType];
  state.sigDesignerDrag = {
    boxType, mode,
    startClientX: e.clientX, startClientY: e.clientY,
    startX: b.x, startY: b.y, startW: b.w, startH: b.h
  };
}
document.addEventListener('mousemove', function(e){
  const d = state.sigDesignerDrag;
  if(!d) return;
  const b = state.sigDesignerConfig[d.boxType];
  const dx = e.clientX - d.startClientX;
  const dy = e.clientY - d.startClientY;
  const canvasW = state.sigDesignerCanvasW || (20*SIG_DESIGNER_SCALE);
  const canvasH = state.sigDesignerCanvasH || (7*SIG_DESIGNER_SCALE);
  if(d.mode==='move'){
    b.x = Math.min(Math.max(0, d.startX + dx), canvasW - b.w);
    b.y = Math.min(Math.max(0, d.startY + dy), canvasH - b.h);
  } else {
    b.w = Math.min(Math.max(20, d.startW + dx), canvasW - b.x);
    b.h = Math.min(Math.max(20, d.startH + dy), canvasH - b.y);
  }
  const boxEl = document.querySelector(`.sig-designer-box[data-box-type="${d.boxType}"]`);
  if(boxEl){
    boxEl.style.left = b.x+'px';
    boxEl.style.top = b.y+'px';
    boxEl.style.width = b.w+'px';
    boxEl.style.height = b.h+'px';
    const dimsEl = boxEl.querySelector('.sig-designer-dims');
    if(dimsEl) dimsEl.textContent = (b.w/SIG_DESIGNER_SCALE).toFixed(1)+'×'+(b.h/SIG_DESIGNER_SCALE).toFixed(1)+' سم';
  }
});
document.addEventListener('mouseup', function(){
  state.sigDesignerDrag = null;
});

function renderCancelledArchive(app){
  const cancelled = state.requests.filter(r=>r.isCancelled && r.companyId===state.currentCompanyId)
    .sort((a,b)=> new Date(b.cancelledAt||0) - new Date(a.cancelledAt||0));
  const rows = cancelled.map(r=>{
    const canceller = state.users.find(u=>u.id===r.cancelledById);
    const cd = r.cancelledAt ? new Date(r.cancelledAt) : null;
    const dateStr = cd ? `${cd.getFullYear()}/${String(cd.getMonth()+1).padStart(2,'0')}/${String(cd.getDate()).padStart(2,'0')}` : '—';
    return `
      <div class="list-item">
        <div class="li-main">
          <b>${r.number}</b>

          <span class="sub" style="display:block;font-size:11.5px;">أُبطل بواسطة ${canceller ? canceller.name : '—'} بتاريخ ${dateStr}</span>

  app.innerHTML = wrapWithAdminSidebar(`

function filterAdminNav(q){
  q = (q||'').trim();
  document.querySelectorAll('#adminNavList [data-nav-group]').forEach(group=>{
    let anyVisible = false;
    group.querySelectorAll('[data-nav-item]').forEach(item=>{
      const match = !q || item.getAttribute('data-nav-label').includes(q);
      item.style.display = match ? '' : 'none';
      if(match) anyVisible = true;
    });
    group.style.display = anyVisible ? '' : 'none';
  });
}

async function addCompany(){
  const nameAr = document.getElementById('newCoNameAr').value.trim();
  const nameEn = document.getElementById('newCoNameEn').value.trim();
  const tax = document.getElementById('newCoTax').value.trim();
  const code = document.getElementById('newCoCode').value.trim();
  const hqCode = document.getElementById('newCoHqCode').value.trim() || 'HQ';
  const color = document.getElementById('newCoColor').value;
  const file = document.getElementById('newCoLogo').files[0];
  if(!nameAr || !code){ showToast('الرجاء إدخال اسم الشركة ورمزها على الأقل','error'); return; }
  const company = {id:'co_'+Date.now(), nameAr, nameEn, taxNumber:tax, code, hqCode, primaryColor:color, logoData:''};
  if(file){ company.logoData = await readFileAsDataURL(file); }
  const result = await db.from('companies').insert({id:company.id, name_ar:company.nameAr, name_en:company.nameEn, tax_number:company.taxNumber, code:company.code, hq_code:company.hqCode, primary_color:company.primaryColor, logo_data:company.logoData||null});
  if(!(await dbCheck(result, 'إضافة الشركة'))) return;
  state.companies.push(company);
  if(state.user.role==='admin') state.myCompanyIds.push(company.id);
  showToast('تمت إضافة الشركة', 'success');
  render();
}

async function addCenter(){
  const name = document.getElementById('newCenterName').value.trim();
  if(!name){ showToast('الرجاء إدخال اسم المركز','error'); return; }
  const code = document.getElementById('newCenterCode').value.trim();
  const file = document.getElementById('newCenterLetterhead').files[0];
  const kind = (document.getElementById('newCenterKind')||{}).value || 'center';
  const parentId = (document.getElementById('newCenterParent')||{}).value || null;
  const center = {id:'c_'+Date.now(), name, code, letterheadData:'', companyId: state.currentCompanyId, kind, scope:'company', parentId};
  if(file){ center.letterheadData = await readFileAsDataURL(file); }
  const result = await db.from('centers').insert({id:center.id, name:center.name, code:center.code, company_id:center.companyId, letterhead_data: center.letterheadData || null, kind, parent_id: parentId});
  if(!(await dbCheck(result, 'إضافة المركز'))) return;
  state.centers.push(center);
  showToast('تمت إضافة المركز', 'success');

// ===================== المرحلة الأولى: الهيكل التنظيمي، المستويات، ومسار الاعتماد (بيانات فقط — غير مفعّلة بمحرك الاعتماد) =====================
const DEFAULT_LEVEL_RANK = {senior_manager:1, executive_manager:2, cfo:3, dept_manager:4, accountant:5, employee:6};
function userRank(u){
  if(!u) return 999;
  if(u.levelId){ const lv = state.jobLevels.find(l=>l.id===u.levelId); if(lv) return lv.sortOrder; }
  if(DEFAULT_LEVEL_RANK[u.role]!=null) return DEFAULT_LEVEL_RANK[u.role];
  if(isCustomRole(u.role)){ const lv = jobRoleLevel(u.role, u.companyId); return lv ? lv.sortOrder : 6; }
  return 999;
}
function levelLabel(u){
  if(u.levelId){ const lv = state.jobLevels.find(l=>l.id===u.levelId); if(lv) return lv.name; }
  const names = {1:'المدير العام',2:'المدير التنفيذي',3:'المدير المالي',4:'مدير إدارة/مركز',5:'المحاسب',6:'موظف'};
  if(isCustomRole(u.role)){ const cr = state.customRoles.find(x=>x.id===u.role); return (cr && cr.defaultLevelName) || 'موظف'; }
  return names[DEFAULT_LEVEL_RANK[u.role]] || '—';
}
function levelsForCompany(companyId){
  return state.jobLevels.filter(l=>l.companyId===companyId).sort((a,b)=>a.sortOrder-b.sortOrder);
}
// هل للمستخدم وصول لهذي الشركة؟ (شركته الأساسية، أو مستخدم عام لكل الشركات، أو مربوط بها صراحة)
function userHasCompany(u, companyId){
  if(!u || !companyId) return false;
  return u.companyId===companyId || !!u.isGeneral || (state.userCompanyLinks||[]).some(l=>l.userId===u.id && l.companyId===companyId);
}
function companyUsers(companyId){
  return state.users.filter(u=>u.role!=='admin' && userHasCompany(u, companyId));
}
// معاينة مسار اعتماد طلب — حسب الحقلين "من يعتمد طلبه" و"من يعتمد ما اعتمده"، افتراضهما المدير المباشر
function computeApprovalChainPreview(userId){
  const requester = state.users.find(u=>u.id===userId);
  if(!requester) return {chain:[], error:'مستخدم غير موجود'};
  const chain = [];
  const visited = new Set([userId]);
  let currentId = requester.noRequestApprover ? null : (requester.requestApproverId || requester.managerId);
  let error = null;
  while(currentId){
    if(visited.has(currentId)){ error = 'حلقة دائرية: تكرر "'+((state.users.find(u=>u.id===currentId)||{}).name||currentId)+'"'; break; }
    if(chain.length>=20){ error = 'مسار طويل جداً (٢٠ خطوة فأكثر) — يُشتبه بحلقة دائرية'; break; }
    visited.add(currentId);
    const approver = state.users.find(u=>u.id===currentId);
    if(!approver) break;
    chain.push(approver);
    currentId = approver.noNextApprover ? null : (approver.nextApproverId || approver.managerId);
  }
  return {chain, error};
}
// فحص صحة الهيكل: حلقات دائرية بسلسلة المدير المباشر، ومدراء أقل مستوى من مرؤوسيهم، ومراكز بلا موظفين، ومدير تنفيذي بلا مدير
function computeStructureIssues(companyId){
  const issues = [];
  const users = companyUsers(companyId);
  users.forEach(u=>{
    if(!u.managerId) return;
    const seen = new Set([u.id]);
    let cur = u.managerId, hops = 0;
    while(cur && hops<25){
      if(seen.has(cur)){ issues.push({level:'error', text:'حلقة دائرية بسلسلة المدراء تشمل "'+u.name+'"'}); return; }
      seen.add(cur); hops++;
      const mgr = state.users.find(x=>x.id===cur);
      if(!mgr) break;
      cur = mgr.managerId;
    }
  });
  users.forEach(u=>{
    if(!u.managerId) return;
    const mgr = state.users.find(x=>x.id===u.managerId);
    if(mgr && userRank(mgr) >= userRank(u) && userRank(u)!==999){
      issues.push({level:'warn', text:'"'+mgr.name+'" مديرٌ لـ"'+u.name+'" رغم أن مستواه ليس أعلى منه'});
    }
  });
  state.centers.filter(c=>c.companyId===companyId && c.scope!=='org').forEach(c=>{
    const n = users.filter(u=>u.centerId===c.id).length;
    if(n===0) issues.push({level:'warn', text:'"'+c.name+'" ليس فيه أي موظف مرتبط به'});
  });
  users.filter(u=>u.role==='executive_manager' && !u.managerId).forEach(u=>{
    issues.push({level:'warn', text:'"'+u.name+'" (المدير التنفيذي) بلا مدير — طلباته لن يعتمدها أحد قبل التنفيذ'});
  });
  // --- سلامة الوحدات المتداخلة ---
  state.centers.filter(c=>c.companyId===companyId && c.scope!=='org').forEach(c=>{
    if(c.parentId){
      const par = state.centers.find(x=>x.id===c.parentId);
      if(!par) issues.push({level:'warn', text:'الوحدة "'+c.name+'" تتبع وحدة محذوفة — تُعامل الآن كوحدة جذرية'});
      else if(par.companyId!==c.companyId) issues.push({level:'error', text:'الوحدة "'+c.name+'" تتبع وحدة "'+par.name+'" من شركة أخرى'});
    }
    if(unitHasLoop(c)) issues.push({level:'error', text:'حلقة بالوحدات: "'+c.name+'" تعود لنفسها عبر الوحدات الأم'});
  });
  const co = state.companies.find(c=>c.id===companyId) || {};
  const mode = co.cfoDelegationMode || 'normal';
  // --- المدير المالي لا يرأس مدراء أعلى منه بالمسار ---
  users.filter(u=>u.role==='cfo').forEach(cfo=>{
    users.filter(x=>x.managerId===cfo.id && ['executive_manager','senior_manager'].includes(x.role)).forEach(x=>{
      issues.push({level:'warn', text:'"'+cfo.name+'" (المدير المالي) هو مدير "'+x.name+'" ('+findRole(x.role).name+') — الهرم مقلوب؛ المالي يعتمد التحويل فقط ولا يرأس مسار الاعتماد'});
    });
  });
  // --- شركة لا يوجد من ينفّذ مراحلها الأخيرة ---
  const hasCfo = users.some(u=>u.role==='cfo');
  if(mode==='normal' && !hasCfo) issues.push({level:'error', text:'لا يوجد مدير مالي مرتبط بالشركة — سيتعلق كل طلب عند مرحلة اعتماد التحويل (اربط مديراً مالياً بها، أو غيّر وضع اعتماد التحويل من إعدادات الشركة)'});
  if(!users.some(u=>u.role==='accountant')) issues.push({level:'error', text:'لا يوجد محاسب مرتبط بالشركة — لن يسجّل أحد التحويل ولا يؤكد الصرف'});
  if(mode==='delegate_user'){
    const du = state.users.find(x=>x.id===co.cfoDelegateUserId);
    if(!du) issues.push({level:'error', text:'وضع اعتماد التحويل "شخص محدد" بلا شخص مختار'});
    else if(co.cfoDelegateUntil){
      const d = new Date(); const t = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(t > co.cfoDelegateUntil) issues.push({level:'warn', text:'انتهى تفويض اعتماد التحويل ل"'+du.name+'" بتاريخ '+co.cfoDelegateUntil+' — عاد الاعتماد للمدير المالي'});
    }
  }
  // --- مدير تنفيذي لا يظهر بأي مسار ---
  const others = users.filter(u=>u.role!=='executive_manager');
  if(others.length){
    users.filter(u=>u.role==='executive_manager').forEach(ex=>{
      const inSomeChain = others.some(o=>computeApprovalChainPreview(o.id).chain.some(a=>a.id===ex.id));
      if(!inSomeChain) issues.push({level:'warn', text:'"'+ex.name+'" (المدير التنفيذي) لا يظهر في مسار اعتماد أي موظف بالشركة — تأكد أن المدراء يتبعونه'});
    });
  }
  // --- معتمد له مهلة لكن لا وجهة إحالة ممكنة ---
  users.filter(u=>!['employee','accountant','cfo'].includes(u.role)).forEach(u=>{
    if(!approverDeadlineDays(u, co)) return;
    const chosen = u.escalateMode || co.defaultEscalateMode || 'manager';
    if(chosen==='manager' && !managerForCompany(u, companyId)) issues.push({level:'warn', text:'"'+u.name+'" لديه مهلة اعتماد وإحالتها للمدير المباشر، لكن لا مدير له — لن تُحال خطوته عند التأخر'});
    if(chosen==='user' && !state.users.find(x=>x.id===u.escalateUserId)) issues.push({level:'warn', text:'"'+u.name+'" وجهة إحالته "شخص محدد" لكن لم يُختر شخص'});
  });
  return issues;
}
function genId(prefix){ return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }
// يلوّن أي اسم موظف بين علامتي تنصيص داخل نص ملاحظة الفحص، ليبرز عن باقي النص
function highlightIssueText(text){
  return text.split(/("[^"]+")/g).map(part=>{
    if(part.length>1 && part[0]==='"' && part[part.length-1]==='"'){
      const name = part.slice(1,-1);
      const u = state.users.find(x=>x.name===name);
      if(u){
        return '"<span onclick="event.stopPropagation();goEditUser(\''+u.id+'\')" style="color:var(--ink);font-weight:700;cursor:pointer;text-decoration:underline dotted;">'+escH(name)+'</span>"';
      }
      return '<b style="color:var(--ink);font-weight:700;">'+escH(part)+'</b>';
    }
    return escH(part);
  }).join('');
}

async function saveInlineEdit(kind, id){
  const val = (document.getElementById('inlineEditInput').value||'').trim();
  if(!val){ showToast('الاسم لا يجوز أن يكون فارغاً','error'); return; }
  const map = {
    org:   {table:'organizations', col:'name'},
    company:{table:'companies', col:'name_ar'},
    center: {table:'centers', col:'name'},
    jobTitle:{table:'users', col:'job_title'}
  };
  const m = map[kind];
  if(!m) return;
  const result = await db.from(m.table).update({[m.col]: val}).eq('id', id);
  if(!(await dbCheck(result, 'تعديل الاسم'))) return;
  if(kind==='org'){ const o = state.organizations.find(x=>x.id===id); if(o) o.name = val; }
  else if(kind==='company'){ const c = state.companies.find(x=>x.id===id); if(c) c.nameAr = val; }

  if(!state.user || state.user.role!=='admin') return;

async function ensureOrganization(){
  if(state.organizations.length) return state.organizations[0];
  const org = {id: genId('org'), name:'المؤسسة'};
  const result = await db.from('organizations').insert(org);

// يفتح كل عقد الشجرة، ثم يحسب نسبة تصغير تجعلها تناسب ورقة A4 واحدة إن أمكن (وإلا تتدفق لعدة صفحات بلا أسطر يتيمة)
function prepareOrgTreePrint(){
  document.querySelectorAll('[onclick*="toggleTreeNode"]').forEach(row=>{
    const m = row.getAttribute('onclick').match(/toggleTreeNode\('([^']+)',(true|false)\)/);
    if(m) { if(!state.orgTreeOpen) state.orgTreeOpen = {}; state.orgTreeOpen[m[1]] = true; }
  });
  state._printingTree = true;
  renderOrgTreeOnly();
  document.body.classList.add('printing-tree');
  const card = document.querySelector('.org-tree-page > .card'); if(!card) return 1;
  const box = document.createElement('div'); box.className = 'tree-measure-box';
  box.innerHTML = card.innerHTML; document.body.appendChild(box);
  const h = box.offsetHeight; box.remove();
  const BUDGET_PX = 930;   // ارتفاع A4 (297مم) بعد الهوامش والعنوان وتاريخ الطباعة
  let z = h > BUDGET_PX ? Math.floor((BUDGET_PX / h) * 100) / 100 : 1;
  if(z < 0.58) z = 1;       // أصغر من ذلك لا يُقرأ: نتركها تتدفق لعدة صفحات
  card.style.zoom = z < 1 ? String(z) : '';
  return z;
}
function finishOrgTreePrint(){
  state._printingTree = false;
  document.body.classList.remove('printing-tree');
  const card = document.querySelector('.org-tree-page > .card'); if(card) card.style.zoom = '';
}
function printOrgTree(){
  prepareOrgTreePrint();
  window.addEventListener('afterprint', finishOrgTreePrint, {once:true});
  setTimeout(()=>window.print(), 150);
}

function treeViewMode(){ try{ return localStorage.getItem('qayam_tree_view')==='hier' ? 'hier' : 'level'; }catch(e){ return 'level'; } }
function setTreeView(m){ try{ localStorage.setItem('qayam_tree_view', m); }catch(e){} renderOrgTreeOnly(); }
function peopleSorted(list){
  return list.slice().sort((a,b)=> userRank(a)-userRank(b) || String(a.name).localeCompare(String(b.name),'ar'));
}
// قائمة أشخاص بالشجرة: إمّا مسطّحة بالمستوى ثم الاسم، أو هرمية كل شخص تحت مديره المباشر (داخل نفس القائمة)
function renderPeople(list, indent, ctxCompanyId, personFn){
  const row = personFn;
  if(treeViewMode()!=='hier') return peopleSorted(list).map(u=>row(u, indent)).join('');
  const ids = new Set(list.map(u=>u.id));
  const mgrOf = u => ctxCompanyId ? managerForCompany(u, ctxCompanyId) : (u.managerId||null);
  const kids = {}, roots = [], seen = new Set();
  peopleSorted(list).forEach(u=>{
    const m = mgrOf(u);
    if(m && m!==u.id && ids.has(m)) (kids[m] = kids[m] || []).push(u); else roots.push(u);
  });
  const draw = (u, ind, tag)=>{
    if(seen.has(u.id)) return '';
    seen.add(u.id);
    return row(u, ind, tag) + (kids[u.id]||[]).map(c=>draw(c, ind+22)).join('');
  };
  let html = roots.map(u=>{
    const m = mgrOf(u), mu = m ? state.users.find(x=>x.id===m) : null;
    return draw(u, indent, (mu && !ids.has(m)) ? 'يتبع: '+mu.name+' (وحدة أخرى)' : '');
  }).join('');
  list.forEach(u=>{ if(!seen.has(u.id)) html += draw(u, indent, 'حلقة بالمدراء'); });   // دائرة مدراء: لا يختفي أحد
  return html;
}

const PAGE_NUM_STYLES = {

const DEFAULT_FOOTER_TEXT = 'الكويت، المرقاب، قطعة 1 - شارع 62 - الوزان - قسيمة 15 - برج بيت التمويل، الدور 4 - وحدة رقم 2 - هاتف: \u2066+96599162467\u2069 — \u2066www.qyamkw.com\u2069 — \u2066info@qyamkw.com\u2069 — \u2066QyamTraining\u2069';
const FOOTER_MAX_CHARS = 300, FOOTER_AUTO_START = 10, FOOTER_AUTO_MIN = 8, FOOTER_MANUAL_MIN = 6.5, FOOTER_MANUAL_MAX = 12;
function safeColor(v, dflt){ return /^#[0-9a-fA-F]{6}$/.test(v||'') ? v : dflt; }
// نص التذييل: المحفوظ إن وُجد (حتى لو فارغ = بلا نص)، وإلا بيانات الاتصال الافتراضية للشركات التي تستخدم الترويسة الافتراضية فقط
function companyFooterText(co, center){

  return usesDefault ? DEFAULT_FOOTER_TEXT : '';
}
function normalizeFooterText(t){

function printFooterSpec(req){

  const text = ftUnit ? (ftUnit.footerText||'') : companyFooterText(co, center);
  return {

    numStyle: PAGE_NUM_STYLES[co.pageNumStyle] ? co.pageNumStyle : 'full',

    fontSize: Math.min(FOOTER_MANUAL_MAX, Math.max(FOOTER_MANUAL_MIN, Number(co.footerFontSize!=null ? co.footerFontSize : FOOTER_AUTO_START) || FOOTER_AUTO_START))
  };
}
function footerHtml(spec, n, total, prefix){
  const numTxt = PAGE_NUM_STYLES[spec.numStyle].fmt(n, total);
  const showNum = spec.numStyle!=='none';
  const showText = spec.showText && (spec.text||'').trim();
  if(!showNum && !showText) return '';
  const cls = 'page-footer' + (spec.showLine ? ' has-line' : '') + (showNum ? '' : ' no-num');
  const numLabel = (prefix && spec.numStyle==='full') ? prefix + numTxt : numTxt;
  const fs = spec.fontMode==='manual' ? spec.fontSize : FOOTER_AUTO_START;
  return `<div class="${cls}" data-auto="${spec.fontMode==='manual' ? 0 : 1}" style="--fl:${spec.lineColor};--fn:${spec.numColor};--ft:${spec.textColor};bottom:${spec.offset}mm;"><span class="pf-spacer"></span><span class="pf-text" style="font-size:${fs}px;">${showText ? escH(spec.text.trim()) : ''}</span><span class="pf-num" style="font-size:${Math.max(FOOTER_AUTO_MIN, fs)}px;">${showNum ? escH(numLabel) : ''}</span></div>`;
}
// عدد أسطر عنصر النص (يُقاس فعلياً بعد الرسم)
function footerLines(t){
  const cs = getComputedStyle(t);
  const lh = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize)*1.35);
  return Math.max(1, Math.round(t.scrollHeight / lh));
}
// في الوضع التلقائي: يبدأ بحجم 10، فإن زاد النص عن سطرين يصغر تدريجياً حتى 8
function fitPageFooters(root){
  (root||document).querySelectorAll('.page-footer[data-auto="1"]').forEach(f=>{
    const t = f.querySelector('.pf-text'), n = f.querySelector('.pf-num');
    if(!t) return;
    let size = FOOTER_AUTO_START; t.style.fontSize = size+'px';
    while(footerLines(t)>2 && size>FOOTER_AUTO_MIN){ size -= 0.5; t.style.fontSize = size+'px'; }
    if(n) n.style.fontSize = Math.max(FOOTER_AUTO_MIN, size)+'px';
  });
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ try{ fitPageFooters(); }catch(e){} });
// أكبر حجم (من الحد الأعلى للأدنى) يجعل النص بسطر واحد، أو null
function largestOneLineSize(t){
  const keep = t.style.fontSize;
  let found = null;
  for(let sz = FOOTER_MANUAL_MAX; sz >= FOOTER_MANUAL_MIN - 0.001; sz -= 0.5){
    t.style.fontSize = sz+'px';
    if(footerLines(t)===1){ found = sz; break; }
  }
  t.style.fontSize = keep;
  return found;
}
// أول كلمة تنزل للسطر الثاني بالحجم الحالي (لتنبيه المستخدم)
function firstWordOnSecondLine(t){
  const txt = (t.textContent||'').replace(/\n/g,' ').trim(); if(!txt) return '';
  const probe = document.createElement('div');
  const cs = getComputedStyle(t);
  probe.style.cssText = `position:absolute;visibility:hidden;top:0;left:0;width:${t.clientWidth}px;font-family:${cs.fontFamily};font-size:${cs.fontSize};font-weight:${cs.fontWeight};white-space:normal;text-align:center;direction:rtl;line-height:${cs.lineHeight};`;
  probe.innerHTML = txt.split(' ').map(w=>`<span>${escH(w)}</span>`).join(' ');
  t.parentNode.appendChild(probe);
  const spans = [...probe.querySelectorAll('span')];
  const top0 = spans[0] ? spans[0].offsetTop : 0;
  const hit = spans.find(x=>x.offsetTop > top0 + 2);
  const word = hit ? hit.textContent : '';
  probe.remove();
  return word;
}

function updateFooterTip(box, sp){
  const tip = document.getElementById('pfTip'); if(!tip) return;
  const t = box.querySelector('.pf-text');
  if(!t || !(sp.text||'').trim() || !sp.showText){ tip.innerHTML=''; return; }
  const lines = footerLines(t), size = parseFloat(t.style.fontSize);
  const manualBreak = (sp.text||'').includes('\n');
  if(lines===1){ tip.innerHTML = `<span style="color:var(--green);">✓ النص بسطر واحد بحجم ${size}</span>`; return; }
  const word = manualBreak ? '' : firstWordOnSecondLine(t);
  const fit = largestOneLineSize(t);
  let msg = lines>2 ? `⚠ النص أطول من سطرين، وسيُقتطع آخره عند الطباعة. ` : `النص نزل لسطرين${word ? ' بسبب كلمة «'+escH(word)+'»' : ''}. `;
  msg += fit ? `بحجم ${fit} يبقى بسطر واحد — اضغط «اجعله بسطر واحد».` : `لا يتسع بسطر واحد حتى ${FOOTER_MANUAL_MIN}؛ قصّر النص أو اتركه بسطرين.`;
  tip.innerHTML = `<span style="color:var(--amber);">${msg}</span>`;
}

// يصغّر الصورة تلقائياً لتناسب المكان (يحافظ على النسبة)، ويبقي الشفافية للـPNG
function resizeImageFile(file, maxW, maxH){
  return new Promise((resolve, reject)=>{
    if(file.type==='image/svg+xml'){ readFileAsDataURL(file).then(d=>resolve({dataUrl:d, resized:false})).catch(reject); return; }
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{
      const ow = img.naturalWidth, oh = img.naturalHeight;
      const scale = Math.min(1, maxW/ow, maxH/oh);
      const w = Math.max(1, Math.round(ow*scale)), h = Math.max(1, Math.round(oh*scale));
      const keepAlpha = /png|gif|webp/.test(file.type);
      if(scale>=1 && file.size < 400*1024){ URL.revokeObjectURL(url); readFileAsDataURL(file).then(d=>resolve({dataUrl:d, resized:false, ow, oh, w:ow, h:oh})).catch(reject); return; }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      if(!keepAlpha){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); }
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve({dataUrl: cv.toDataURL(keepAlpha ? 'image/png' : 'image/jpeg', 0.9), resized:true, ow, oh, w, h});
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('تعذّر قراءة الصورة')); };
    img.src = url;
  });
}
async function brandSave(kind, id, value){
  if(kind==='sysLogo'){
    const r = await db.from('app_settings').upsert({key:'system_logo', value: value||''});
    if(!(await dbCheck(r, 'حفظ شعار النظام'))) return false;
    state.appSettings = state.appSettings||{}; state.appSettings.system_logo = value||'';
  } else if(kind==='coLogo'){
    const r = await db.from('companies').update({brand_logo_data: value||null}).eq('id', id);
    if(!(await dbCheck(r, 'حفظ شعار الشركة'))) return false;
    state.companies.find(c=>c.id===id).brandLogo = value||'';
  } else if(kind==='letterhead'){
    const r = await db.from('companies').update({logo_data: value||null}).eq('id', id);
    if(!(await dbCheck(r, 'حفظ ترويسة الشركة'))) return false;
    state.companies.find(c=>c.id===id).logoData = value||'';
  } else if(kind==='centerLh'){
    const r = await db.from('centers').update({letterhead_data: value||null}).eq('id', id);
    if(!(await dbCheck(r, 'حفظ ترويسة المركز'))) return false;
    state.centers.find(c=>c.id===id).letterheadData = value||'';
  }
  return true;
}
async function brandUpload(kind, id, input){
  const file = input.files && input.files[0]; if(!file) return;
  const sp = BRAND_SPECS[kind];
  try{
    const r = await resizeImageFile(file, sp.w, sp.h);
    if(!(await brandSave(kind, id, r.dataUrl))) return;
    showToast(r.resized ? `تم الحفظ — صُغِّرت الصورة من ${r.ow}×${r.oh} إلى ${r.w}×${r.h}` : 'تم الحفظ', 'success');
    if((kind==='letterhead' || kind==='centerLh') && r.ow && r.oh){
      const ratio = r.ow / r.oh, a4 = 210/297;
      if(Math.abs(ratio - a4) / a4 > 0.06){
        setTimeout(()=>showToast(`تنبيه: نسبة الصورة (${ratio.toFixed(2)}) ليست نسبة ورقة A4 (0.71). ستُمدَّد لتغطي الصفحة كاملة وقد تتشوّه. يُفضّل صورة بمقاس 1240×1754 بكسل.`, 'error'), 500);
      }
    }
    render();
  }catch(e){ showToast(e.message||'تعذّر رفع الصورة','error'); }
}

async function seedDefaultLevels(){

async function addJobLevel(){
  const companyId = state.jobLevelsCompanyId;
  const levels = levelsForCompany(companyId);
  const sortOrder = levels.length ? Math.max.apply(null, levels.map(l=>l.sortOrder))+1 : 1;
  const row = {id:genId('lvl'), company_id:companyId, name:'مستوى جديد', sort_order:sortOrder};
  const result = await db.from('job_levels').insert(row);
  if(!(await dbCheck(result, 'إضافة مستوى'))) return;
  state.jobLevels.push({id:row.id, companyId:row.company_id, name:row.name, sortOrder:row.sort_order});
  render();
}
async function moveLevel(id, dir){
  const levels = levelsForCompany(state.jobLevelsCompanyId);
  const idx = levels.findIndex(l=>l.id===id);
  const swapIdx = idx+dir;
  if(idx<0 || swapIdx<0 || swapIdx>=levels.length) return;
  const a = levels[idx], b = levels[swapIdx];
  const oa = a.sortOrder, ob = b.sortOrder;
  const r1 = await db.from('job_levels').update({sort_order:ob}).eq('id', a.id);
  if(!(await dbCheck(r1, 'إعادة الترتيب'))) return;
  const r2 = await db.from('job_levels').update({sort_order:oa}).eq('id', b.id);
  if(!(await dbCheck(r2, 'إعادة الترتيب'))) return;
  a.sortOrder = ob; b.sortOrder = oa;
  render();
}

async function performDeleteJobLevel(id){

}

async function maybeMigrateNames(){
  if(!state.user || state.user.role!=='admin' || state._migDone) return;
  state._migDone = true;
  if(state.appSettings && state.appSettings.migr_gm==='1') return;
  const old = state.jobLevels.filter(l=>l.name==='المدير الأعلى');
  if(old.length){
    const r = await db.from('job_levels').update({name:'المدير العام'}).eq('name','المدير الأعلى');
    if(r && r.error) return;
    old.forEach(l=>l.name='المدير العام');
  }
  await db.from('app_settings').upsert({key:'migr_gm', value:'1'});
  state.appSettings = state.appSettings||{}; state.appSettings.migr_gm = '1';
}


// فلتر قائمة المدير المباشر: 'company'=الشركة الحالية | 'general'=العامّون+الشركة | 'all'=الكل
function mgrOptions(currentCompanyId, selectedId, excludeId, filterMode){
  filterMode = filterMode || 'company';
  let pool = state.users.filter(u=>u.role!=='admin' && u.id!==excludeId);
  if(filterMode==='company') pool = pool.filter(u=>u.companyId===currentCompanyId && !u.isGeneral);
  else if(filterMode==='general') pool = pool.filter(u=>u.companyId===currentCompanyId || u.isGeneral);
  // 'all': كل المستخدمين
  // تأكد أن المدير المحدد ظاهر حتى لو خارج الفلتر
  if(selectedId && !pool.some(u=>u.id===selectedId)){
    const sel = state.users.find(u=>u.id===selectedId);
    if(sel) pool = [sel, ...pool];
  }
  pool.sort((a,b)=>userRank(a)-userRank(b) || String(a.name).localeCompare(String(b.name),'ar'));
  return pool.map(u=>`<option value="${u.id}" ${u.id===selectedId?'selected':''}>${escH(u.name)} — ${escH(findRole(u.role).name)}${u.isGeneral?' 🌐':''}</option>`).join('');
}
function mgrFilterBtns(inputId, company, general, all, current){
  const btn=(v,l)=>`<button type="button" class="seg-btn ${current===v?'on':''}" onclick="changeMgrFilter('${inputId}','${company}','${general}',${all?`'${all}'`:'null'},'${v}')" title="فلتر المدير">${l}</button>`;
  return `<div class="seg" style="margin-bottom:4px;">${btn('company','موظفو الشركة')}${btn('general','+ العامّون')}${btn('all','الكل')}</div>`;
}
function changeMgrFilter(selectId, companyId, excludeId, allId, mode){
  const sel = document.getElementById(selectId); if(!sel) return;
  const cur = sel.value;
  // اقرأ المدير المختار حالياً ثم أعد بناء القائمة
  const opts = mgrOptions(companyId, cur, excludeId, mode);
  sel.innerHTML = '<option value="">— بدون مدير —</option>' + opts;
  // احفظ الفلتر المختار كـ data-attr للزرّ
  const wrap = sel.closest('.row,.card,div');
  if(wrap){ const btns = wrap.querySelectorAll('.seg-btn'); btns.forEach(b=>b.classList.toggle('on', b.getAttribute('onclick')&&b.getAttribute('onclick').includes(`'${mode}'`))); }
}
