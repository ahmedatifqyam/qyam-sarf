<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vmi3593541.contaboserver.net https://cdn.jsdelivr.net; frame-src 'self' blob: data:; media-src 'self' blob: data:; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2733">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميزان القيم">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>&#x200F;</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2733; --paper:#F7F6F2; --card:#FFFFFF;
    --line:#E3E0D6; --muted:#56554F; --text:#2C2B27;
    --blue:#2E5F8A; --blue-bg:#E8F0F6;
    --amber:#B5790E; --amber-bg:#FBF0DC;
    --green:#2E7D4F; --green-bg:#E5F3EA;
    --red:#B23A2E; --red-bg:#FBEAE7;
    --teal:#1F6E63; --teal-bg:#E4F1EE;
    --doc-red:#C0392B;
  }
  *{box-sizing:border-box;}
  html{overflow-x:clip;scrollbar-gutter:stable;scroll-padding-bottom:calc(var(--bar-h,0px) + 16px);}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.6;max-width:100%;}
  .topbar{
    background:var(--ink);color:#fff;padding:0 20px;height:56px;min-height:56px;max-height:56px;box-sizing:border-box;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;
    position:sticky;top:0;z-index:10;
  }
  .topbar .brand{font-weight:600;font-size:17px;}
  .topbar .brand{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto;}
  .brand-group{display:flex;align-items:center;gap:9px;min-width:0;}
  .brand-slot{width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;}
  .brand-slot img{max-width:100%;max-height:100%;object-fit:contain;}
  .brand-slot.is-blank{border:1.5px dashed rgba(255,255,255,.35);border-radius:8px;color:rgba(255,255,255,.55);font-size:22px;cursor:pointer;box-sizing:border-box;}
  .brand-slot.is-blank:hover{border-color:#D4AF37;color:#D4AF37;}
  .brand-name{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;}
  .brand-sep{width:1px;height:34px;background:rgba(255,255,255,.22);flex:0 0 1px;}
  .brand-sub{color:#9FC2DB;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;display:block;}
  @media (max-width:1000px){ .brand-co-group .brand-sub{font-size:13px;max-width:200px;} .brand-sep{display:none;} }
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;flex:1;justify-content:flex-start;min-width:0;}
  .topbar-right .tb-tools{display:flex;align-items:center;gap:2px;margin-right:auto;min-width:0;}
  .imp-float{position:fixed;top:12px;left:0;right:var(--nav-w,0px);z-index:65;justify-content:center;pointer-events:none;}
  .imp-float > *{pointer-events:auto;}
  .imp-pill{background:var(--amber);color:#fff;border-radius:22px;padding:5px 8px 5px 16px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.3);}
  .imp-pill button{background:#fff;color:var(--amber);border:none;border-radius:14px;padding:3px 12px;font-weight:700;cursor:pointer;font-size:12.5px;}
  .imp-pill .imp-min{padding:3px 9px;}
  .imp-dot{background:var(--amber);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);}
  /* بطاقة الاسم أسفل القائمة هي الطريق إلى «حسابي» — وكان الأدمن بلا طريق إليها أصلاً */
  .nav-user{display:flex;align-items:center;gap:10px;padding:6px 8px 8px;color:#cfd8e3;
    cursor:pointer;border-radius:8px;border:none;background:none;font-family:inherit;text-align:right;}
  .nav-user:hover{background:rgba(255,255,255,.09);color:#fff;}
  .nav-user:focus-visible{outline:2px solid #D4AF37;outline-offset:1px;}
  .nav-user.on{background:rgba(255,255,255,.13);color:#fff;}
  .nav-avatar{width:32px;height:32px;border-radius:50%;background:#2E4356;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 32px;overflow:hidden;}
  .nav-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  /* صورة المستخدم: دائرة، أو الحرف الأول إن لم تُرفع صورة */
  .u-av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:0 0 32px;display:inline-flex;align-items:center;justify-content:center;}
  .u-av-l{background:#2E4356;color:#fff;font-weight:700;}
  .u-av-md{width:36px;height:36px;flex-basis:36px;margin-left:10px;}
  .u-av-lg{width:72px;height:72px;flex-basis:72px;font-size:26px;}
  .av-edit{display:flex;align-items:center;gap:14px;margin:6px 0 4px;}
  .av-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .av-pick{cursor:pointer;}
  /* صفحة الدخول: اسم النظام وسطر يوضح دوره */
  /* صفحة الدخول: نصفان */
  .login-split{display:flex;min-height:min(620px, calc(100vh - 150px));margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;}
  .login-brand{flex:1 1 50%;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:40px 48px;gap:6px;}
  .login-brand .lh-logo{height:72px;max-width:200px;object-fit:contain;align-self:flex-start;margin-bottom:10px;}
  .login-brand .lh-name{font-size:34px;font-weight:900;color:#fff;}
  .login-brand .lh-tag{font-size:22px;font-weight:800;color:#E8C766;line-height:1.5;margin-top:4px;}
  .login-brand .lh-pts{list-style:none;padding:0;margin:18px 0 6px;display:flex;flex-direction:column;gap:12px;}
  .login-brand .lh-pts li{display:flex;align-items:center;gap:10px;font-size:16.5px;font-weight:700;}
  .login-brand .lh-pts .qi{width:22px;height:22px;color:#E8C766;flex:0 0 22px;}
  .login-brand .lh-tail{font-size:14.5px;color:rgba(255,255,255,.85);line-height:1.8;margin-top:6px;}
  .login-form{flex:1 1 50%;display:flex;align-items:center;justify-content:center;padding:30px 20px;}
  .login-card{width:100%;max-width:380px;margin:0;}
  .login-card h1{margin:0 0 6px;font-size:24px;}
  .login-card input:not([type=checkbox]){--fw:100% !important;width:100% !important;max-width:100% !important;box-sizing:border-box;}
  @media (max-width:760px){ .login-split{flex-direction:column;min-height:0;} .login-brand{padding:22px 20px;} .login-brand .lh-name{font-size:26px;} .login-brand .lh-tag{font-size:17px;} .login-brand .lh-pts{display:none;} .login-brand .lh-tail{display:none;} .login-brand .lh-logo{height:48px;} }
  body.on-login .brand-name, body.on-login .brand-logo, body.on-login .brand-slot{display:none;}
  .login-hero{text-align:center;margin:8px auto 18px;max-width:660px;}
  .login-hero .lh-logo{height:64px;max-width:200px;object-fit:contain;display:block;margin:0 auto 8px;}
  .login-hero .lh-name{font-size:28px;font-weight:900;color:var(--ink);letter-spacing:0;}
  .login-hero .lh-tag{font-size:21px;font-weight:800;color:var(--ink);margin-top:8px;line-height:1.5;}
  .login-hero .lh-tag2{font-size:15.5px;font-weight:600;color:var(--text);margin-top:8px;line-height:1.8;}
  @media (max-width:640px){ .login-hero .lh-tag{font-size:18px;} .login-hero .lh-tag2{font-size:14px;} }
  .nav-uname{font-size:13px;font-weight:600;color:#fff;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-urole{font-size:11.5px;color:#9FC2DB;}
  .app-nav[data-mode="collapsed"] .nav-uinfo{display:none;}
  .app-nav[data-mode="collapsed"] .nav-user{justify-content:center;padding:6px 0;}
  .brand-img-block{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand-preview{min-width:120px;max-width:340px;min-height:56px;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 50%/16px 16px;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;align-items:center;justify-content:center;}
  .brand-preview img{max-width:100%;max-height:90px;object-fit:contain;}
  .limit-tag{background:#fdecea;color:var(--red);border:1px solid var(--red);border-radius:10px;font-size:11px;font-weight:700;padding:1px 8px;white-space:nowrap;}
  .topbar-right select{width:auto !important;min-width:110px;max-width:200px;flex:0 1 auto;}
  .search-box{display:flex;gap:6px;}
  .search-results{
    position:absolute;top:100%;right:0;left:0;margin-top:4px;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);z-index:50;max-height:280px;overflow-y:auto;
  }
  .search-result-item{
    padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;
    border-bottom:1px solid var(--line);color:var(--text);
  }
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:var(--paper);}
  .search-box input{
    border:none;border-radius:4px;padding:8px 10px;font-family:inherit;font-size:13px;width:150px;
  }
  .search-box button{
    background:#2E4356;color:#fff;border:none;border-radius:4px;min-height:40px;padding:0 12px;font-size:13px;cursor:pointer;
  }
  .role-chip{
    background:#2E4356;padding:7px 14px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:8px;
  }
  .role-chip button{
    background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;
    font-size:13px;padding:3px 10px;cursor:pointer;
  }
  .container{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  .banner{
    background:var(--amber-bg);color:#6b4d0c;border:1px solid #E7CE9B;border-radius:6px;
    padding:12px 16px;font-size:13.5px;margin-bottom:24px;
  }
  h1{font-size:22px;margin:0 0 6px;}
  h2{font-size:18px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px;}
  .card{
    background:var(--card);border:2px solid var(--line);border-radius:8px;
    padding:16px;margin-bottom:16px;
  }
  .role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px;}
  /* ===== الشريط الجانبي الدائم ===== */
  :root{--nav-w:0px;--topbar-h:56px;}
  .nav-hamburger{display:none;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;font-size:20px;line-height:1;padding:6px 11px;cursor:pointer;}
  .app-nav{position:fixed;right:0;top:var(--topbar-h);bottom:var(--bar-h,0px);width:240px;z-index:20;background:var(--ink);color:#cfd8e3;
    display:none;flex-direction:column;box-sizing:border-box;border-left:1px solid rgba(255,255,255,.08);transition:width .15s;}
  .app-nav[data-mode="open"], .app-nav[data-mode="collapsed"], .app-nav[data-mode="drawer"]{display:flex;}
  .app-nav[data-mode="collapsed"]{width:64px;}
  .app-nav[data-mode="drawer"]{width:270px;top:0;bottom:0;z-index:90;box-shadow:-6px 0 24px rgba(0,0,0,.4);}
  .nav-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;}
  body.nav-drawer-open .nav-backdrop{display:block;}
  /* يبقى صندوق العمل في منتصف الصفحة قدر الإمكان: لا يُزاح إلا بالمقدار اللازم كي لا يتداخل مع الشريط */
  .shell-main{padding-right:var(--nav-pr,0px);padding-left:var(--nav-pl,0px);transition:padding .15s;}
  body:not(.has-nav) .shell-main{padding-right:0;}
  .nav-head{display:flex;align-items:center;gap:10px;padding:6px 12px 2px;}
  .nav-toggle{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;font-size:17px;line-height:1;padding:6px 10px;cursor:pointer;}
  .nav-toggle:hover{background:rgba(255,255,255,.1);}
  .nav-title{font-size:13px;font-weight:700;color:#9FC2DB;}
  .nav-list{flex:1;overflow-y:auto;padding:2px 8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent;}
  .nav-list::-webkit-scrollbar{width:5px;} .nav-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:4px;}
  .nav-foot{padding:4px 8px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:4px;}
  .nav-foot .nav-user{flex:1;min-width:0;padding:4px 4px;}
  .nav-foot .nav-user > div:last-child{min-width:0;}
  .nav-foot .nav-item{flex:0 0 auto;padding:8px 10px;margin:0;}
  .nav-foot .nav-item .nav-label{display:none;}
  .app-nav[data-mode="collapsed"] .nav-foot{flex-direction:column;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:7px 12px;margin:1px 0;border-radius:8px;cursor:pointer;font-size:14px;color:#cfd8e3;
    border-right:3px solid transparent;white-space:nowrap;position:relative;}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.13);color:#fff;font-weight:600;border-right-color:#D4AF37;}
  .nav-ico{width:22px;text-align:center;font-size:16px;flex:0 0 22px;display:inline-flex;align-items:center;justify-content:center;}
  .nav-ico .qi{width:20px;height:20px;}
  .nav-label{overflow:hidden;text-overflow:ellipsis;}
  .nav-count{background:#D4AF37;color:#1B2733;border-radius:10px;font-size:11px;font-weight:700;padding:1px 7px;margin-right:auto;}
  .nav-caret{margin-right:auto;font-size:11px;opacity:.7;}
  .nav-sub{padding:2px 0 6px;}
  .nav-subcat{font-size:11px;font-weight:700;color:#7f93a8;margin:4px 14px 0;line-height:1.5;}
  .admin-nav-item{display:block;padding:7px 12px 7px 8px;margin:1px 0;line-height:1.5;border-radius:7px;cursor:pointer;font-size:13.5px;color:#cfd8e3;margin-right:18px;border-right:3px solid transparent;}
  .admin-nav-item .nav-count{float:left;margin:2px 0 0;}
  /* حقل فيه خطأ: إطار أحمر وهزّة خفيفة حتى يُصحَّح */
  .field-err{border-color:#b91c1c !important;box-shadow:0 0 0 3px rgba(185,28,28,.18) !important;animation:qyShake .35s ease-in-out;}
  @keyframes qyShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  /* حسابي ← الأصوات: كل صوت سطر واحد (العنوان والشرح، ثم التحكم، ثم زر التجربة) */
  .snd-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line);}
  .snd-row:first-of-type{border-top:0;}
  .snd-lab{flex:1 1 260px;min-width:0;}
  .snd-lab .file-hint{margin:2px 0 0;}
  .snd-sw{display:flex !important;align-items:center;gap:8px;height:40px;margin:0 !important;font-weight:600;cursor:pointer;min-width:180px;}
  /* شارة «نسخة تجريبية» فوق اسم النظام (موقع الاختبار وحده) */
  .brand-name-col{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;gap:2px;flex:0 0 auto;} .brand-co-group{min-width:0;flex:1 1 auto;overflow:hidden;}
  .test-badge{background:#c2410c;color:#fff;font-size:12px;font-weight:700;line-height:18px;padding:0 9px;border-radius:9px;white-space:nowrap;letter-spacing:0;}
  /* مرشّحات داخل الصفحة (أزرار متجاورة لا صف تبويب) */
  .page-seg{flex-wrap:wrap;margin:0 0 12px;}
  /* ألوان حالات الطلب: شريط على يمين الطلب ومفتاح الألوان فوق القائمة؛ والمسنَد إليك بلون الإسناد */
  .status-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 8px;font-size:12px;color:var(--muted);}
  .status-legend span{display:inline-flex;align-items:center;gap:5px;}
  .status-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;}
  /* الرموز: خط رفيع بلون النص */
  .qi{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-0.2em;}
  .btn .qi-btn{margin-inline-end:.45em;}
  /* نظام العهدة */
  .custody-tag{display:inline-block;background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE;border-radius:10px;font-size:11px;font-weight:700;padding:1px 8px;white-space:nowrap;}
  .badge.cus-badge{background:color-mix(in srgb, var(--cb) 13%, #fff);color:var(--cb);border:1px solid color-mix(in srgb, var(--cb) 40%, #fff);white-space:nowrap;}
  .cus-panel{border:1px solid var(--line);border-right:4px solid #3730A3;border-radius:10px;padding:12px 14px;margin:12px 0;background:var(--paper);}
  .cus-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px;color:var(--text);}
  .cus-title{font-weight:800;color:#3730A3;font-size:15px;}
  /* شريط العهدة في صفحة الطلب */
  .cus-strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border:1px solid var(--line);border-right:4px solid #3730A3;border-radius:10px;padding:8px 14px;margin:10px 0;background:var(--paper);font-size:14px;color:var(--text);}
  .cus-strip.cus-strip-act{background:var(--amber-bg);border-right-color:var(--amber);}
  .cus-settle{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:10px;line-height:1.9;font-size:14px;color:#000;}
  @media print{ body.printing-cus .history, body.printing-cus .top-action-bar, body.printing-cus .page-intro, body.printing-cus .sec-note{display:none !important;} }
  .cus-progress{margin:8px 0 4px;font-size:14px;color:var(--text);}
  .cus-bar{height:6px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden;}
  .cus-bar span{display:block;height:100%;background:var(--green);}
  .cus-lines tr.cus-unreviewed td{background:#FFF7E6;}
  .cus-lines tr.cus-unreviewed td:first-child{box-shadow:inset -4px 0 0 var(--amber);}
  .cus-line-form{background:var(--paper);margin-top:10px;}
  .cus-lines{margin-top:14px;}
  .cus-lines td .btn{margin:2px;}
  .cus-purpose{margin-top:8px;font-size:14px;color:var(--text);line-height:1.7;}
  .cus-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px;}
  .cus-card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;}
  .cus-card.main{border-color:#3730A3;background:#EEF2FF;}
  .cus-card.neg{border:2px solid var(--red);}
  .cus-card.neg .cus-card-v{color:var(--red);}
  .cus-card-l{font-size:12.5px;font-weight:700;color:var(--muted);}
  .cus-card-v{font-size:17px;font-weight:800;color:var(--ink);margin-top:2px;white-space:nowrap;}
  .cus-unit{font-size:11px;font-weight:600;color:var(--muted);}
  .cus-card-s{font-size:11px;color:var(--muted);margin-top:2px;}
  .cus-limit{font-size:13.5px;font-weight:600;color:var(--text);background:var(--blue-bg);border-radius:8px;padding:7px 12px;margin:8px 0;}
  .cus-limit.over{background:var(--red-bg);color:var(--red);}
  .cus-li-badges{display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
  .why-line{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:6px;}
  .cus-stepper .step{min-width:70px;}

  .request-qr-hint{position:absolute;bottom:calc(100% + 1px);left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:#c62828;text-align:center;line-height:1.2;white-space:nowrap;}

  /* ── فقاعة المساعد الذكي ───────────────────────────────────────── */
  /* الشريط الجانبي يمين الشاشة، فالفقاعة يسارها كي لا تركبه،
     وفوق شريط الدعم الفني (55 بكسل) لا عليه. والألوان ألوان النظام. */
  #qyamAssistant{
    direction:rtl;

    /* الألوان الأساسية من لوحة النظام */
    --chat--color--primary:var(--blue);
    --chat--color--primary-shade-50:#27527a;
    --chat--color--primary--shade-100:var(--ink);
    --chat--color--secondary:var(--green);
    --chat--color-secondary-shade-50:#266841;
    --chat--color-white:#fff;
    --chat--color-light:var(--paper);
    --chat--color-light-shade-50:#efeee9;
    --chat--color-light-shade-100:var(--line);
    --chat--color-medium:var(--muted);
    --chat--color-dark:var(--text);
    --chat--color-disabled:#9c9b95;
    --chat--color-typing:var(--muted);

    /* الأساس: الخطّ والحواف والمسافات كما في بقية النظام */
    --chat--font-family:'IBM Plex Sans Arabic',sans-serif;
    --chat--border-radius:8px;
    --chat--spacing:12px;
    --chat--transition-duration:.18s;

    /* النافذة */
    --chat--window--width:360px;
    --chat--window--height:min(540px, calc(100vh - 150px));
    --chat--window--border:1px solid var(--line);
    --chat--window--border-radius:10px;
    --chat--window--z-index:1200;

    /* الترويسة: داكنة كالشريط العلوي */
    --chat--header--background:var(--ink);
    --chat--header--color:#fff;
    --chat--header--padding:14px 16px;
    --chat--header--border-bottom:none;
    --chat--heading--font-size:15px;
    --chat--subtitle--font-size:12px;
    --chat--subtitle--line-height:1.6;

    /* الرسائل: جواب المساعد بطاقة بيضاء، وسؤالك أزرق النظام */
    --chat--body--background:var(--paper);
    --chat--messages-list--padding:14px;
    --chat--message--font-size:13.5px;
    --chat--message-line-height:1.75;
    --chat--message--padding:10px 12px;
    --chat--message--border-radius:8px;
    --chat--message--margin-bottom:10px;
    --chat--message--bot--background:var(--card);
    --chat--message--bot--color:var(--text);
    --chat--message--bot--border:1px solid var(--line);
    --chat--message--user--background:var(--blue);
    --chat--message--user--color:#fff;
    --chat--message--user--border:none;
    --chat--message--pre--background:var(--blue-bg);

    /* الفقاعة نفسها */
    --chat--toggle--size:52px;
    --chat--toggle--width:52px;
    --chat--toggle--height:52px;
    --chat--toggle--border-radius:50%;
    --chat--toggle--background:var(--blue);
    --chat--toggle--hover--background:var(--ink);
    --chat--toggle--active--background:var(--ink);
    --chat--toggle--color:#fff;

    /* صندوق الكتابة كحقول النظام */
    --chat--input--background:var(--card);
    --chat--input--text-color:var(--text);
    --chat--input--font-size:13.5px;
    --chat--input--padding:10px 12px;
    --chat--input--border:1px solid var(--line);
    --chat--input--border-active:1px solid var(--blue);
    --chat--input--border-radius:6px;
    --chat--input--placeholder--font-size:13px;
    --chat--textarea--height:46px;
    --chat--textarea--max-height:140px;
    --chat--input--send--button--background:var(--blue);
    --chat--input--send--button--color:#fff;
    --chat--input--send--button--background-hover:var(--ink);
    --chat--input--send--button--color-hover:#fff;

    /* الأزرار كأزرار النظام */
    --chat--button--padding:8px 16px;
    --chat--button--border-radius:6px;
    --chat--button--font-size:13px;
    --chat--button--color--primary:#fff;
    --chat--button--background--primary:var(--blue);
    --chat--button--background--primary--hover:var(--ink);
    --chat--close--button--color-hover:var(--blue-bg);

    --chat--footer--background:var(--paper);
    --chat--footer--color:var(--muted);
  }
  /* الفقاعة ونافذتها يسار الشاشة، وفوق شريط الدعم الفني لا عليه */
  #qyamAssistant > *{right:auto !important; left:18px !important; bottom:70px !important;}
  /* النصّ العربي يبدأ من اليمين داخل الرسائل */

  #secTabs.sec-hide{display:none !important;}
  /* الهاتف: مسافة واضحة بين اسم النظام واسم الشركة فلا يتلامسان */
  @media (max-width:699px){ .topbar .brand{gap:12px !important;} .brand-co-group{padding-inline-start:2px;} .brand-name{padding-inline-end:2px;overflow:visible !important;} .brand-name-col{overflow:visible;} }

  /* زر الخصم/الإضافي بعد الحفظ: الكلمة أعلى والمبلغ تحتها، فيتسع لأي رقم */

  #app .nr-grid .field-with-calc{max-width:100%;}

  #app .av-btns{display:flex;flex-direction:column;gap:6px;width:140px;}
  #app .av-btns .btn{width:100% !important;min-width:0 !important;margin:0 !important;justify-content:center;}
