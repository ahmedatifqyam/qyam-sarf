<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام طلبات الصرف - نموذج تجريبي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2733; --paper:#F7F6F2; --card:#FFFFFF;
    --line:#E3E0D6; --muted:#7B7A72; --text:#2C2B27;
    --blue:#2E5F8A; --blue-bg:#E8F0F6;
    --amber:#B5790E; --amber-bg:#FBF0DC;
    --green:#2E7D4F; --green-bg:#E5F3EA;
    --red:#B23A2E; --red-bg:#FBEAE7;
    --teal:#1F6E63; --teal-bg:#E4F1EE;
    --doc-red:#C0392B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.6;}
  .topbar{
    background:var(--ink);color:#fff;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    position:sticky;top:0;z-index:10;
  }
  .topbar .brand{font-weight:600;font-size:17px;}
  .topbar .brand span{color:#9FC2DB;font-weight:400;font-size:13px;display:block;}
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .search-box{display:flex;gap:6px;}
  .search-box input{
    border:none;border-radius:4px;padding:8px 10px;font-family:inherit;font-size:13px;width:150px;
  }
  .search-box button{
    background:#2E4356;color:#fff;border:none;border-radius:4px;padding:8px 12px;font-size:13px;cursor:pointer;
  }
  .role-chip{
    background:#2E4356;padding:7px 14px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:8px;
  }
  .role-chip button{
    background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;
    font-size:12px;padding:3px 10px;cursor:pointer;
  }
  .container{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  .banner{
    background:var(--amber-bg);color:#6b4d0c;border:1px solid #E7CE9B;border-radius:6px;
    padding:12px 16px;font-size:13.5px;margin-bottom:24px;
  }
  h1{font-size:22px;margin:0 0 6px;}
  h2{font-size:18px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:20px 22px;margin-bottom:16px;
  }
  .role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px;}
  .role-card{
    background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;
    cursor:pointer;transition:border-color .15s, transform .1s;text-align:right;
  }
  .role-card:hover{border-color:var(--blue);}
  .role-card:active{transform:scale(0.99);}
  .role-card b{display:block;font-size:15.5px;margin-bottom:4px;}
  .role-card span{color:var(--muted);font-size:13px;}
  label{display:block;font-size:13.5px;color:var(--muted);margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=password],input[type=email],input[type=tel],textarea,select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
    font-family:inherit;font-size:14px;background:#fff;
  }
  textarea{resize:vertical;min-height:70px;}
  .btn{
    display:inline-block;border:none;border-radius:6px;padding:10px 20px;font-size:14px;
    cursor:pointer;font-family:inherit;font-weight:500;
  }
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-approve{background:var(--green);color:#fff;}
  .btn-reject{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--line);}
  .btn-sm{padding:6px 14px;font-size:13px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:180px;}
  .beneficiary-block{border:1px dashed var(--line);border-radius:6px;padding:14px;margin-top:10px;}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:14px 16px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fff;
    cursor:pointer;flex-wrap:wrap;
  }
  .list-item:hover{border-color:var(--blue);}
  .list-item .li-main b{display:block;font-size:14.5px;}
  .list-item .li-main span{color:var(--muted);font-size:12.5px;}
  .badge{
    font-size:12px;padding:4px 12px;border-radius:20px;font-weight:500;white-space:nowrap;
  }
  .badge-pending{background:var(--amber-bg);color:var(--amber);}
  .badge-approved{background:var(--green-bg);color:var(--green);}
  .badge-rejected{background:var(--red-bg);color:var(--red);}
  .badge-paid{background:var(--teal-bg);color:var(--teal);}
  .empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center;}
  .doc{
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px;margin-bottom:20px;
  }
  .doc-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px;}
  .doc-head b{font-size:17px;}
  .doc-head .num{color:var(--muted);font-size:13px;}
  .doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin-bottom:18px;}
  .doc-grid div span{display:block;color:var(--muted);font-size:12px;margin-bottom:3px;}
  .doc-grid div b{font-size:14.5px;font-weight:500;}
  .amount-box{
    background:var(--blue-bg);color:var(--blue);border-radius:6px;padding:12px 18px;
    font-size:15px;font-weight:600;margin-bottom:6px;text-align:left;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  }
  .amount-box .amount-num{font-size:18px;}
  .amount-words{font-size:12.5px;font-weight:500;color:var(--blue);}
  .cell-right{text-align:right;}
  .cell-left{text-align:left;color:var(--muted);font-size:12.5px;margin-top:2px;}
  .stepper{display:flex;gap:0;margin:22px 0;flex-wrap:wrap;}
  .step{flex:1;min-width:110px;text-align:center;position:relative;padding:0 4px;}
  .step .dot{
    width:26px;height:26px;border-radius:50%;background:var(--line);color:#fff;
    display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:13px;font-weight:600;
  }
  .step.done .dot{background:var(--green);}
  .step.current .dot{background:var(--amber);}
  .step.rejected .dot{background:var(--red);}
  .step p{font-size:12px;color:var(--muted);margin:0;}
  .step.done p, .step.current p{color:var(--text);font-weight:500;}
  .sign-box{
    display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;
    padding:10px 14px;background:var(--paper);margin-top:6px;
  }
  .sign-box .seal{
    width:40px;height:40px;border-radius:50%;background:var(--blue-bg);color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  }
  .note-box{background:var(--red-bg);color:#7a2b21;border-radius:6px;padding:12px 14px;font-size:13.5px;margin-top:10px;}
  .history{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;}
  .history-item{display:flex;gap:12px;font-size:13px;padding:8px 0;border-bottom:1px solid #F0EEE7;}
  .history-item:last-child{border-bottom:none;}
  .history-item .t{color:var(--muted);white-space:nowrap;min-width:100px;}
  .back-link{display:inline-block;margin-bottom:16px;color:var(--blue);font-size:13.5px;cursor:pointer;}
  .actions-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .file-hint{font-size:12px;color:var(--muted);margin-top:4px;}
  .add-beneficiary{color:var(--blue);font-size:13.5px;cursor:pointer;margin-top:10px;display:inline-block;}
  .remove-b{color:var(--red);font-size:12px;cursor:pointer;float:left;}
  .total-box{
    background:var(--ink);color:#fff;border-radius:6px;padding:14px 18px;
    display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:15px;
  }
  .total-box b{font-size:20px;}
  .letterhead{
    border:1px dashed var(--line);border-radius:6px;padding:16px;margin-bottom:18px;
    text-align:center;color:var(--muted);font-size:12.5px;
  }
  .amount-table{width:100%;border-collapse:collapse;margin-bottom:18px;}
  .amount-table th{
    text-align:right;font-size:12px;color:var(--muted);font-weight:500;
    border-bottom:1px solid var(--line);padding:6px 8px;
  }
  .amount-table td{padding:9px 8px;border-bottom:1px solid #F0EEE7;font-size:14px;}
  .amount-table td.num{font-weight:500;}
  .mini-preview{
    border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px;
    background:#FDFCF9;cursor:pointer;transition:border-color .15s;max-width:320px;
  }
  .mini-preview:hover{border-color:var(--blue);}
  .mini-preview-head{
    display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
    margin-bottom:10px;
  }
  .mini-preview-link{color:var(--blue);}
  .mini-preview-body b{font-size:14px;display:block;margin-bottom:4px;}
  .mini-preview-row{font-size:12.5px;color:var(--muted);margin-bottom:3px;}
  .mini-sign-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .mini-sign-img{height:24px;max-width:60px;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:#fff;padding:2px;}
  .mini-sign-dot{
    width:24px;height:24px;border-radius:50%;background:var(--blue-bg);color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  }
  .preview-bar{
    max-width:720px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;
  }
  .sign-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:36px;}
  .sign-col-mgr{grid-column:3;text-align:center;}
  .sign-col-ceo{grid-column:2;text-align:center;padding-top:26px;}
  .sign-role-title{font-weight:700;font-size:16px;margin-bottom:4px;color:var(--doc-red);}
  .sign-name{font-size:13px;color:var(--doc-red);font-weight:600;margin-bottom:6px;}
  .sign-placeholder{font-size:11.5px;color:var(--muted);}
  .stamp-img{height:50px;max-width:110px;object-fit:contain;margin-top:4px;}
  .stamp-img-lg{height:72px;max-width:150px;object-fit:contain;}
  .acct-marks{margin-top:10px;font-size:12px;color:var(--doc-red);font-weight:600;}
  .acct-mark{margin-bottom:2px;}
  .sign-bottom-row{
    display:flex;justify-content:space-between;margin-top:34px;
    font-size:11.5px;color:var(--doc-red);font-weight:600;
  }
  .doc-date{color:var(--doc-red);font-size:13px;text-decoration:underline;font-weight:600;text-align:left;margin-top:-6px;margin-bottom:6px;}
  .doc-date div{line-height:1.3;}
  .doc-salutation{position:relative;font-weight:700;font-size:14px;margin-bottom:2px;text-align:right;}
  .doc-salutation .mohtaramin{position:absolute;left:28%;top:0;}
  .doc-greeting{font-weight:700;margin:0 0 6px;font-size:14px;text-align:right;padding-right:15%;}
  .doc-reqno{margin:0 0 4px;padding-left:30px;font-size:14px;color:var(--doc-red);font-weight:600;text-decoration:underline;text-align:left;}
  .doc-reqno .doc-red{display:inline-block;min-width:36px;}
  .doc-red{color:var(--doc-red);text-decoration:underline;}
  .doc-subject-bar{
    background:#EAEAE6;padding:7px 14px;text-align:center;font-weight:700;
    color:var(--doc-red);text-decoration:underline;margin-bottom:6px;border-radius:2px;font-size:14px;
  }
  .doc-body-text{margin-bottom:6px;font-size:14px;line-height:1.7;color:var(--text);}
  .doc-closing{margin:14px 0 8px;font-size:14px;font-weight:700;text-align:center;}
  .doc-page{
    background:#fff;max-width:720px;margin:0 auto 24px;position:relative;
    box-sizing:border-box;border:1px solid var(--line);border-radius:8px;
    font-family:'Times New Roman', Times, serif;
  }
  .doc-page.with-letterhead{
    aspect-ratio:210/297;background-size:100% 100%;background-repeat:no-repeat;
    padding:14% 8% 11%;overflow:auto;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;
  }
  .attachment-page{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:520px;padding:24px;
  }
  .attachment-title{font-size:14px;font-weight:600;margin-bottom:16px;text-align:center;}
  .attachment-dual{display:flex;gap:20px;width:100%;justify-content:center;}
  .attachment-col{flex:1;max-width:48%;display:flex;flex-direction:column;align-items:center;}
  .attachment-col img{max-width:100%;max-height:400px;object-fit:contain;border:1px solid var(--line);border-radius:4px;}
  .attachment-page img{max-width:100%;max-height:460px;object-fit:contain;border:1px solid var(--line);border-radius:4px;}
  .attachment-caption{margin-top:12px;font-size:13px;color:var(--muted);text-align:center;}
  .page-number{position:absolute;bottom:14px;left:18px;text-align:left;font-size:11px;color:var(--doc-red);font-weight:600;margin:0;}
  @media print{
    .topbar{display:none !important;}
    .container{padding:0;max-width:none;}
    .doc-page{page-break-after:always;border:none;margin:0 auto 0;}
    .doc-page:last-child{page-break-after:auto;}
    body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
    .no-print{display:none !important;}
  }
</style>
</head>

function placeholderImg(text, bg, fg){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='220' height='80'><rect width='100%' height='100%' fill='${bg}'/><text x='50%' y='55%' font-size='22' text-anchor='middle' fill='${fg}' font-family='sans-serif' font-weight='bold'>${text}</text></svg>`;
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function dbUserToState(u){
  return {id:u.id, phone:u.phone, password:u.password, name:u.name, role:u.role, centerId:u.center_id, signatureData:u.signature_data||'', stampData:u.stamp_data||''};
}
function dbCenterToState(c){
  return {id:c.id, name:c.name, letterheadData:c.letterhead_data||''};
}
function dbBeneficiaryToState(b){
  return {name:b.name, nameEn:b.name_en||'', iban:b.iban||'', idFileName:'', idFileData:b.id_file_data||'', bankFileName:'', bankFileData:b.bank_file_data||''};
}

async function loadAll(){
  const {data: centersData} = await db.from('centers').select('*');
  state.centers = (centersData||[]).map(dbCenterToState);

  const {data: usersData} = await db.from('users').select('*');
  state.users = (usersData||[]).map(dbUserToState);

  const {data: benData} = await db.from('beneficiaries_master').select('*');
  state.beneficiaries = (benData||[]).map(dbBeneficiaryToState);

  const {data: reqData} = await db.from('requests').select('*, request_beneficiaries(*), request_history(*)').order('created_at', {ascending:true});
  state.requests = (reqData||[]).map(r=>({
    id:r.id, number:r.number, reason:r.reason, totalAmount:Number(r.total_amount), status:r.status, origin:r.origin,
    centerId:r.center_id, createdBy:r.created_by, createdById:r.created_by_id, dateGreg:r.date_greg, dateHijri:r.date_hijri,
    createdAtRaw:r.created_at,
    beneficiaries:(r.request_beneficiaries||[]).map(b=>({
      name:b.name, nameEn:b.name_en||'', iban:b.iban||'', statement:b.statement||'', notes:b.notes||'',
      amount:Number(b.amount), deduction:Number(b.deduction||0), deductionNote:b.deduction_note||''
    })),
    history:(r.request_history||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(h=>({
      step:h.step, actor:h.actor, userId:h.user_id, action:h.action, note:h.note||'', time:h.time
    }))
  }));

  let maxN = 0;
  state.requests.forEach(r=>{ const m=(r.number||'').match(/(\d+)$/); if(m) maxN=Math.max(maxN, parseInt(m[1])); });
  state.reqCounter = maxN+1;
}

function fmtDate(){
  const d = new Date();
  return d.toLocaleDateString('ar-EG') + ' ' + d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
}
function numberToArabicWords(n){
  const ones = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة'];
  const onesF = ['', 'إحدى', 'اثنتا', 'ثلاث', 'أربع', 'خمس', 'ست', 'سبع', 'ثماني', 'تسع'];
  const teens = ['عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
  const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
  const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
  function threeDigits(num, feminine){
    let parts = [];
    const h = Math.floor(num/100), t = Math.floor((num%100)/10), o = num%10;
    if(h>0) parts.push(hundreds[h]);
    const rem = num%100;
    if(rem>=10 && rem<20){
      parts.push(teens[rem-10]);
    } else {
      if(o>0) parts.push(feminine ? onesF[o] : ones[o]);
      if(t>=2) parts.push(tens[t]);
    }
    return parts.join(' و');
  }
  function groupWords(num, singular, dual, plural, feminine){
    if(num===0) return '';
    if(num===1) return singular;
    if(num===2) return dual;
    if(num>=3 && num<=10) return threeDigits(num, true) + ' ' + plural;
    return threeDigits(num, feminine) + ' ' + singular;
  }
  if(n===0) return 'صفر';
  let result = [];
  const billions = Math.floor(n/1000000000);
  const millions = Math.floor((n%1000000000)/1000000);
  const thousands = Math.floor((n%1000000)/1000);
  const rest = n%1000;
  if(billions>0) result.push(groupWords(billions, 'مليار', 'ملياران', 'مليارات', false));
  if(millions>0) result.push(groupWords(millions, 'مليون', 'مليونان', 'ملايين', false));
  if(thousands>0) result.push(groupWords(thousands, 'ألف', 'ألفان', 'آلاف', false));
  if(rest>0) result.push(threeDigits(rest, false));
  return result.join(' و');
}

function amountToArabicWords(amount){
  const dinars = Math.floor(amount);
  const fils = Math.round((amount - dinars) * 1000);
  let text = '';
  if(dinars>0){
    if(dinars===2){
      text += 'ديناران كويتيان';
    } else {
      text += numberToArabicWords(dinars) + (dinars===1?' دينار كويتي' : (dinars>=3&&dinars<=10)?' دنانير كويتية':' دينار كويتي');
    }
  }
  if(fils>0){
    if(text) text += ' و';
    text += numberToArabicWords(fils) + ' فلس';
  }
  if(!text) text = 'صفر دينار كويتي';
  return 'فقط ' + text + ' لا غير';
}

function getDocDates(){
  const now = new Date();
  const dd = String(now.getDate()).padStart(2,'0');
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const yyyy = now.getFullYear();
  const greg = `<span dir="ltr">${dd}/${mm}/${yyyy}</span><span dir="rtl" style="unicode-bidi:isolate;">م</span>`;
  const weekday = new Intl.DateTimeFormat('ar', {weekday:'long'}).format(now);
  let hijri;
  try{
    const f = new Intl.DateTimeFormat('ar-u-ca-islamic-umalqura-nu-latn', {day:'numeric', month:'long', year:'numeric'});
    hijri = f.format(now);
    if(!hijri.includes('هـ')) hijri += ' هـ';
    hijri = `${weekday} ${hijri}`;
  }catch(e){ hijri = weekday; }
  return {greg, hijri};
}

async function submitDraft(){
  syncDraftFromDOM();
  const d = state.draft;
  const reasonInput = d.reason.trim();
  if(!reasonInput){ alert('الرجاء إدخال سبب الصرف'); return; }
  const beneficiaries = [];
  let hasInvalidAmount = false;
  let missingStatement = false;
  let missingAttachment = false;
  let badDeduction = false;
  d.beneficiaries.forEach(b=>{
    const name = (b.name||'').trim();
    if(!name) return;
    const amount = parseFloat(b.amount);
    const deduction = parseFloat(b.deduction) || 0;
    if(isNaN(amount) || amount<=0){ hasInvalidAmount = true; }
    if(deduction < 0 || deduction > amount){ badDeduction = true; }
    if(!(b.statement||'').trim()){ missingStatement = true; }
    const known = isKnownBeneficiary(name);
    if(!known && !b.idFileData){ missingAttachment = true; }
    beneficiaries.push({
      name, nameEn:(b.nameEn||'').trim(), iban:(b.iban||'').trim(),
      statement:(b.statement||'').trim(), notes:(b.notes||'').trim(),
      amount: isNaN(amount)?0:amount,
      deduction: deduction, deductionNote: (b.deductionNote||'').trim(),
      _idFileName: b.idFileName||'', _idFileData: b.idFileData||'',
      _bankFileName: b.bankFileName||'', _bankFileData: b.bankFileData||''
    });
  });
  if(beneficiaries.length===0){ alert('الرجاء إدخال بيانات مستفيد واحد على الأقل'); return; }
  if(hasInvalidAmount){ alert('الرجاء إدخال مبلغ صحيح لكل مستفيد'); return; }
  if(badDeduction){ alert('قيمة الخصم غير صحيحة (يجب ألا تتجاوز المبلغ)'); return; }
  if(missingStatement){ alert('حقل "البيان" إلزامي لكل مستفيد'); return; }
  if(missingAttachment){ alert('الرجاء رفع صورة الهوية/الفاتورة لكل مستفيد جديد'); return; }

  for(const b of beneficiaries){
    let master = state.beneficiaries.find(x=>x.name===b.name);
    if(!master){
      master = {name:b.name, nameEn:b.nameEn, iban:b.iban, idFileName:'', idFileData:'', bankFileName:'', bankFileData:''};
      state.beneficiaries.push(master);
    }
    const payload = {name:b.name, name_en:b.nameEn, iban:b.iban};
    if(b._idFileData){ master.idFileName = b._idFileName; master.idFileData = b._idFileData; payload.id_file_data = b._idFileData; }
    if(b._bankFileData){ master.bankFileName = b._bankFileName; master.bankFileData = b._bankFileData; payload.bank_file_data = b._bankFileData; }
    if(b.nameEn) master.nameEn = b.nameEn;
    if(b.iban) master.iban = b.iban;
    delete b._idFileName; delete b._idFileData; delete b._bankFileName; delete b._bankFileData;
    await db.from('beneficiaries_master').upsert(payload, {onConflict:'name'});
  }

  const total = beneficiaries.reduce((s,b)=>s + Math.max(b.amount - b.deduction, 0), 0);
  const beneRows = beneficiaries.map(b=>({name:b.name, name_en:b.nameEn, iban:b.iban, statement:b.statement, notes:b.notes, amount:b.amount, deduction:b.deduction, deduction_note:b.deductionNote}));

  if(state.editingReqId){
    const req = state.requests.find(r=>r.id===state.editingReqId);
    const newStatus = req.origin==='company' ? 'ceo' : 'mgr_center';
    const histEntry = {step: req.origin==='company'?'sec_company':'sec_center', actor: state.user.name, userId: state.user.id, action:'تعديل الطلب', note:'', time: fmtDate()};
    await db.from('requests').update({reason:reasonInput, total_amount:total, status:newStatus}).eq('id', req.id);
    await db.from('request_beneficiaries').delete().eq('request_id', req.id);
    await db.from('request_beneficiaries').insert(beneRows.map(r=>({...r, request_id:req.id})));
    await db.from('request_history').insert({request_id:req.id, step:histEntry.step, actor:histEntry.actor, user_id:histEntry.userId, action:histEntry.action, note:histEntry.note, time:histEntry.time});
    req.reason = reasonInput;
    req.beneficiaries = beneficiaries;
    req.totalAmount = total;
    req.status = newStatus;
    req.history.push(histEntry);
    state.editingReqId = null;
    state.view='dashboard';
    state.activeReqId = req.id;
    render();
    return;
  }

  const origin = state.user.role==='sec_company' ? 'company' : 'center';
  const creationStep = origin==='company' ? 'sec_company' : 'sec_center';
  const dates = getDocDates();
  const creatorUser = state.users.find(u=>u.id===state.user.id);
  const req = {
    id: 'r'+Date.now(),
    number: d.number,
    reason: reasonInput,
    totalAmount: total,
    beneficiaries,
    status: origin==='company' ? 'ceo' : 'mgr_center',
    createdBy: state.user.name,
    createdById: state.user.id,
    origin: origin,
    centerId: (origin==='center' && creatorUser) ? creatorUser.centerId : null,
    dateGreg: dates.greg,
    dateHijri: dates.hijri,
    createdAtRaw: new Date().toISOString(),
    history: [{step:creationStep, actor: state.user.name, userId: state.user.id, action:'إنشاء الطلب', note:'', time: fmtDate()}]
  };
  await db.from('requests').insert({
    id:req.id, number:req.number, reason:req.reason, total_amount:req.totalAmount, status:req.status,
    origin:req.origin, center_id:req.centerId, created_by:req.createdBy, created_by_id:req.createdById, date_greg:req.dateGreg, date_hijri:req.dateHijri
  });
  await db.from('request_beneficiaries').insert(beneRows.map(r=>({...r, request_id:req.id})));
  const h0 = req.history[0];
  await db.from('request_history').insert({request_id:req.id, step:h0.step, actor:h0.actor, user_id:h0.userId, action:h0.action, note:h0.note, time:h0.time});
  state.requests.push(req);
  state.view='dashboard';
  state.activeReqId = req.id;
  render();
}

async function approve(req){
  const me = state.users.find(u=>u.id===state.user.id);
  const needsSignature = ['mgr_center','sec_company','ceo'].includes(state.user.role);
  if(needsSignature && me && (!me.signatureData || !me.stampData)){
    state.returnTo = req.id;
    state.view = 'account';
    render();
    return;
  }
  const idx = currentStepIndex(req);
  const label = state.user.role==='accountant' ? 'تم عمل اللازم' : 'اعتماد';
  await pushHistory(req, {step:req.status, actor: state.user.name, userId: state.user.id, action: label, note:'', time: fmtDate()});
  const newStatus = req.status==='accountant' ? 'processing' : STEP_ORDER[idx+1];
  await setRequestStatus(req, newStatus);
  render();
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = e=>resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function saveAccount(){
  const me = state.users.find(u=>u.id===state.user.id);
  const newName = document.getElementById('accName').value.trim();
  const newPass = document.getElementById('accPass').value.trim();
  const idFile = document.getElementById('accSignFile').files[0];
  const bankFile = document.getElementById('accStampFile').files[0];

  const updates = {};
  if(newName){ updates.name = newName; }
  if(newPass){ updates.password = newPass; }
  if(idFile){ updates.signature_data = await readFileAsDataURL(idFile); }
  if(bankFile){ updates.stamp_data = await readFileAsDataURL(bankFile); }

  if(Object.keys(updates).length>0){
    await db.from('users').update(updates).eq('id', me.id);
    if(updates.name){ me.name = updates.name; state.user.name = updates.name; }
    if(updates.password) me.password = updates.password;
    if(updates.signature_data) me.signatureData = updates.signature_data;
    if(updates.stamp_data) me.stampData = updates.stamp_data;
  }

  if(state.returnTo){
    state.activeReqId = state.returnTo;
    state.returnTo = null;
    state.view = 'detail';
  } else {
    state.view = 'dashboard';
  }
  render();
}

function renderPrintPreview(app){
  const req = state.requests.find(r=>r.id===state.activeReqId);

  let letterhead = LETTERHEAD_IMG;
  if(req.origin==='center' && req.centerId){
    const center = state.centers.find(c=>c.id===req.centerId);
    if(center && center.letterheadData) letterhead = center.letterheadData;
  }

  const attachments = [];
  req.beneficiaries.forEach(b=>{
    const master = state.beneficiaries.find(x=>x.name===b.name);
    if(master && (master.idFileData || master.bankFileData)){
      attachments.push({name:b.name, idImg: master.idFileData||'', bankImg: master.bankFileData||''});
    }
  });
  const totalPages = 1 + attachments.length;

  const mainPage = `
    <div class="doc-page with-letterhead" style="background-image:url('${letterhead}')">
      ${renderLetterBody(req)}
      <div class="page-number">صفحة 1 من ${totalPages}</div>
    </div>`;

  const attachmentPages = attachments.map((a,i)=>`
    <div class="doc-page attachment-page">
      <div class="attachment-title">مرفقات المستفيد: ${a.name}</div>
      <div class="attachment-dual">
        <div class="attachment-col">
          ${a.idImg ? `<img src="${a.idImg}">` : `<div class="file-hint">لا يوجد</div>`}
          <div class="attachment-caption">صورة الهوية / الفاتورة</div>
        </div>
        <div class="attachment-col">
          ${a.bankImg ? `<img src="${a.bankImg}">` : `<div class="file-hint">لا يوجد</div>`}
          <div class="attachment-caption">معلومات البنك</div>
        </div>
      </div>
      <div class="page-number">صفحة ${i+2} من ${totalPages}</div>
    </div>`).join('');

  app.innerHTML = `
    <div class="preview-bar no-print">
      <span class="back-link" onclick="state.view='detail'; render();" style="margin:0;">→ رجوع للطلب</span>
      <button class="btn btn-primary" onclick="window.print()">طباعة / تحميل PDF</button>
    </div>
    <p class="sub no-print">هذه معاينة مطابقة تماماً للصفحات التي ستُطبع أو تُحفظ كملف PDF (${totalPages} صفحة).</p>
    ${mainPage}
    ${attachmentPages}
  `;
}

function render(){

function renderAnalytics(app){
  const role = state.user.role;
  const me = state.users.find(u=>u.id===state.user.id);
  const scopedToOwnCenter = (role==='sec_center' || role==='mgr_center');
  const myCenterId = scopedToOwnCenter ? me.centerId : null;

  const now = new Date();
  const selYear = state.analyticsYear || now.getFullYear();
  const selMonth = state.analyticsMonth || 'all';

  const years = new Set([now.getFullYear()]);
  state.requests.forEach(r=>{ if(r.createdAtRaw) years.add(new Date(r.createdAtRaw).getFullYear()); });
  const yearsList = Array.from(years).sort((a,b)=>b-a);

  const buckets = {};
  if(!scopedToOwnCenter){
    buckets['company'] = {name:'مصروفات الشركة المباشرة', total:0, count:0};
  }
  state.centers.forEach(c=>{
    if(scopedToOwnCenter && c.id!==myCenterId) return;
    buckets[c.id] = {name:c.name, total:0, count:0};
  });

  state.requests.forEach(r=>{
    if(r.status!=='paid') return;
    if(!r.createdAtRaw) return;
    const d = new Date(r.createdAtRaw);
    if(d.getFullYear()!==Number(selYear)) return;
    if(selMonth!=='all' && (d.getMonth()+1)!==Number(selMonth)) return;

    if(r.origin==='company'){
      if(scopedToOwnCenter) return;
      buckets['company'].total += r.totalAmount;
      buckets['company'].count += 1;
    } else {
      if(scopedToOwnCenter && r.centerId!==myCenterId) return;
      if(!buckets[r.centerId]) return;
      buckets[r.centerId].total += r.totalAmount;
      buckets[r.centerId].count += 1;
    }
  });

  const rows = Object.values(buckets);
  const grandTotal = rows.reduce((s,b)=>s+b.total,0);
  const grandCount = rows.reduce((s,b)=>s+b.count,0);

  const months = [
    {v:'all', n:'كل الشهور'},{v:1,n:'يناير'},{v:2,n:'فبراير'},{v:3,n:'مارس'},{v:4,n:'أبريل'},
    {v:5,n:'مايو'},{v:6,n:'يونيو'},{v:7,n:'يوليو'},{v:8,n:'أغسطس'},
    {v:9,n:'سبتمبر'},{v:10,n:'أكتوبر'},{v:11,n:'نوفمبر'},{v:12,n:'ديسمبر'}
  ];

  app.innerHTML = `
    <h1>التحليلات المالية</h1>
    <p class="sub">${scopedToOwnCenter ? 'إجمالي المصروف الفعلي لمركزك' : 'إجمالي المصروف الفعلي لكل المراكز والشركة'} (الطلبات المصروفة فقط)</p>
    <div class="row" style="max-width:420px;">
      <div><label>السنة</label>
        <select id="analyticsYear" onchange="state.analyticsYear=this.value; render();">
          ${yearsList.map(y=>`<option value="${y}" ${y==selYear?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
      <div><label>الشهر</label>
        <select id="analyticsMonth" onchange="state.analyticsMonth=this.value; render();">
          ${months.map(m=>`<option value="${m.v}" ${m.v==selMonth?'selected':''}>${m.n}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <table class="amount-table">
        <thead><tr><th>الجهة</th><th>عدد الطلبات المصروفة</th><th>إجمالي المصروف (د.ك)</th></tr></thead>
        <tbody>
          ${rows.map(b=>`<tr><td>${b.name}</td><td>${b.count}</td><td class="num">${b.total.toLocaleString()}</td></tr>`).join('')}
        </tbody>
      </table>
      <div class="amount-box" style="margin-top:14px;">
        <span class="amount-num">الإجمالي الكلي: ${grandTotal.toLocaleString()} د.ك</span>
        <span class="amount-words">(${grandCount} طلب مصروف)</span>
      </div>
    </div>
  `;
}

async function addCenter(){
  const name = document.getElementById('newCenterName').value.trim();
  if(!name){ alert('الرجاء إدخال اسم المركز'); return; }
  const file = document.getElementById('newCenterLetterhead').files[0];
  const center = {id:'c_'+Date.now(), name, letterheadData:''};
  if(file){ center.letterheadData = await readFileAsDataURL(file); }
  await db.from('centers').insert({id:center.id, name:center.name, letterhead_data: center.letterheadData || null});
  state.centers.push(center);
  render();
}

async function deleteCenter(id){
  if(!confirm('حذف هذا المركز؟')) return;
  await db.from('centers').delete().eq('id', id);
  state.centers = state.centers.filter(c=>c.id!==id);
  render();
}

async function addUser(){
  const name = document.getElementById('newUserName').value.trim();
  const phone = document.getElementById('newUserPhone').value.trim();
  const pass = document.getElementById('newUserPass').value.trim();
  const role = document.getElementById('newUserRole').value;
  const centerSelect = document.getElementById('newUserCenter');
  const centerId = centerSelect ? centerSelect.value : '';
  if(!name || !phone || !pass){ alert('الرجاء تعبئة جميع الحقول'); return; }
  if(state.users.some(u=>u.phone===phone)){ alert('رقم الهاتف مستخدم من قبل'); return; }
  const user = {id:'u_'+Date.now(), phone, password:pass, name, role, centerId: centerId||null, signatureData:'', stampData:''};
  await db.from('users').insert({id:user.id, phone:user.phone, password:user.password, name:user.name, role:user.role, center_id:user.centerId});
  state.users.push(user);
  render();
}

function editUser(id){
  state.editingUserId = id;
  render();
}

async function saveUserEdit(){
  const u = state.users.find(x=>x.id===state.editingUserId);
  if(!u) return;
  const name = document.getElementById('editUserName').value.trim();
  const phone = document.getElementById('editUserPhone').value.trim();
  const pass = document.getElementById('editUserPass').value.trim();
  const role = document.getElementById('editUserRole').value;
  const centerId = document.getElementById('editUserCenter').value;
  if(!name || !phone || !pass){ alert('الرجاء تعبئة جميع الحقول'); return; }
  if(state.users.some(x=>x.phone===phone && x.id!==u.id)){ alert('رقم الهاتف مستخدم من قبل'); return; }
  await db.from('users').update({name, phone, password:pass, role, center_id: centerId||null}).eq('id', u.id);
  u.name = name; u.phone = phone; u.password = pass; u.role = role; u.centerId = centerId || null;
  state.editingUserId = null;
  render();
}

      <p class="file-hint" style="margin-top:16px;">حسابات تجريبية جاهزة: سكرتير المركز (1/1)، مدير المركز (2/2)، سكرتير الشركة (3/3)، المدير التنفيذي (4/4)، المحاسب (5/5)، مدير النظام (admin/admin).</p>
    </div>
  `;
}

function renderDashboard(app){
  const role = state.user.role;
  const myId = state.user.id;
  const myCenterId = state.user.role==='mgr_center' ? (state.users.find(u=>u.id===myId)||{}).centerId : null;
  let listHtml = '';
  let visibleRequests = [];

  if(role==='sec_center'){
    visibleRequests = state.requests.filter(r=>r.createdById===myId && r.origin!=='company');
  } else if(role==='accountant'){
    visibleRequests = state.requests.filter(r=>['accountant','processing','paid'].includes(r.status));
  } else if(role==='sec_company'){
    const own = state.requests.filter(r=>r.origin==='company' && r.createdById===myId);
    const reviewing = state.requests.filter(r=>r.origin!=='company' && (r.status==='sec_company' || r.history.some(h=>h.step==='sec_company')));
    visibleRequests = own.concat(reviewing);
  } else if(role==='mgr_center'){
    visibleRequests = state.requests.filter(r=>
      r.origin!=='company' && r.centerId===myCenterId &&
      (r.status==='mgr_center' || r.history.some(h=>h.step==='mgr_center'))
    );
  } else {
    visibleRequests = state.requests.filter(r=>r.status===role || r.history.some(h=>h.step===role));
  }

  if(visibleRequests.length===0){
    listHtml = `<div class="empty">لا توجد طلبات لعرضها حالياً</div>`;
  } else {
    listHtml = visibleRequests.slice().sort((a,b)=>{
      const na = parseInt((a.number||'').match(/(\d+)$/)?.[1] || 0);
      const nb = parseInt((b.number||'').match(/(\d+)$/)?.[1] || 0);
      return nb - na;
    }).map(r=>`
      <div class="list-item" onclick="openRequest('${r.id}')">
        <div class="li-main">
          <b>${r.reason} — ${r.number}</b>
          <span>${r.beneficiaries.map(b=>b.name).join('، ')} · ${Number(r.totalAmount).toLocaleString()} د.ك</span>
        </div>
        ${statusBadge(r.status)}
      </div>`).join('');
  }

  const newBtn = (role==='sec_center' || role==='sec_company')
    ? `<button class="btn btn-primary" onclick="newDraft()">+ طلب صرف جديد</button>`
    : '';
  const listTitle = (role==='sec_center' || role==='sec_company') ? 'طلباتي' : 'الطلبات المطلوب اتخاذ إجراء بشأنها';

  app.innerHTML = `
    <h1>${findRole(role).name}</h1>
    <p class="sub">${findRole(role).desc}</p>
    ${newBtn ? `<div style="margin-bottom:20px;">${newBtn}</div>` : ''}
    <h2 style="margin-top:10px;">${listTitle}</h2>
    ${listHtml}
  `;
}

function renderNewRequest(app){
  const d = state.draft;
  app.innerHTML = `
    <span class="back-link" onclick="state.view='dashboard'; render();">→ رجوع</span>
    <h1>${state.editingReqId ? 'تعديل الطلب' : 'طلب صرف جديد'}</h1>
    <p class="sub">رقم الطلب: <b>${d.number}</b></p>
    <div class="card">
      <label>سبب الصرف</label>
      <input id="reasonInput" type="text" value="${d.reason||''}" placeholder="مثال: رواتب شهر 8-2026 أو عهدة">

      <label>المستفيدون (شخص أو أكثر، أو جهة)</label>
      <div id="beneficiaryList">
        ${d.beneficiaries.map((b,i)=>{
          const known = isKnownBeneficiary(b.name);
          const showUpload = !known || b._showUpload;
          return `
          <div class="beneficiary-block">
            ${d.beneficiaries.length>1 ? `<span class="remove-b" onclick="removeBeneficiaryRow(${i})">إزالة ✕</span>` : ''}
            <div class="row">
              <div>
                <label>الاسم</label>
                <input class="b-name" type="text" list="benList" value="${b.name||''}" placeholder="اسم الشخص أو الجهة" onchange="onBeneficiaryNameChange(${i},this.value)">
                <datalist id="benList">
                  ${state.beneficiaries.map(x=>`<option value="${x.name}">`).join('')}
                </datalist>
              </div>
              <div>
                <label>الاسم بالإنجليزية</label>
                <input class="b-nameEn" type="text" value="${b.nameEn||''}" placeholder="Name in English">
              </div>
            </div>
            <div class="row">
              <div>
                <label>رقم الآيبان (IBAN)</label>
                <input class="b-iban" type="text" value="${b.iban||''}" placeholder="KW00 XXXX XXXX XXXX">
              </div>
            </div>
            <div class="row">
              <div>
                <label>البيان *</label>
                <input class="b-statement" type="text" value="${b.statement||''}" placeholder="مثال: مستحقات شهر أغسطس">
              </div>
              <div>
                <label>ملاحظات (اختياري)</label>
                <input class="b-notes" type="text" value="${b.notes||''}" placeholder="أي ملاحظة إضافية">
              </div>
            </div>
            <div class="row">
              <div>
                <label>المبلغ (د.ك)</label>
                <input class="b-amount" type="number" value="${b.amount||''}" placeholder="0.000" oninput="updateTotalPreview()">
              </div>
              <div>
                <label>خصم (اختياري)</label>
                <input class="b-deduction" type="number" value="${b.deduction||''}" placeholder="0.000" oninput="updateTotalPreview()">
              </div>
            </div>
            <div class="row">
              <div>
                <label>بيان الخصم (اختياري)</label>
                <input class="b-deductionNote" type="text" value="${b.deductionNote||''}" placeholder="سبب الخصم إن وُجد">
              </div>
            </div>
            ${known && !showUpload ? `
            <div class="row">
              <div class="file-hint" style="color:var(--green);">✓ المرفقات (الهوية والبنك) محفوظة مسبقاً لهذا المستفيد
                <span class="add-beneficiary" style="margin-right:8px;" onclick="toggleAttachmentUpdate(${i})">تحديث المرفقات</span>
              </div>
            </div>` : `
            <div class="row">
              <div>
                <label>صورة الهوية أو الفاتورة ${known ? '(اختياري - تحديث)' : '(مطلوبة - أول مرة)'}</label>
                <input class="b-file-id" type="file" accept="image/*" onchange="handleAttachment(${i},'id',this)">
                ${b.idFileName ? `<div class="file-hint">تم اختيار: ${b.idFileName}</div>` : ''}
              </div>
              <div>
                <label>صورة معلومات البنك (اختياري)</label>
                <input class="b-file-bank" type="file" accept="image/*" onchange="handleAttachment(${i},'bank',this)">
                ${b.bankFileName ? `<div class="file-hint">تم اختيار: ${b.bankFileName}</div>` : ''}
              </div>
            </div>`}
          </div>
        `}).join('')}
      </div>
      <span class="add-beneficiary" onclick="addBeneficiaryRow()">+ إضافة مستفيد آخر</span>

      <div class="total-box">
        <span>الإجمالي (يُحسب تلقائياً)</span>
        <b id="totalPreview">0.000 د.ك</b>
      </div>

      <div class="actions-row">
        <button class="btn btn-primary" onclick="submitDraft()">${state.editingReqId ? 'حفظ التعديلات' : 'إرسال للاعتماد'}</button>
        <button class="btn btn-ghost" onclick="state.editingReqId=null; state.view='dashboard'; render();">إلغاء</button>
      </div>
    </div>
  `;
  updateTotalPreview();
}

function renderDetail(app){
  const req = state.requests.find(r=>r.id===state.activeReqId);
  const idx = req.status==='rejected_returned' ? -1 : (req.status==='paid' || req.status==='processing' ? STEP_ORDER.length : currentStepIndex(req));

  const stepperHtml = STEP_ORDER.map((s,i)=>{
    let cls='step';
    if(req.status==='rejected_returned'){
      cls += (i < req.history.filter(h=>h.action.includes('اعتماد')||h.action.includes('اللازم')).length) ? ' done' : '';
    } else if(req.status==='paid'){
      cls += ' done';
    } else if(req.status==='processing'){
      cls += (i<4) ? ' done' : ' current';
    } else if(i < idx){
      cls += ' done';
    } else if(i===idx){
      cls += ' current';
    }
    return `<div class="${cls}"><div class="dot">${i+1}</div><p>${STEP_LABELS[s]}</p></div>`;
  }).join('');

  const canAct = canActOn(req);
  const lastRejection = req.history.slice().reverse().find(h=>h.action==='رفض الطلب');

  let actionsHtml = '';
  if(req.status==='rejected_returned' && req.createdById===state.user.id){
    actionsHtml = `
      <div class="note-box no-print"><b>سبب الرفض:</b> ${lastRejection ? lastRejection.note : ''}</div>
      <div class="actions-row no-print"><button class="btn btn-primary" onclick="resubmitFix()">تعديل وإعادة الإرسال</button></div>`;
  } else if(canAct && req.status==='accountant'){
    actionsHtml = `<div class="actions-row no-print"><button class="btn btn-approve" onclick="approveFix()">تم عمل اللازم</button></div>`;
  } else if(canAct && req.status==='processing'){
    actionsHtml = '';
  } else if(canAct){
    actionsHtml = `
      <label class="no-print">ملاحظة (مطلوبة فقط عند الرفض)</label>
      <textarea id="rejectNote" class="no-print" placeholder="اكتب سبب الرفض هنا إن وُجد"></textarea>
      <div class="actions-row no-print">
        <button class="btn btn-approve" onclick="approveFix()">اعتماد</button>
        <button class="btn btn-reject" onclick="rejectFix()">رفض</button>
      </div>`;
  } else if(req.status==='processing' && state.user.role==='accountant'){
    actionsHtml = `<div class="actions-row no-print"><button class="btn btn-approve" onclick="markPaidFix()">تأكيد تم الصرف</button></div>`;
  }

  const isDocView = true;

  app.innerHTML = `
    <span class="back-link no-print" onclick="state.view='dashboard'; render();">→ رجوع للقائمة</span>
    <div class="doc">
      ${isDocView ? `
      <div class="actions-row no-print"><button class="btn btn-ghost" onclick="openPrintPreview('${req.id}')">معاينة الطلب / تحميل PDF</button></div>` : ''}

      ${(req.createdById===state.user.id && isEditable(req)) ? `
        <div class="actions-row no-print">
          <button class="btn btn-ghost" onclick="editRequest('${req.id}')">تعديل الطلب</button>
          <button class="btn btn-reject" onclick="deleteRequest('${req.id}')">حذف الطلب</button>
        </div>` : ''}

      <div class="stepper no-print">${stepperHtml}</div>

      ${renderLetterBody(req)}

      ${actionsHtml}

      <div class="history no-print">
        <h2>سجل الطلب</h2>
        ${req.history.map(h=>`
          <div class="history-item">
            <div class="t">${h.time}</div>
            <div><b>${h.actor}</b> — ${h.action} <span style="color:var(--muted);">(${STEP_LABELS[h.step]||h.step})</span>
              ${h.note ? `<div style="color:var(--red);margin-top:2px;">${h.note}</div>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>
  `;

  window.approveFix = ()=>approve(req);
  window.rejectFix = ()=>reject(req);
  window.markPaidFix = ()=>markPaid(req);
  window.resubmitFix = ()=>resubmit(req);
}

initApp();
</script>
</body>
</html>
