<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vmi3593541.contaboserver.net https://cdn.jsdelivr.net; frame-src 'self' blob: data:; media-src 'self' blob: data:; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2733">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميزان القيم">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>&#x200F;</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2733; --paper:#F7F6F2; --card:#FFFFFF;
    --line:#E3E0D6; --muted:#56554F; --text:#2C2B27;
    --blue:#2E5F8A; --blue-bg:#E8F0F6;
    --amber:#B5790E; --amber-bg:#FBF0DC;
    --green:#2E7D4F; --green-bg:#E5F3EA;
    --red:#B23A2E; --red-bg:#FBEAE7;
    --teal:#1F6E63; --teal-bg:#E4F1EE;
    --doc-red:#C0392B;
    --green-line:#BFE0CB; --amber-line:#F3D7A6; --info:#1D5FBF; --info-bg:#EEF5FC; --info-line:#CFE0F1; --violet:#3730A3; --violet-bg:#EEF2FF; --violet-line:#C7D2FE; --paper-2:#FAF9F6; --line-2:#CFCBBE; --on-strong:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html{overflow-x:clip;scrollbar-gutter:stable;scroll-padding-bottom:calc(var(--bar-h,0px) + 16px);}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.6;max-width:100%;font-size:var(--fs-body);}
  .topbar{
    background:var(--ink);color:#fff;padding:0 20px;height:56px;min-height:56px;max-height:56px;box-sizing:border-box;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;
    position:sticky;top:0;z-index:10;
  }
  .topbar .brand{font-weight:600;font-size:var(--fs-h2);}
  .topbar .brand{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto;}
  .brand-group{display:flex;align-items:center;gap:9px;min-width:0;}
  .brand-slot{width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;}
  .brand-slot img{max-width:100%;max-height:100%;object-fit:contain;}
  .brand-slot.is-blank{border:1.5px dashed rgba(255,255,255,.35);border-radius:8px;color:rgba(255,255,255,.55);font-size:var(--fs-h1);cursor:pointer;box-sizing:border-box;}
  .brand-slot.is-blank:hover{border-color:#D4AF37;color:#D4AF37;}
  .brand-name{font-weight:600;font-size:var(--fs-h2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;}
  .brand-sep{width:1px;height:34px;background:rgba(255,255,255,.22);flex:0 0 1px;}
  .brand-sub{color:#9FC2DB;font-weight:600;font-size:var(--fs-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;display:block;}
  @media (max-width:1000px){ .brand-co-group .brand-sub{font-size:var(--fs-label);max-width:200px;} .brand-sep{display:none;} }
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;flex:1;justify-content:flex-start;min-width:0;}
  .topbar-right .tb-tools{display:flex;align-items:center;gap:2px;margin-right:auto;min-width:0;}
  .imp-float{position:fixed;top:12px;left:0;right:var(--nav-w,0px);z-index:65;justify-content:center;pointer-events:none;}
  .imp-float > *{pointer-events:auto;}
  .imp-pill{background:var(--amber);color:#fff;border-radius:22px;padding:5px 8px 5px 16px;font-size:var(--fs-label);display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.3);}
  .imp-pill button{background:var(--card);color:var(--amber);border:none;border-radius:14px;padding:3px 12px;font-weight:700;cursor:pointer;font-size:var(--fs-hint);}
  .imp-pill .imp-min{padding:3px 9px;}
  .imp-dot{background:var(--amber);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:var(--fs-h2);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);}
  /* بطاقة الاسم أسفل القائمة هي الطريق إلى «حسابي» — وكان الأدمن بلا طريق إليها أصلاً */
  .nav-user{display:flex;align-items:center;gap:10px;padding:6px 8px 8px;color:#cfd8e3;
    cursor:pointer;border-radius:8px;border:none;background:none;font-family:inherit;text-align:right;}
  .nav-user:hover{background:rgba(255,255,255,.09);color:#fff;}
  .nav-user:focus-visible{outline:2px solid #D4AF37;outline-offset:1px;}
  .nav-user.on{background:rgba(255,255,255,.13);color:#fff;}
  .nav-avatar{width:32px;height:32px;border-radius:50%;background:#2E4356;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 32px;overflow:hidden;}
  .nav-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  /* صورة المستخدم: دائرة، أو الحرف الأول إن لم تُرفع صورة */
  .u-av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:0 0 32px;display:inline-flex;align-items:center;justify-content:center;}
  .u-av-l{background:#2E4356;color:#fff;font-weight:700;}
  .u-av-md{width:36px;height:36px;flex-basis:36px;margin-left:10px;}
  .u-av-lg{width:72px;height:72px;flex-basis:72px;font-size:var(--fs-display);}
  .av-edit{display:flex;align-items:center;gap:14px;margin:6px 0 4px;}
  .av-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .av-pick{cursor:pointer;}
  /* صفحة الدخول: اسم النظام وسطر يوضح دوره */
  /* صفحة الدخول: نصفان */
  .login-split{display:flex;min-height:min(620px, calc(100vh - 150px));margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card);}
  .login-brand{flex:1 1 50%;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:40px 48px;gap:6px;}
  .login-brand .lh-logo{height:72px;max-width:200px;object-fit:contain;align-self:flex-start;margin-bottom:10px;}
  .login-brand .lh-name{font-size:var(--fs-hero);font-weight:900;color:#fff;}
  .login-brand .lh-tag{font-size:var(--fs-h1);font-weight:800;color:#E8C766;line-height:1.5;margin-top:4px;}
  .login-brand .lh-pts{list-style:none;padding:0;margin:18px 0 6px;display:flex;flex-direction:column;gap:12px;}
  .login-brand .lh-pts li{display:flex;align-items:center;gap:10px;font-size:var(--fs-h3);font-weight:700;}
  .login-brand .lh-pts .qi{width:22px;height:22px;color:#E8C766;flex:0 0 22px;}
  .login-brand .lh-tail{font-size:var(--fs-body);color:rgba(255,255,255,.85);line-height:1.8;margin-top:6px;}
  .login-form{flex:1 1 50%;display:flex;align-items:center;justify-content:center;padding:30px 20px;}
  .login-card{width:100%;max-width:380px;margin:0;}
  .login-card h1{margin:0 0 6px;font-size:var(--fs-h1);}
  .login-card input:not([type=checkbox]){--fw:100% !important;width:100% !important;max-width:100% !important;box-sizing:border-box;}
  @media (max-width:760px){ .login-split{flex-direction:column;min-height:0;} .login-brand{padding:22px 20px;} .login-brand .lh-name{font-size:var(--fs-display);} .login-brand .lh-tag{font-size:var(--fs-h2);} .login-brand .lh-pts{display:none;} .login-brand .lh-tail{display:none;} .login-brand .lh-logo{height:48px;} }
  body.on-login .brand-name, body.on-login .brand-logo, body.on-login .brand-slot{display:none;}
  .login-hero{text-align:center;margin:8px auto 18px;max-width:660px;}
  .login-hero .lh-logo{height:64px;max-width:200px;object-fit:contain;display:block;margin:0 auto 8px;}
  .login-hero .lh-name{font-size:var(--fs-display);font-weight:900;color:var(--ink);letter-spacing:0;}
  .login-hero .lh-tag{font-size:var(--fs-h1);font-weight:800;color:var(--ink);margin-top:8px;line-height:1.5;}
  .login-hero .lh-tag2{font-size:var(--fs-h3);font-weight:600;color:var(--text);margin-top:8px;line-height:1.8;}
  @media (max-width:640px){ .login-hero .lh-tag{font-size:var(--fs-h2);} .login-hero .lh-tag2{font-size:var(--fs-body);} }
  .nav-uname{font-size:var(--fs-label);font-weight:600;color:#fff;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-urole{font-size:var(--fs-hint);color:#9FC2DB;}
  .app-nav[data-mode="collapsed"] .nav-uinfo{display:none;}
  .app-nav[data-mode="collapsed"] .nav-user{justify-content:center;padding:6px 0;}
  .brand-img-block{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand-preview{min-width:120px;max-width:340px;min-height:56px;background:repeating-conic-gradient(var(--line) 0% 25%,var(--card) 0% 50%) 50%/16px 16px;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;align-items:center;justify-content:center;}
  .brand-preview img{max-width:100%;max-height:90px;object-fit:contain;}
  .limit-tag{background:var(--red-bg);color:var(--red);border:1px solid var(--red);border-radius:10px;font-size:var(--fs-xs);font-weight:700;padding:1px 8px;white-space:nowrap;}
  .topbar-right select{width:auto !important;min-width:110px;max-width:200px;flex:0 1 auto;}
  .search-box{display:flex;gap:6px;}
  .search-results{
    position:absolute;top:100%;right:0;left:0;margin-top:4px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);z-index:50;max-height:280px;overflow-y:auto;
  }
  .search-result-item{
    padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;
    border-bottom:1px solid var(--line);color:var(--text);
  }
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:var(--paper);}
  .search-box input{
    border:none;border-radius:4px;padding:8px 10px;font-family:inherit;font-size:var(--fs-label);width:150px;
  }
  .search-box button{
    background:#2E4356;color:#fff;border:none;border-radius:4px;min-height:40px;padding:0 12px;font-size:var(--fs-label);cursor:pointer;
  }
  .role-chip{
    background:#2E4356;padding:7px 14px;border-radius:20px;font-size:var(--fs-label);display:flex;align-items:center;gap:8px;
  }
  .role-chip button{
    background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;
    font-size:var(--fs-label);padding:3px 10px;cursor:pointer;
  }
  .container{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  .banner{
    background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line);border-radius:6px;
    padding:12px 16px;font-size:var(--fs-label);margin-bottom:24px;
  }
  h1{font-size:var(--fs-h1);margin:0 0 6px;}
  h2{font-size:var(--fs-h2);margin:0 0 4px;}
  .sub{color:var(--muted);font-size:var(--fs-body);margin-bottom:24px;}
  .card{
    background:var(--card);border:2px solid var(--line);border-radius:8px;
    padding:16px;margin-bottom:16px;
  }
  .role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px;}
  /* ===== الشريط الجانبي الدائم ===== */
  :root{--nav-w:0px;--topbar-h:56px;}
  .nav-hamburger{display:none;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;font-size:var(--fs-h1);line-height:1;padding:6px 11px;cursor:pointer;}
  .app-nav{position:fixed;right:0;top:var(--topbar-h);bottom:var(--bar-h,0px);width:240px;z-index:20;background:var(--ink);color:#cfd8e3;
    display:none;flex-direction:column;box-sizing:border-box;border-left:1px solid rgba(255,255,255,.08);transition:width .15s;}
  .app-nav[data-mode="open"], .app-nav[data-mode="collapsed"], .app-nav[data-mode="drawer"]{display:flex;}
  .app-nav[data-mode="collapsed"]{width:64px;}
  .app-nav[data-mode="drawer"]{width:270px;top:0;bottom:0;z-index:90;box-shadow:-6px 0 24px rgba(0,0,0,.4);}
  .nav-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;}
  body.nav-drawer-open .nav-backdrop{display:block;}
  /* يبقى صندوق العمل في منتصف الصفحة قدر الإمكان: لا يُزاح إلا بالمقدار اللازم كي لا يتداخل مع الشريط */
  .shell-main{padding-right:var(--nav-pr,0px);padding-left:var(--nav-pl,0px);transition:padding .15s;}
  body:not(.has-nav) .shell-main{padding-right:0;}
  .nav-head{display:flex;align-items:center;gap:10px;padding:6px 12px 2px;}
  .nav-toggle{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;font-size:var(--fs-h2);line-height:1;padding:6px 10px;cursor:pointer;}
  .nav-toggle:hover{background:rgba(255,255,255,.1);}
  .nav-title{font-size:var(--fs-label);font-weight:700;color:#9FC2DB;}
  .nav-list{flex:1;overflow-y:auto;padding:2px 8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent;}
  .nav-list::-webkit-scrollbar{width:5px;} .nav-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:4px;}
  .nav-foot{padding:4px 8px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:4px;}
  .nav-foot .nav-user{flex:1;min-width:0;padding:4px 4px;}
  .nav-foot .nav-user > div:last-child{min-width:0;}
  .nav-foot .nav-item{flex:0 0 auto;padding:8px 10px;margin:0;}
  .nav-foot .nav-item .nav-label{display:none;}
  .app-nav[data-mode="collapsed"] .nav-foot{flex-direction:column;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:7px 12px;margin:1px 0;border-radius:8px;cursor:pointer;font-size:var(--fs-body);color:#cfd8e3;
    border-right:3px solid transparent;white-space:nowrap;position:relative;}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.13);color:#fff;font-weight:600;border-right-color:#D4AF37;}
  .nav-ico{width:22px;text-align:center;font-size:var(--fs-h3);flex:0 0 22px;display:inline-flex;align-items:center;justify-content:center;}
  .nav-ico .qi{width:20px;height:20px;}
  .nav-label{overflow:hidden;text-overflow:ellipsis;}
  .nav-count{background:#D4AF37;color:var(--ink);border-radius:10px;font-size:var(--fs-xs);font-weight:700;padding:1px 7px;margin-right:auto;}
  .nav-caret{margin-right:auto;font-size:var(--fs-xs);opacity:.7;}
  .nav-sub{padding:2px 0 6px;}
  .nav-subcat{font-size:var(--fs-xs);font-weight:700;color:#7f93a8;margin:4px 14px 0;line-height:1.5;}
  .admin-nav-item{display:block;padding:7px 12px 7px 8px;margin:1px 0;line-height:1.5;border-radius:7px;cursor:pointer;font-size:var(--fs-label);color:#cfd8e3;margin-right:18px;border-right:3px solid transparent;}
  .admin-nav-item .nav-count{float:left;margin:2px 0 0;}
  /* حقل فيه خطأ: إطار أحمر وهزّة خفيفة حتى يُصحَّح */
  .field-err{border-color:var(--red) !important;box-shadow:0 0 0 3px rgba(185,28,28,.18) !important;animation:qyShake .35s ease-in-out;}
  @keyframes qyShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  /* حسابي ← الأصوات: كل صوت سطر واحد (العنوان والشرح، ثم التحكم، ثم زر التجربة) */
  .snd-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line);}
  .snd-row:first-of-type{border-top:0;}
  .snd-lab{flex:1 1 260px;min-width:0;}
  .snd-lab .file-hint{margin:2px 0 0;}
  .snd-sw{display:flex !important;align-items:center;gap:8px;height:40px;margin:0 !important;font-weight:600;cursor:pointer;min-width:180px;}
  /* شارة «نسخة تجريبية» فوق اسم النظام (موقع الاختبار وحده) */
  .brand-name-col{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;gap:2px;flex:0 0 auto;} .brand-co-group{min-width:0;flex:1 1 auto;overflow:hidden;}
  .test-badge{background:var(--amber);color:#fff;font-size:var(--fs-hint);font-weight:700;line-height:18px;padding:0 9px;border-radius:9px;white-space:nowrap;letter-spacing:0;}
  /* مرشّحات داخل الصفحة (أزرار متجاورة لا صف تبويب) */
  .page-seg{flex-wrap:wrap;margin:0 0 12px;}
  /* ألوان حالات الطلب: شريط على يمين الطلب ومفتاح الألوان فوق القائمة؛ والمسنَد إليك بلون الإسناد */
  .status-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 8px;font-size:var(--fs-hint);color:var(--muted);}
  .status-legend span{display:inline-flex;align-items:center;gap:5px;}
  .status-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;}
  /* الرموز: خط رفيع بلون النص */
  .qi{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-0.2em;}
  .btn .qi-btn{margin-inline-end:.45em;}
  /* نظام العهدة */
  .custody-tag{display:inline-block;background:var(--violet-bg);color:var(--violet);border:1px solid var(--violet-line);border-radius:10px;font-size:var(--fs-xs);font-weight:700;padding:1px 8px;white-space:nowrap;}
  .badge.cus-badge{background:color-mix(in srgb, var(--cb) 13%, var(--card));color:var(--cb);border:1px solid color-mix(in srgb, var(--cb) 40%, #fff);white-space:nowrap;}
  .cus-panel{border:1px solid var(--line);border-right:4px solid var(--violet);border-radius:10px;padding:12px 14px;margin:12px 0;background:var(--paper);}
  .cus-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:var(--fs-body);color:var(--text);}
  .cus-title{font-weight:800;color:var(--violet);font-size:var(--fs-h3);}
  /* شريط العهدة في صفحة الطلب */
  .cus-strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border:1px solid var(--line);border-right:4px solid var(--violet);border-radius:10px;padding:8px 14px;margin:10px 0;background:var(--paper);font-size:var(--fs-body);color:var(--text);}
  .cus-strip.cus-strip-act{background:var(--amber-bg);border-right-color:var(--amber);}
  .cus-settle{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:10px;line-height:1.9;font-size:var(--fs-body);color:#000;}
  @media print{ body.printing-cus .history, body.printing-cus .top-action-bar, body.printing-cus .page-intro, body.printing-cus .sec-note{display:none !important;} }
  .cus-progress{margin:8px 0 4px;font-size:var(--fs-body);color:var(--text);}
  .cus-bar{height:6px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden;}
  .cus-bar span{display:block;height:100%;background:var(--green);}
  .cus-lines tr.cus-unreviewed td{background:var(--amber-bg);}
  .cus-lines tr.cus-unreviewed td:first-child{box-shadow:inset -4px 0 0 var(--amber);}
  .cus-line-form{background:var(--paper);margin-top:10px;}
  .cus-lines{margin-top:14px;}
  .cus-lines td .btn{margin:2px;}
  .cus-purpose{margin-top:8px;font-size:var(--fs-body);color:var(--text);line-height:1.7;}
  .cus-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px;}
  .cus-card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);min-width:0;}
  .cus-card.main{border-color:var(--violet);background:var(--violet-bg);}

    .cus-lines td[data-l="الوصف"]{grid-column:1 / 3;font-weight:700;} .cus-lines td[data-l="الوصف"]::before,.cus-lines td[data-l="الحالة"]::before,.cus-lines td[data-l="النوع"]::before{display:none;}

  /* أزرار فلتر الطلبات: مربّع اللون والاسم والعدد، حد أيمن (بلون الحالة) وحد أسفل وظل خفيف، ارتفاع 30 (استثناء مقصود من قاعدة 40) وعرض واحد ثابت يُقاس على أطول زر */

  /* ===== شريط التبويب السفلي — للهاتف وحده =====

  /* ===== نظام أحجام الحقول: كل حقل بقدر ما يُكتب فيه =====
     كانت كل الحقول width:100% فتتمدّد بعرض البطاقة — حقل الهاتف 656 بكسل
     وقائمة المركز 1324. فصار لكل حقل سقف (--fw)، والافتراضي 520 كي لا يشذّ
     حقلٌ نسيناه. وتوسيع الصفحة صار يخدم الجداول، لا يُمطّط النماذج. */
  /* الشبكة: ثمانية أعمدة عرض كلٍّ 80 وبينها 20 — مجموعها 780، وهو صافي
     صفحة 820 بعد حشوتها. فحقلان من مقاسٍ ما يساويان تماماً حقلاً من المقاس
     الذي يليه: 80+20+80=180 · 180+20+180=380 · 380+20+380=780. */
  input[type=text],input[type=number],input[type=password],input[type=email],input[type=tel],input[type=date],textarea,select{
    width:100%;max-width:var(--fw, 380px);padding:10px 12px;border:1px solid var(--line);border-radius:6px;
    font-family:inherit;font-size:var(--fs-body);background:var(--card);

  .doc-page.with-letterhead{

  .pv-zoom{width:210mm;margin:0 auto;}

  @media print{ .pv-zoom{zoom:1 !important;width:auto !important;margin:0 !important;} #app{margin:0 !important;max-width:none !important;} }

  /* ── فقاعة المساعد الذكي ───────────────────────────────────────── */
  /* الشريط الجانبي يمين الشاشة، فالفقاعة يسارها كي لا تركبه،
     وفوق شريط الدعم الفني (55 بكسل) لا عليه. والألوان ألوان النظام. */
  #qyamAssistant{
    direction:rtl;

    /* الألوان الأساسية من لوحة النظام */
    --chat--color--primary:var(--blue);
    --chat--color--primary-shade-50:#27527a;
    --chat--color--primary--shade-100:var(--ink);
    --chat--color--secondary:var(--green);
    --chat--color-secondary-shade-50:#266841;
    --chat--color-white:#fff;
    --chat--color-light:var(--paper);
    --chat--color-light-shade-50:#efeee9;
    --chat--color-light-shade-100:var(--line);
    --chat--color-medium:var(--muted);
    --chat--color-dark:var(--text);
    --chat--color-disabled:#9c9b95;
    --chat--color-typing:var(--muted);

    /* الأساس: الخطّ والحواف والمسافات كما في بقية النظام */
    --chat--font-family:'IBM Plex Sans Arabic',sans-serif;
    --chat--border-radius:8px;
    --chat--spacing:12px;
    --chat--transition-duration:.18s;

    /* النافذة */
    --chat--window--width:360px;
    --chat--window--height:min(540px, calc(100vh - 150px));
    --chat--window--border:1px solid var(--line);
    --chat--window--border-radius:10px;
    --chat--window--z-index:1200;

    /* الترويسة: داكنة كالشريط العلوي */
    --chat--header--background:var(--ink);
    --chat--header--color:#fff;
    --chat--header--padding:14px 16px;
    --chat--header--border-bottom:none;
    --chat--heading--font-size:var(--fs-h3);
    --chat--subtitle--font-size:var(--fs-hint);
    --chat--subtitle--line-height:1.6;

  /* الفقاعة ونافذتها يسار الشاشة، وفوق شريط الدعم الفني لا عليه */
  #qyamAssistant > *{right:auto !important; left:18px !important; bottom:70px !important;}

     صفّ الترويسة يُثبَّت على ltr ليكون order:-1 هو أقصى اليسار دائماً،

  #qyamAssistant .chat-heading{

  #qyamAssistant .chat-heading{margin:0 !important;padding:0 !important;}

  /* الرسمة التي أرسلتها (سهم 32px) هي فقاعة التبديل نفسها: تتحول إلى سهم "إغلاق"

     على ltr ليكون flex-start هو اليسار دائماً، ونعيد rtl للنافذة ومحتواها. */
  #qyamAssistant [class*="chat-window-wrapper"]{

  /* ===== تهذيب عام (10 نوفمبر — 2) ===== */

  /* ⓘ: الشرح الطويل مطويّ خلف علامة بجانب عنوانه */
  .tip-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:0 6px;padding:0;border:0;border-radius:50%;

  /* مؤشر التمرير الجانبي: طرف باهت وسهم ‹ حين يبقى محتوى جهة اليسار */
  .xs{position:relative;}
  .adm-tabs2.xs.xs-more{-webkit-mask-image:linear-gradient(to right, rgba(0,0,0,.25) 0, #000 46px);mask-image:linear-gradient(to right, rgba(0,0,0,.25) 0, #000 46px);}
  .adm-tabs2.xs.xs-start{-webkit-mask-image:linear-gradient(to left, rgba(0,0,0,.25) 0, #000 30px);mask-image:linear-gradient(to left, rgba(0,0,0,.25) 0, #000 30px);}
  .adm-tabs2.xs.xs-more.xs-start{-webkit-mask-image:linear-gradient(to right, rgba(0,0,0,.25) 0, #000 46px, #000 calc(100% - 30px), rgba(0,0,0,.25) 100%);mask-image:linear-gradient(to right, rgba(0,0,0,.25) 0, #000 46px, #000 calc(100% - 30px), rgba(0,0,0,.25) 100%);}
  .adm-nav2:has(.adm-tabs2.xs-more)::after{content:'‹';direction:ltr;unicode-bidi:isolate;position:absolute;left:4px;top:18px;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;background:rgba(27,39,51,.75);color:#fff;font-size:var(--fs-h2);line-height:21px;text-align:center;pointer-events:none;z-index:3;}
  /* الجداول العريضة: ظلّ بطول الجدول على الطرف الذي بقي فيه محتوى، وسهم في وسطه */
  .xs-shade{position:absolute;width:26px;pointer-events:none;z-index:3;display:none;}

  .xs-shade-r{background:linear-gradient(to left, rgba(27,39,51,.22), rgba(27,39,51,0));width:18px;margin-left:8px;border-radius:0 8px 8px 0;}
  .xs.xs-more + .xs-shade-r + .xs-shade-l,.xs.xs-start + .xs-shade-r{display:block;}
  .xs-shade-l::after{content:'‹';direction:ltr;unicode-bidi:isolate;position:absolute;left:2px;top:min(50%,150px);transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;background:rgba(27,39,51,.78);color:#fff;font-size:var(--fs-h2);line-height:21px;text-align:center;}

  /* ===== العملاء + المراكز + استيراد البوابة (صفحات cxv) ===== */
  /* النماذج: عمودان على الحاسوب، عمود واحد في الهاتف؛ الاسم فوق الحقل */
  /* مقاسات الحقول الموحّدة: f-xs نسبة/عدد (80) · f-sm مبلغ صغير/حالة (110) · f-md مبلغ/تاريخ (150) · f-lg قائمة/نص قصير (260) · بلا صنف = عريض */
  :root{--fw-xs:80px;--fw-sm:110px;--fw-md:150px;--fw-lg:260px;}
  #app.cxv .row{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;}
  #app.cxv .row > *{flex:1 1 calc(50% - 10px);max-width:none !important;width:auto;min-width:0;}
  #app.cxv .row > .f-xs,#app.cxv .row > .f-sm,#app.cxv .row > .f-md,#app.cxv .row > .f-lg{flex:0 0 auto;}
  #app .f-xs > label,#app .f-sm > label,#app .f-md > label{white-space:nowrap;}
  #app .f-xs input,#app .f-xs select{width:var(--fw-xs) !important;}
  #app .f-sm input,#app .f-sm select{width:var(--fw-sm) !important;}
  #app .f-md input,#app .f-md select{width:var(--fw-md) !important;}
  #app .f-lg input,#app .f-lg select,#app select.f-in-lg{width:var(--fw-lg) !important;max-width:100% !important;}
  #app.cxv .row > * > label{display:block;margin:0 0 6px;font-weight:700;font-size:var(--fs-label);color:var(--text);}
  #app.cxv .row input:not([type=checkbox]):not([type=file]),#app.cxv .row select{width:100%;max-width:100% !important;height:40px;box-sizing:border-box;}
  #app.cxv textarea{max-width:100% !important;width:100%;box-sizing:border-box;}
  #app.cxv .cx-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  #app.cxv .cx-pair > div > label{display:block;margin:0 0 6px;font-weight:700;font-size:var(--fs-label);}
  #app.cxv .cx-pair input{width:100% !important;max-width:100% !important;height:44px;}
  #app.cxv .row.cx-item{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--paper-2);}
  #app.cxv .row.cx-item > .btn{grid-column:1 / -1;justify-self:start;}
  #app.cxv .cx-row-btn{display:flex;align-items:flex-end;}
  /* بطاقات وأقسام */
  #app.cxv .card{margin-bottom:16px;}

  .cx-panel-h h2{margin:0;font-size:var(--fs-h2);display:flex;align-items:center;gap:8px;}
  .cx-h3{font-size:var(--fs-h3);font-weight:800;margin:18px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .cx-step{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:var(--fs-label);font-weight:700;}
  .cx-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .cx-note{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-size:var(--fs-label);}
  .cx-note.cx-note-red{background:var(--red-bg);color:var(--red);} .cx-range{align-items:flex-end;flex-wrap:wrap;} .cx-range > .file-hint{align-self:center;}

  .cx-chip-red{background:var(--red-bg);color:var(--red);}
  .cx-badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--blue-bg);color:var(--blue);font-size:var(--fs-hint);font-weight:700;white-space:nowrap;}
  .cx-st-potential{background:var(--teal-bg);color:var(--teal);} .cx-st-open{background:var(--amber-bg);color:var(--amber);} .cx-st-active{background:var(--green-bg);color:var(--green);} .cx-st-suspended{background:var(--red-bg);color:var(--red);}
  .cx-stnote{margin-top:6px;padding:6px 10px;border-radius:8px;font-size:var(--fs-hint);line-height:1.5;} .cx-stnote small{color:var(--muted);font-size:var(--fs-xs);}
  .cx-stnote-sus{background:var(--red-bg);color:var(--red);} .cx-stnote-cls{background:var(--paper-2);color:var(--text);}
  .cx-hero .cx-hero-t{min-width:0;flex:1 1 280px;}
  .cx-stpend{flex:1 1 100%;display:flex;justify-content:space-between;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;border:1px solid var(--line);}
  .cx-stpend-sus{background:var(--red-bg);border-color:var(--red);} .cx-stpend-open{background:var(--green-bg);border-color:var(--green);}
  .cx-stpend-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px;} .cx-stpend-t b{font-size:var(--fs-h3);} .cx-stpend-t span{font-size:var(--fs-hint);color:var(--text);}
  .cx-stpend-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;} .cx-stpend-f input{width:var(--fw-lg);max-width:100%;height:40px;box-sizing:border-box;margin:0;} .cx-st-closed{background:var(--paper-2);color:var(--muted);}
  select.cx-st-sel{font-weight:700;} select.cx-st-sel option{background:var(--card);color:var(--text);}
  .cx-mini.cx-mini-lg,.cx-mini.cx-mini-lg select{min-width:0;width:260px;} .cx-mini.cx-mini-md,.cx-mini.cx-mini-md select{min-width:0;width:150px;}
  .cx-mini-md > .cx-badge{align-self:flex-start;height:40px;display:inline-flex;align-items:center;padding:0 14px;}
  .cx-h-sm{font-size:var(--fs-body);font-weight:600;color:var(--muted);}
  .cx-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;} .cx-tags:empty{display:none;}
  .cx-tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--paper-2);color:var(--text);font-size:var(--fs-xs);font-weight:600;white-space:nowrap;}
  .cx-tag-amber{background:var(--amber-bg);color:var(--amber);} .cx-tag-neg{background:var(--red-bg);color:var(--red);}
  .cx-icards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .cx-icard{min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--card);transition:border-color .15s, box-shadow .15s;}
  .cx-icard:hover{border-color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.07);}
  .cx-icard-root{background:var(--paper-2);} .cx-icard-n{min-width:0;line-height:1.35;overflow-wrap:anywhere;} .cx-icard-h .cx-badge{flex:0 0 auto;}
  .cx-icard-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--fs-h3);min-width:0;}
  .cx-icard-m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:var(--fs-hint);color:var(--muted);font-weight:600;}
  .cx-icard-v{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px;border-radius:8px;background:var(--paper-2);}
  .cx-icard-v small{font-size:var(--fs-hint);color:var(--muted);font-weight:700;} .cx-icard-v b{font-size:var(--fs-h2);}
  .cx-icard-g{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-label);font-weight:700;} .cx-icard-g small{display:block;font-size:var(--fs-xs);color:var(--muted);font-weight:600;}
  .cx-bud{display:flex;flex-direction:column;gap:4px;margin-top:auto;} .cx-bud-l{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);font-weight:700;} .cx-bud .cx-bar-t{height:8px;}
  .cx-card-items{display:flex;gap:6px;flex-wrap:wrap;}
  /* خدمات الشركة (الكتالوج) */
  .ct-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:stretch;margin-top:6px;}
  .ct-wrap.ct-one{grid-template-columns:minmax(0,1fr);}
  .ct-tree{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px;min-width:0;}
  .ct-node{display:flex;flex-direction:column;}
  .ct-kids{display:flex;flex-direction:column;padding-inline-start:22px;border-inline-start:1px dashed var(--line);margin-inline-start:13px;}
  .ct-row{display:flex;align-items:center;gap:8px;min-height:40px;padding:2px 6px;border-radius:8px;}
  .ct-row:hover{background:var(--paper-2);} .ct-row.ct-sel{background:var(--paper-2);box-shadow:inset -3px 0 0 var(--ink);}

  .ct-tog:hover{background:var(--paper-2);color:var(--ink);}
  .ct-dot{width:26px;flex:0 0 26px;display:flex;justify-content:center;} .ct-dot::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--line);}
  .ct-name{flex:0 1 auto;min-width:0;text-align:start;border:0;background:none;cursor:pointer;padding:6px 0;font:inherit;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ct-l1 > .ct-row .ct-name{font-weight:800;font-size:var(--fs-h3);} .ct-l2 > .ct-row .ct-name{font-weight:700;} .ct-l3 > .ct-row .ct-name{font-weight:500;}
  .ct-name:hover{text-decoration:underline;text-underline-offset:3px;}
  .ct-cnt{flex:0 0 auto;margin-inline-end:auto;min-width:26px;text-align:center;font-size:var(--fs-xs);font-weight:700;color:var(--muted);background:var(--paper-2);border-radius:999px;padding:2px 8px;}
  .ct-price{flex:0 0 auto;margin-inline-start:auto;font-weight:700;white-space:nowrap;} .ct-price small{color:var(--muted);font-weight:500;}
  .ct-acts{display:inline-flex;gap:4px;flex:0 0 auto;opacity:0;transition:opacity .12s;}
  .ct-row:hover .ct-acts,.ct-row.ct-sel .ct-acts,.ct-row:focus-within .ct-acts{opacity:1;}
  @media (hover:none){ .ct-acts{opacity:1;} }
  .ct-ico{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .ct-ico svg{width:15px;height:15px;} .ct-ico-e{color:var(--info);} .ct-ico-d{color:var(--red);}
  .ct-ico-e:hover{background:var(--info-bg);border-color:var(--info);} .ct-ico-d:hover{background:var(--red-bg);border-color:var(--red);}
  .ct-add{align-self:flex-start;border:0;background:none;color:var(--muted);font:inherit;font-size:var(--fs-label);font-weight:700;cursor:pointer;padding:8px 6px;border-radius:6px;}
  .ct-add:hover{color:var(--ink);background:var(--paper-2);} .ct-add-1{margin-top:4px;color:var(--ink);}
  .ct-side{position:relative;min-width:0;}
  .ct-pop{position:absolute;inset-inline:0;top:0;z-index:5;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);padding:12px 14px;box-shadow:0 10px 28px rgba(20,20,20,.13);transition:top .15s ease;}
  .ct-pop::before{content:"";position:absolute;right:-8px;top:var(--ar,22px);width:13px;height:13px;background:var(--card);border-top:1.5px solid var(--ink);border-right:1.5px solid var(--ink);transform:rotate(45deg);transition:top .15s ease;}
  .ct-hint{color:var(--muted);font-size:var(--fs-label);padding:10px 4px;line-height:1.7;}

  .ct-kvs{display:flex;flex-direction:column;gap:6px;}

  .ut-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;} .ut-viewsw{display:flex;gap:6px;}

  /* المشاريع والعقود */
  .btn[hidden]{display:none !important;}
  .pj-chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px;}
  .pj-chip{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:inherit;font-size:var(--fs-label);font-weight:700;color:var(--muted);cursor:pointer;}
  .pj-chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .pj-csel{width:180px !important;min-width:0;}
  .pj-list{display:flex;flex-direction:column;gap:8px;}
  /* صف الأدوات: العملاء ← الحالة ← البحث ← + مشروع جديد (أول عنصر يمين الصفحة) */
  .pj-tools{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;max-width:820px;margin-bottom:10px;} .pj-tools > .btn{flex:0 0 150px;}
  #app .pj-tools select{width:170px !important;flex:0 0 170px;height:40px;} #app .pj-tools .pj-search{width:auto !important;flex:1 1 160px;max-width:280px;min-width:0;height:40px;}
  .pj-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);margin:2px 0 10px;}
  .pj-legend span{display:inline-flex;align-items:center;gap:5px;} .pj-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}

  /* ===== ضبط عرض الهاتف (10 نوفمبر — 3) ===== */
  /* حركة المسار: يخرج من زرّه ويعود إليه */
  @keyframes qyPathIn{from{transform:scale(.06);opacity:.2;}to{transform:none;opacity:1;}}
  @keyframes qyPathOut{from{transform:none;opacity:1;}to{transform:scale(.06);opacity:.15;}}
  @keyframes qyFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes qyFadeOut{from{opacity:1;}to{opacity:0;}}
  @keyframes qyPulse{0%{box-shadow:0 0 0 0 rgba(212,160,23,.75);background:rgba(212,160,23,.35);}100%{box-shadow:0 0 0 16px rgba(212,160,23,0);background:transparent;}}
  .mpath{transform-origin:10vw calc(100% + 26px);}
  .mpath.opening{animation:qyPathIn .26s cubic-bezier(.2,.8,.3,1) both;}
  .mpath.closing{animation:qyPathOut .24s ease-in both;}
  .mpath-ov.opening{animation:qyFadeIn .2s both;} .mpath-ov.closing{animation:qyFadeOut .24s both;}
  .mtab-btn.mtab-pulse{animation:qyPulse .7s ease-out 2;border-radius:12px;}
  .req-side{transform-origin:22px 22px;}
  .req-side.opening{animation:qyPathIn .24s cubic-bezier(.2,.8,.3,1) both;}
  .req-side.closing{animation:qyPathOut .22s ease-in both;}
  .req-side.pulse{animation:qyPulse .7s ease-out 2;}
  @media (prefers-reduced-motion:reduce){ .mpath,.mpath-ov,.req-side,.mtab-btn.mtab-pulse{animation:none !important;} }

  /* خطوط النظام عريضة: النص العادي 600، والعريض 700 (أقصى وزن للخط) فيبقى الفرق */

  /* الحاسوب */
  :root{--fs-xs:11px;--fs-hint:12px;--fs-label:13px;--fs-body:14px;--fs-h3:15px;--fs-h2:18px;--fs-h1:22px;--fs-display:26px;--fs-hero:32px;}
  /* الهاتف: العناوين والأرقام الكبيرة أصغر، والنص كما هو */
  @media (max-width:760px){ :root{--fs-h2:17px;--fs-h1:20px;--fs-display:24px;--fs-hero:26px;} }
  /* العناصر المتشابهة بحجم واحد في كل الصفحات */
  #app h1{font-size:var(--fs-h1) !important;}
  #app h2{font-size:var(--fs-h2);}
  #app h3{font-size:var(--fs-h3);}
  #app label{font-size:var(--fs-label);}
  #app .sub,#app .page-intro{font-size:var(--fs-body);}
  #app .file-hint{font-size:var(--fs-hint);}
  #app .exec-table th,#app table.cx-tbl th{font-size:var(--fs-body) !important;}
  #app .exec-table td,#app table.cx-tbl td{font-size:var(--fs-label);}
  hr,.qy-hr{border:0;border-top:1px solid var(--line);margin:var(--sep) 0 !important;}
  #app .nr-sec{padding-top:var(--sep) !important;margin-top:calc(var(--sep) - 10px) !important;}
  #app .nr-form .nr-rec-row + .nr-sec{margin-top:calc(var(--sep) - 10px) !important;}
  .cus-form .cf-sec{margin:calc(var(--sep) * 2) 0 var(--sep) !important;padding-bottom:var(--sep) !important;}
  .cus-form .cf-sec:first-child{margin-top:0 !important;}
  .beneficiary-block-header{padding-bottom:var(--sep) !important;margin-bottom:var(--sep) !important;}
  .top-action-bar{padding-bottom:var(--sep) !important;margin-bottom:var(--sep) !important;}
  .app-req-header{padding-bottom:var(--sep) !important;margin-bottom:var(--sep) !important;}
  /* رقم الطلب والتاريخ دائماً عند يسار الصفحة، حتى حين ينزلان تحت العنوان في سطر مستقل على الهاتف (الصفحة RTL: الهامش الأيمن التلقائي يدفع العنصر لليسار) */
  .app-req-header .app-req-meta{margin-right:auto;margin-left:0;text-align:left;align-items:stretch;}
  .approval-list{padding-top:var(--sep) !important;}
  .history{margin-top:var(--sep) !important;padding-top:var(--sep) !important;}
  .cus-strip-nav{margin-top:var(--sep) !important;padding-top:var(--sep) !important;}
  /* «طلب متكرر» ومثاله متلاصقان */
  #app .nr-form .check-line.nr-rec{min-height:0 !important;line-height:1.35;}
  #app .nr-rec-hint{margin:0 30px 0 0 !important;line-height:1.35;}
  /* الخصم أحمر والإضافي أخضر: في الزر بعد الحفظ وفي حقل المبلغ عند الكتابة */
  #app .nr-adj .nr-chip{font-size:var(--fs-label) !important;text-overflow:clip !important;padding:0 4px !important;letter-spacing:-.2px;}
  #app .nr-adj .nr-chip-deduction{background:var(--red-bg) !important;border-color:#c0392b !important;color:var(--red) !important;}
  #app .nr-adj .nr-chip-extra{background:var(--green-bg) !important;border-color:var(--green) !important;color:var(--green) !important;}
  #app .nr-adj .nr-chip b{font-size:var(--fs-body);}
  input.nr-adj-ded:not(:placeholder-shown){color:var(--red);border-color:#c0392b !important;background:var(--red-bg);}
  input.nr-adj-ext:not(:placeholder-shown){color:var(--green);border-color:var(--green) !important;background:var(--green-bg);}
  /* البند و«طلب متكرر»: متجاوران على سطح المكتب، ومثال التكرار ملاصق لعنوانه */
  #app .nr-bi-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:start;}
  #app .nr-bi-col{display:grid;gap:6px;min-width:0;}
  #app .nr-bi-row .nr-rec-row{padding-top:30px;display:flex;align-items:center;gap:10px;}
  #app .nr-rec-row .nr-rec{align-items:flex-start !important;}
  #app .nr-rec-row .nr-rec input{margin-top:3px;}
  #app .nr-rec-t{display:flex;flex-direction:column;line-height:1.3;}
  #app .nr-rec-t .nr-rec-hint{display:block;margin:1px 0 0 !important;font-size:var(--fs-hint);font-weight:600;color:var(--muted);line-height:1.3;}
  @media (max-width:699px){
    #app .nr-bi-row{grid-template-columns:minmax(0,1fr);gap:8px;}
    #app .nr-bi-row .nr-rec-row{padding-top:0;justify-content:space-between;}
  }
  /* زر الخصم/الإضافي بعد الحفظ: الكلمة أعلى والمبلغ تحتها، فيتسع لأي رقم */
  #app .nr-adj .nr-chip{display:flex !important;flex-direction:column;align-items:center;justify-content:center;height:auto !important;min-height:40px;line-height:1.2 !important;padding:3px 4px !important;white-space:normal !important;}
  #app .nr-adj .nr-chip .nr-cw{font-size:var(--fs-hint);}
  #app .nr-adj .nr-chip b{font-size:var(--fs-body);white-space:nowrap;}
  /* اسم الحقل على سطرين متقاربين في الهاتف فيضيق عمود الأسماء وتكبر الحقول */
  @media (max-width:699px){ #app .nr-form .nr-l2{display:block;line-height:1.1;} #app .nr-form .lf > label{line-height:1.15;} }
  #app .nr-grid .field-with-calc{max-width:100%;}
  #app input.b-deduction:not([type=hidden]):not(:placeholder-shown){color:var(--red);border-color:#c0392b !important;background:var(--red-bg);}
  #app input.b-extra:not([type=hidden]):not(:placeholder-shown){color:var(--green);border-color:var(--green) !important;background:var(--green-bg);}
  /* سطح المكتب: الخصم وبيانه والإضافي وبيانه — عموداً بعمودين، ومن عرض 820 صف واحد (قليلة الاستخدام) */
  #app .nr-adjrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;}
  @media (min-width:820px){ #app .nr-adjrow{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 10px;} #app .nr-adjrow label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs-hint);} }
  /* صندوق «احسب» ينفتح تحت حقله مباشرة، صغيراً فوق ما تحته */
  #app .nr-adjrow > .nr-f{position:relative;}
  #app .nr-calc-pop{position:absolute;top:100%;right:0;z-index:30;width:max(100%,250px);margin-top:4px !important;padding:10px !important;background:var(--card);box-shadow:0 8px 22px rgba(0,0,0,.18);border-radius:8px;}
  #app .nr-calc-pop label{margin:0 0 3px !important;font-size:var(--fs-hint);}
  #app .nr-calc-pop input,#app .nr-calc-pop select{width:100% !important;max-width:100% !important;margin:0 0 6px !important;}
  #app .nr-calc-pop .file-hint{margin:0 0 8px !important;font-size:var(--fs-hint);}
  #app .nr-calc-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  #app .nr-calc-acts .btn{width:100% !important;min-width:0 !important;margin:0 !important;}
  /* الاعتماد الورقي */
  .paper-note{background:var(--info-bg) !important;border-color:var(--info) !important;color:var(--text);line-height:1.6;}
  .paper-note-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .paper-docs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .paper-proxies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  @media (max-width:699px){ .paper-proxies{grid-template-columns:minmax(0,1fr);gap:6px;} }
  .paper-rec-box{max-width:440px;width:calc(100% - 24px);}
  .paper-rec-box label{margin:8px 0 4px;}
  .paper-rec-box input,.paper-rec-box textarea{width:100% !important;max-width:100% !important;}
  .paper-stamp{border:2px solid var(--info);color:var(--info);border-radius:6px;padding:2px 6px;transform:rotate(-6deg);display:flex;flex-direction:column;align-items:center;line-height:1.25;background:rgba(255,255,255,.6);text-align:center;}
  .paper-stamp b{font-size:1.25em;letter-spacing:.3px;}
  .paper-stamp.rej{border-color:var(--red);color:var(--red);}
  .paper-note-acts .btn{width:auto !important;min-width:0 !important;white-space:nowrap;padding-left:12px !important;padding-right:12px !important;}
  /* أزرار الصورة الشخصية: بجوار الصورة فوق بعض، بعرض واحد */
  #app .av-btns{display:flex;flex-direction:column;gap:6px;width:140px;}
  #app .av-btns .btn{width:100% !important;min-width:0 !important;margin:0 !important;justify-content:center;}
  /* «بانتظارك الآن» أعلى صفحة الطلب */
  .my-turn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--amber-bg);border:2px solid var(--amber);border-radius:10px;padding:10px 14px;margin:0 0 12px;}
  .my-turn-t{font-size:var(--fs-h3);color:var(--text);}
  .my-turn .btn{grid-row:1 / span 2;grid-column:2;min-width:120px;}
  .my-turn-h{font-size:var(--fs-hint);color:var(--muted);}
  @media (max-width:699px){ .my-turn{grid-template-columns:minmax(0,1fr);} .my-turn .btn{grid-row:auto;grid-column:auto;width:100% !important;} }
  /* الهاتف — الشريط السفلي بسطرين عند وجود أزرار الصفحة: الأعلى أزرار بأسمائها، والأسفل أيقونات تنقّل صغيرة */
  .mtab-acts{display:grid;grid-template-columns:repeat(var(--mta-cols,3),minmax(0,1fr));gap:6px;padding:6px 8px 4px;}
  .mta{height:40px;border-radius:8px;font:inherit;font-size:var(--fs-label);font-weight:800;border:1.5px solid var(--muted);background:#24384a;color:#fff;padding:0 4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .mta-ok{background:var(--green);border-color:var(--green);}
  .mta-pri{background:var(--blue);border-color:var(--info);}
  .mta-no{background:transparent;border-color:#e57368;color:#ffb4ab;}
  .mta-gh{background:transparent;border-color:#8ea3b8;color:var(--info-bg);}
  .mta-off{opacity:.45;}
  .mtab-icons{height:44px !important;border-top:1px solid rgba(255,255,255,.08);}
  .mtab-icons .mtab-btn .mtab-ico .qi{width:22px !important;height:22px !important;}
  .mtab-icons .mtab-dot{top:3px;}
  @media (max-width:699px){
    body.has-nav:not(.m-focus) .container{padding-bottom:calc(var(--mtab-h,56px) + 20px) !important;}
    body.has-nav:not(.m-focus) #qyamAssistant > *{bottom:calc(var(--mtab-h,56px) + 12px) !important;}
  }
  .paper-tag{color:var(--info);font-weight:700;white-space:nowrap;}
  .step.step-paper{position:relative;}
  .paper-pill{display:inline-block;background:var(--info-bg);border:1.5px solid var(--info);color:var(--info);border-radius:10px;padding:0 7px;font-size:var(--fs-hint);font-weight:800;line-height:18px;white-space:nowrap;vertical-align:middle;}
  .badge.paper-badge{background:var(--info-bg);color:var(--info);border:1.5px solid var(--info);margin-top:3px;font-size:var(--fs-xs);font-weight:800;white-space:nowrap;}
  /* علامة الاعتماد الورقي في المسار: 📄 بجوار الدائرة بإطار أزرق، لا تأخذ مكاناً */
  .step.step-paper .dot{overflow:visible;}
  .step.step-paper .dot::after{content:'';position:absolute;top:70%;left:-9px;transform:translateY(-50%);width:18px;height:18px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 2h8l5 5v15H6z' fill='%23ffffff' stroke='%233b82c4' stroke-width='1.6' stroke-linejoin='round'/><path d='M14 2v5h5' fill='none' stroke='%233b82c4' stroke-width='1.6' stroke-linejoin='round'/><path d='M9 12h7M9 15h7M9 18h5' stroke='%233b82c4' stroke-width='1.4' stroke-linecap='round'/></svg>") center/contain no-repeat;filter:drop-shadow(0 1px 2px rgba(59,130,196,.45));pointer-events:none;}
  @media (max-width:699px){ .step.step-paper .dot::after{width:15px;height:15px;left:-8px;} }
  /* الهاتف: شارات الحالة في بطاقة الطلب بعرض واحد */
  /* كل شارات خانة الحالة بارتفاع واحد (سطح المكتب) وبعرض وارتفاع واحد (الهاتف) */
  .req-card > span[data-label="الحالة"] .badge{font-size:var(--fs-hint) !important;line-height:1.2 !important;min-height:26px;padding-top:0 !important;padding-bottom:0 !important;box-sizing:border-box;align-items:center;justify-content:center;}
  @media (min-width:700px){ .req-card > span[data-label="الحالة"] .badge{display:inline-flex !important;} }
  @media (max-width:699px){ .req-card > span[data-label="الحالة"] .badge{display:flex !important;width:12.5em !important;height:30px !important;min-height:30px;max-width:100%;text-align:center;box-sizing:border-box;margin:3px 0 0 !important;font-size:var(--fs-hint) !important;padding-left:6px !important;padding-right:6px !important;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;} }

  /* كل الشارات بإطار 1 بكسل بلونها (كشارة «معتمد ورقياً») */
  .badge{border:1.5px solid color-mix(in srgb, currentColor 55%, transparent);}
  .note-box.paper-docs{background:var(--info-bg) !important;border-color:var(--info) !important;color:var(--info) !important;}

  /* ═══ (1.20.0) لا كبسولات: الشارات والحالات نقطة ملوّنة ثم نص عريض بنفس اللون — عدا حالات طلبات الصرف (.badge العادية) ═══ */
  #app .cx-badge, #app .cx-tag, #app .cx-chip, .admin-co-badge, #app .unit-chip, .limit-tag, .custody-tag, .paper-pill,
  .badge.cus-badge, .badge.handed-badge, .badge.paper-badge, .req-card .badge.handed-badge{
    display:inline-flex !important;align-items:center;gap:6px;width:auto !important;max-width:100%;
    background:none !important;border:0 !important;border-radius:0 !important;box-shadow:none !important;
    padding:0 !important;font-weight:800 !important;text-align:start !important;line-height:1.35;}
  #app .cx-badge::before, #app .cx-tag::before, #app .cx-chip::before, .admin-co-badge::before, #app .unit-chip::before, .limit-tag::before, .custody-tag::before, .paper-pill::before,
  .badge.cus-badge::before, .badge.handed-badge::before, .badge.paper-badge::before{
    content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto;}
  #app .cx-chip{color:var(--text);} #app .cx-chip::before{background:var(--muted);} #app .cx-chip-red{color:var(--red);} #app .cx-chip-red::before{background:var(--red);}
  #app .cx-tag{color:var(--muted);} #app .cx-tag-amber{color:var(--amber);} #app .cx-tag-neg, #app .cx-tag-red{color:var(--red);}
  #app .unit-chip{color:var(--muted);margin-inline-start:6px;} #app .unit-chip.on{color:var(--blue);}
  #app .cx-mini-md > .cx-badge{height:40px;}
  /* أزرار التبديل (شجرة/قائمة…): أزرار مستطيلة عادية بارتفاع 40، والمختار ممتلئ */
  .pj-chip{height:40px !important;border-radius:6px !important;padding:0 16px !important;min-width:105px;}
  /* صفحة المشروع في الهاتف: «كل المشاريع» وزر الخطوة متجاوران والشريط تحتهما، ومسافات أقل بين الأقسام */
  @media (max-width:699px){
    .pj-top{gap:8px;} .pj-top > .btn{flex:1 1 0;min-width:0;}
    .pj-top .pj-next{order:3;flex:1 1 100% !important;height:auto;min-height:40px;padding:8px 12px;}
    .pj-top .pj-next-t{white-space:normal;}
    #app:has(> .pj-top) > .card{margin:0 0 4px !important;padding-top:10px !important;padding-bottom:10px !important;border-bottom:1px solid var(--line) !important;}
    #app:has(> .pj-top) .cx-panel-h{margin-bottom:8px;}
  }
  /* صفحة المشروع: عنوان الحقل بنفس حجم قيمته (رمادي عادي، والقيمة عريضة)، وأرقام المبالغ ملوّنة بلا صناديق */
  .pj-kv2 span, .pj-kv2 b{font-size:var(--fs-body,15px) !important;} .pj-kv2 span{font-weight:600;color:var(--muted);} .pj-kv2 b{font-weight:800;}
  .pj-figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:0 0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .pj-fig{display:flex;flex-direction:column;gap:4px;padding:10px 12px;min-width:0;border-inline-start:1px solid var(--line);}
  .pj-fig:first-child{border-inline-start:0;padding-inline-start:0;}
  .pj-fig span{font-size:var(--fs-body,15px);font-weight:600;color:var(--muted);} .pj-fig b{font-size:var(--fs-h3,18px);font-weight:800;white-space:nowrap;} .pj-fig small{font-size:var(--fs-xs);color:var(--muted);}
  .pj-fig.pj-in b{color:var(--green);} .pj-fig.pj-out b{color:var(--red);}
  @media (max-width:899px){ .pj-figs{grid-template-columns:repeat(2,minmax(0,1fr));} .pj-fig{border-inline-start:0;border-bottom:1px solid var(--line);padding-inline:0;} .pj-fig:nth-child(even){padding-inline-start:12px;border-inline-start:1px solid var(--line);} .pj-fig:last-child{border-bottom:0;} }
  /* الهاتف: كل الأقسام بنفس الخلفية (لا صناديق داخلها)، وجداولها بطاقات بخلفية فاتحة موحّدة */
  @media (max-width:699px){
    #app:has(> .pj-top) .pj-kv2{grid-template-columns:120px minmax(0,1fr);}
    #app:has(> .pj-top) table.tcards tbody tr{background:transparent !important;border:0 !important;border-bottom:1px solid var(--line) !important;border-radius:0 !important;box-shadow:none !important;padding-inline:0 !important;}
    .pj-fig:last-child:nth-child(odd){grid-column:1 / -1;}
  }
  /* أزرار سطر الفاتورة في الهاتف: زرّان في كل سطر بعرض متساوٍ وارتفاع 40 */
  @media (max-width:699px){
    #app .pj-acts-w{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;min-width:0;}
    #app .pj-acts-w > .btn{width:100% !important;min-width:0 !important;height:40px !important;margin:0 !important;padding:0 8px !important;white-space:nowrap;}
    #app table.tcards td.pj-acts{display:block !important;width:100%;}
  }
  .pj-step-go{cursor:pointer;min-width:0;display:flex;} .pj-step-go > .pj-step{flex:1;} .pj-step-go:hover .pj-step{border-color:var(--ink);}
  .pj-flash{animation:pjflash 1.3s ease;} @keyframes pjflash{0%,60%{box-shadow:0 0 0 3px var(--amber);}100%{box-shadow:none;}}
  .pj-step-go:not(:last-child) .pj-step::after{display:block;} @media (max-width:1000px){ .pj-step-go .pj-step::after{display:none !important;} }
  @media (max-width:699px){ .pj-hide-m{display:none;} }
  /* صفحة المشروع: أزرار القسم بجانب عنوانه، وأزرار بوزن واحد (ارتفاع 40 وخط عريض)، وسطور أقرب */
  #app:has(> .pj-top) .btn{font-weight:700 !important;height:40px;}
  #app:has(> .pj-top) .cx-panel-h{flex-wrap:nowrap;align-items:center;}
  #app:has(> .pj-top) .cx-panel-h > h2{flex:0 0 auto;white-space:nowrap;margin:0;}
  #app:has(> .pj-top) .cx-ph-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-inline-start:auto;}
  .pj-rep-l label{display:block;margin:0 0 6px;font-weight:700;}
  .pj-rep-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;} .pj-rep-row > .btn, .pj-rep-row > .file-pick > label.file-btn{width:150px;flex:0 0 150px;}
  .pj-rep-row > .file-pick{display:flex;align-items:center;gap:8px;} .pj-rep-hint:empty{display:none;} .pj-rep-hint{margin-top:6px;}
  @media (max-width:699px){
    #app:has(> .pj-top) .cx-panel-h > h2{font-size:var(--fs-h3,18px);}
    #app:has(> .pj-top) .cx-panel-h .btn{width:105px !important;min-width:0 !important;padding:0 6px !important;flex:0 0 auto;}
    #app:has(> .pj-top) .pj-kv2{padding:5px 0 !important;line-height:1.4;}
    .pj-rep-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));} .pj-rep-row > .btn, .pj-rep-row > .file-pick, .pj-rep-row > .file-pick > label.file-btn{width:100% !important;flex:auto;min-width:0;padding:0 6px !important;}
    .pj-rep-row > .file-pick .file-pick-name{display:none;}
  }
  .pj-row-s{justify-content:space-between !important;} .pj-row-s > .btn{margin-inline-start:auto;} .pj-trail{justify-content:center;}
  .pj-row-n .pj-name{overflow-wrap:anywhere;}

  #app .qyl-sum.qyl-sum-expo{display:flex !important;justify-content:flex-end;border:0 !important;background:none !important;padding:0;}

  /* (1.37.0) رمز العين في رأس كل جدول: إظهار / إخفاء الأعمدة وإعادة ضبطها (بدل ↺) */
  #app th .col-reset{display:none !important;}
  #app th:has(> .col-eye){position:relative;padding-inline-end:40px !important;}
  #app th .col-eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0;
    border:1px solid var(--info-line);border-radius:7px;background:var(--info-bg);color:var(--info);cursor:pointer;z-index:2;}
  #app th .col-eye svg{width:16px;height:16px;}
  #app th .col-eye:hover{background:var(--info);color:#fff;}
  #app table.col-has-hidden th .col-eye{background:var(--info);color:#fff;}
  .col-menu{position:fixed;z-index:1200;width:250px;max-width:calc(100vw - 16px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px;direction:rtl;}
  .col-menu-h{font-weight:800;color:var(--ink);margin:0 0 6px;font-size:var(--fs-label);}
  .col-menu-l{max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
  .col-menu-i{display:flex !important;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-weight:700;color:var(--ink);margin:0 !important;min-height:0 !important;}
  .col-menu-i:hover{background:var(--paper-2);}
  .col-menu-i input{width:18px;height:18px;margin:0;flex:0 0 18px;}
  .col-menu-i span{flex:1;}
  .col-menu-i.fx{color:var(--muted);cursor:default;} .col-menu-i small{color:var(--muted);font-weight:600;}
  .col-menu-r{width:100%;}
  @media print{ #app th .col-eye{display:none !important;} #app th:has(> .col-eye){padding-inline-end:10px !important;} }
  @media (max-width:699px){ #app th .col-eye{display:none !important;} #app th:has(> .col-eye){padding-inline-end:10px !important;} }

  /* (1.37.0) الترتيب بالضغط على عنوان العمود */
  #app th.col-sortable{cursor:pointer;user-select:none;} #app th.col-sortable:hover{color:var(--info);}
  #app th.col-sorted{color:var(--info);} #app th .col-sort{font-size:11px;margin-inline-start:5px;color:var(--info);}

  /* (1.37.2) أدوات المشاريع بعرض البطاقة كاملاً: الفلتران يتمددان، و🔍 والزران بحجمهم */
  @media (min-width:700px){
    #app .pj-tools{max-width:none !important;width:100%;}
    #app .pj-tools select{flex:1 1 0 !important;width:auto !important;min-width:0;max-width:none !important;}
    #app .pj-tools > .btn{flex:0 0 180px !important;width:180px !important;}
  }

  /* (1.37.3) أدوات العملاء والموردين: 🔍 والزر في صف واحد متوازن */
  #app .sup-tools{display:flex;align-items:center;gap:8px;margin:0;}
  #app .sup-tools > .btn{margin:0 !important;width:180px;flex:0 0 180px;}
  #app .sup-cnt{color:var(--muted);font-weight:600;margin-inline-start:4px;}
  @media (max-width:699px){ #app .sup-tools{width:100%;} #app .sup-tools > .btn{flex:1 1 0;width:auto;} }

  /* (1.37.5) تنبيه ملفات البوابة: سطر واحد مضغوط */
  #app .gw-stale{margin:0 0 8px;border:1.5px solid;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;}
  #app .gw-stale.gw-stale-c{padding:4px 6px 4px 12px;min-height:0;}
  #app .gw-stale.gw-stale-c > div{line-height:1.5 !important;}
  #app .gw-stale.gw-stale-c .btn{height:30px !important;min-height:30px !important;width:105px;padding:0 6px;}

  /* (1.37.6) عناوين الحقول في كل النظام: عريضة وبلون داكن واضح، ومسافات أقل؛ ونموذج الطلب بلا فراغ زائد */
  label{color:var(--ink);font-weight:700;margin:8px 0 5px;}
  #app label:not(.chk-card):not(.btn):not(.file-btn):not(.col-menu-i):not(.check-line):not(.pj-inline-chk){color:var(--ink);font-weight:700;}
  #app .nr-form .nr-lblrow .nr-lbl-side, #app .nr-form .nr-lblrow .nr-xls-t{margin:0 0 4px !important;font-size:var(--fs-label);font-weight:700;color:var(--ink);}
  #app .nr-form .nr-lblrow label{margin:0 0 4px !important;}
  #app .nr-form{padding-top:12px;}

  /* (1.37.7) زرّا إضافة مستفيد والاختيار من الموردين/العقود في صف واحد */
  #app .nr-form .nr-addrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  #app .nr-form .nr-addbtn{width:auto;min-width:220px;flex:0 0 auto;height:40px;font-weight:700;color:var(--info);border-color:var(--info-line);}
  @media (max-width:699px){ #app .nr-form .nr-addrow{flex-wrap:nowrap;} #app .nr-form .nr-addbtn{flex:1 1 0;min-width:0;padding:0 4px !important;} }

  /* (1.37.8) بطاقات الأرقام موحّدة (لوحة المتابعة، كشف الحركات الشهري…): مضغوطة، عنوانها أكبر، والمبلغ بجانب العدد؛ صفر = باهت */
  #app .tile-row{display:grid !important;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px !important;align-items:stretch;}
  #app .tile-row:has(> :nth-child(5)){grid-template-columns:repeat(5,minmax(0,1fr));}
  #app .tile-row:has(> :nth-child(3)):not(:has(> :nth-child(4))){grid-template-columns:repeat(3,minmax(0,1fr));}
  #app .card .card.tile{padding:10px 14px !important;margin:0 !important;min-height:0 !important;height:auto !important;flex:none !important;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-top-width:4px;border-radius:8px;box-shadow:none;}
  #app .card .card.tile > .tile-l, #app .card .card.tile > div:first-child{font-size:var(--fs-h3) !important;font-weight:800 !important;color:var(--ink) !important;margin:0 !important;}
  #app .card .card.tile .tile-v{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  #app .card .card.tile .tile-v > b{font-size:var(--fs-h2);font-weight:800;line-height:1.25;}
  #app .card .card.tile .tile-amt{font-size:var(--fs-label);font-weight:700;color:var(--muted);}
  #app .card .card.tile .tile-s, #app .card .card.tile > .sub{font-size:var(--fs-label);color:var(--muted);margin:0 !important;}
  #app .card .card.tile.tile-zero{opacity:.55;}
  @container (max-width:720px){ #app .tile-row{grid-template-columns:repeat(2,minmax(0,1fr)) !important;} #app .tile-row:has(> :nth-child(5)){grid-template-columns:repeat(3,minmax(0,1fr)) !important;} }
  #app .card:has(> .tile-row){container-type:inline-size;}
  @media (max-width:699px){ #app .tile-row{grid-template-columns:repeat(2,minmax(0,1fr)) !important;} }
  /* رأس لوحة المتابعة والأمان: سطر واحد متوازن */
  #app .card.mon-card{padding:10px 16px !important;}
  #app .card.mon-card h3{margin:0 0 6px !important;}
  #app .mon-head{display:flex !important;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  #app .mon-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;} #app .mon-t b{font-size:var(--fs-h3);font-weight:800;color:var(--ink);} #app .mon-t small{color:var(--muted);font-weight:600;}
  #app .mon-tools{display:flex;align-items:center;gap:8px;} #app .mon-tools label{margin:0 !important;white-space:nowrap;}
  #app .mon-tools select{width:150px !important;height:40px;} #app .mon-tools .btn, #app .mon-sec > .btn{width:150px !important;height:40px;flex:0 0 150px !important;}
  #app .mon-sec{display:flex !important;align-items:center;gap:24px !important;flex-wrap:wrap;} #app .mon-sec > .btn{margin-inline-start:auto;}
  #app .mon-ind{font-weight:700;color:var(--ink);}
  @media (max-width:699px){ #app .mon-tools{width:100%;} #app .mon-tools select{flex:1 1 0;width:auto !important;} #app .mon-sec{display:grid !important;grid-template-columns:1fr 1fr;gap:6px 12px !important;} #app .mon-sec > .btn{grid-column:1 / -1;width:100% !important;margin:0;} }
  /* كشف الحركات الشهري: الشهر والتحديث بحجم موحّد */
  #app select.gl-month{width:180px !important;height:40px;} #app .gl-refresh{width:150px;height:40px;}

  /* (1.37.8) توحيد كل بطاقات الأرقام في النظام على شكل واحد: إطار رفيع، شريط لون أعلى، العنوان عريض بحجم العناوين، الرقم أكبر، والارتفاع على قدر المحتوى */
  #app .cx-stat, #app .stat-card{padding:10px 14px !important;border-radius:8px !important;border:1px solid var(--line) !important;border-top:4px solid var(--tile-c, var(--blue)) !important;box-shadow:none !important;min-height:0 !important;height:auto !important;display:flex;flex-direction:column;gap:2px;justify-content:flex-start;background:var(--card);}
  #app .cx-stat-l, #app .stat-card .stat-label{order:-1;font-size:var(--fs-h3) !important;font-weight:800 !important;color:var(--ink) !important;margin:0 !important;}
  #app .cx-stat-v, #app .stat-card .stat-num{font-size:var(--fs-h2) !important;font-weight:800 !important;line-height:1.25;}
  #app .cx-stat-s{font-size:var(--fs-label) !important;margin:0 !important;}
  #app .stat-card .stat-num[style*="--fs-h3"]{font-size:var(--fs-h2) !important;}
  #app .pj-fig > span{font-size:var(--fs-h3) !important;}
  #app .pj-fig > b{font-size:var(--fs-h2) !important;}

  /* (1.38.1) أسهم تمرير الجداول: شريط بطول الجدول (40) قابل للضغط، وسهم كبير ظاهر */
  #app .xs-shade{width:40px !important;pointer-events:auto !important;cursor:pointer;border:0;padding:0;margin:0 !important;z-index:4;display:none;}
  #app .xs.xs-more + .xs-shade-r + .xs-shade-l, #app .xs.xs-start + .xs-shade-r{display:block;}
  #app .xs-shade-l{background:linear-gradient(to right, rgba(27,39,51,.28), rgba(27,39,51,0)) !important;border-radius:8px 0 0 8px;}
  #app .xs-shade-r{background:linear-gradient(to left, rgba(27,39,51,.28), rgba(27,39,51,0)) !important;border-radius:0 8px 8px 0;}
  #app .xs-shade:hover{background-color:rgba(27,39,51,.08);}
  #app .xs-shade::after{content:none !important;display:none !important;}
  #app .xs-shade .xs-arr{position:sticky;top:calc(50vh - 17px);bottom:20px;display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin:0 auto;border-radius:50%;
    background:var(--ink);color:#fff;font-size:24px;font-weight:800;line-height:1;direction:ltr;box-shadow:0 2px 8px rgba(0,0,0,.25);}
  #app .xs.xs-more + .xs-shade-r + .xs-shade-l, #app .xs.xs-start + .xs-shade-r{display:flex !important;align-items:center;justify-content:center;}
  @media print{ #app .xs-shade{display:none !important;} }

  /* (1.38.2) شريط التمرير زر حقيقي بطول الجدول: خلفية وإطار كالأزرار، والسهم داخله (بلا تظليل ولا دائرة) */
  #app .xs-shade-l, #app .xs-shade-r{background:var(--card) !important;border:1px solid var(--line) !important;color:var(--ink);box-shadow:0 0 10px rgba(0,0,0,.10);width:36px !important;}
  #app .xs-shade-l{border-radius:8px 0 0 8px !important;} #app .xs-shade-r{border-radius:0 8px 8px 0 !important;}
  #app .xs-shade:hover{background:var(--ink) !important;color:#fff;border-color:var(--ink) !important;}
  #app .xs-shade .xs-arr{background:none !important;box-shadow:none !important;color:inherit !important;width:24px;height:24px;}
  #app .xs-shade .xs-arr svg{width:22px;height:22px;}
  #app .xs-shade .xs-arr{position:static !important;}

  #app .xs-none{overflow-x:hidden !important;} #app .xs-none > table{min-width:0 !important;width:100% !important;}

  /* (1.38.3) سطر العدد تحت عنوان مخفي يصير عنوان البطاقة */
  #app .file-hint.cnt-title{font-size:var(--fs-h3) !important;font-weight:800 !important;color:var(--ink) !important;margin:0 !important;line-height:1.4;}

  /* (1.38.4) الشجرة: حقل التعديل وزرّا الحفظ والإلغاء ظاهرة دائماً (على الهاتف تحت الحقل)، وملاحظات «يتبع/مسار مخصّص» نقطة ونص بدل الكبسولة */
  #app .inline-edit-wrap{display:inline-flex !important;flex-wrap:wrap;gap:6px !important;align-items:center;max-width:100%;white-space:normal;vertical-align:middle;}
  #app .inline-edit-wrap .btn{width:105px;height:40px;flex:0 0 105px;}
  #app span:has(> .inline-edit-wrap), #app .tree-row:has(.inline-edit-wrap){white-space:normal !important;}
  @media (max-width:699px){
    #app .tree-row:has(.inline-edit-wrap){display:flex;flex-wrap:wrap;align-items:center;}
    #app span:has(> .inline-edit-wrap){display:block;flex:1 1 100%;}
    #app .inline-edit-wrap{display:flex !important;width:100%;}
    #app .inline-edit-wrap > input, #app .inline-edit-wrap > select{flex:1 1 100%;width:100% !important;min-width:0 !important;}
    #app .inline-edit-wrap .btn{flex:1 1 0;width:auto;}
  }
  #app .tree-tag{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:var(--fs-label);margin-inline-start:8px;white-space:normal;}
  #app .tree-tag > i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 8px;}

  /* (1.39.0) ملاحظات نافذة إبطال الطلب المصروف */
  .vp-notes{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:5px;text-align:right;}
  .vp-notes li{line-height:1.6;}
  /* (1.40.1) صلاحيات الصفحات: الحقول تملأ السطر، والشرح بجانب الزر، والنص واضح */
  #app .perm-top{margin-bottom:12px;}
  #app .perm-ex{display:flex;align-items:center;gap:16px;margin:0 0 10px;}
  #app .perm-ex-t{flex:1 1 auto;min-width:0;color:var(--text);font-size:var(--fs-label);line-height:1.7;}
  #app .perm-ex > .btn{flex:0 0 auto;width:220px;}
  #app .perm-note{color:var(--text);font-size:var(--fs-hint);line-height:1.7;margin:0 0 14px;}
  @media (max-width:699px){ #app .perm-ex{flex-wrap:wrap;} #app .perm-ex > .btn{width:100%;} }
  /* (1.41.1) شريط القوائم: حقول أصغر بحجم محتواها، والتاريخ «من – إلى» في صف ثانٍ مرتب؛ «تصدير» بجوار البحث في رأس اللوحة */
  #app .qyl-bar{gap:8px 12px;}
  #app .qyl-bar select.qyl-per{width:110px !important;max-width:110px !important;flex:0 0 110px !important;}
  #app .qyl-bar select.qyl-kind{width:110px !important;max-width:110px !important;flex:0 0 110px !important;}
  #app .qyl-bar select.qyl-size{width:70px !important;max-width:70px !important;flex:0 0 70px !important;}
  #app .qyl-bar input.qyl-date{width:122px !important;max-width:122px !important;flex:0 0 122px !important;padding:0 6px !important;}
  #app .qyl-g,#app .qyl-rng{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}

    #app .qyl-bar input.qyl-date{flex:1 1 0 !important;width:auto !important;max-width:none !important;} }
  /* (1.41.1) مربع التحديد في الجداول: نفس الحجم في الرأس والصفوف */
  #app table th.cx-cb,#app table td.cx-cb{width:40px;min-width:40px;max-width:40px;text-align:center;padding-inline:4px !important;}
  #app table .cx-cb input[type=checkbox]{width:18px !important;height:18px !important;min-width:18px !important;min-height:0 !important;margin:0 !important;vertical-align:middle;}
  /* (1.41.1) زر «فتح الطلب» رمز بحجم زر الحذف */
  #app .btn.btn-ico-view{border:1.5px solid var(--line) !important;color:var(--ink) !important;background:var(--card) !important;}

  #app .qyl-nav .qyl-pg{width:78px !important;min-width:78px;max-width:78px;flex:0 0 78px;height:32px !important;min-height:0 !important;font-size:var(--fs-label) !important;}
  #app .qyl-pager{gap:10px;} #app .qyl-pos{min-width:70px;}
  @media (min-width:700px){
    #app .qyl-nav-bulk{flex-wrap:nowrap;gap:12px;}

    #app .qyl-bulk .btn{height:32px !important;min-height:0 !important;padding:0 14px !important;font-size:var(--fs-label) !important;width:auto !important;}
  }
  /* (1.42.0) التحديد الموحّد في جداول القوائم */
  #app table th.qyl-cb,#app table td.qyl-cb{width:36px !important;min-width:36px;max-width:36px;text-align:center;padding-inline:4px !important;}
  #app table td.qyl-cb{cursor:pointer;}
  #app table .qyl-cb input[type=checkbox]{width:18px !important;height:18px !important;min-width:18px !important;min-height:0 !important;margin:0 !important;vertical-align:middle;cursor:pointer;accent-color:var(--info);}
  #app table .qyl-cb .col-rs{display:none !important;}
  #app table tr.qyl-sel > td{background:var(--info-bg) !important;}
  #app .qyl-bar .qyl-allg{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;}
  #app .qyl-bar .qyl-allg input{width:18px;height:18px;margin:0;cursor:pointer;accent-color:var(--info);}
  #app .qyl-selinfo{font-size:var(--fs-label);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
  #app .qyl-selinfo[hidden]{display:none !important;}
  #app .qyl-selinfo b{color:var(--ink);}
  #app .qyl-selinfo .qyl-selx{all:unset;cursor:pointer;color:var(--info);font-weight:700;margin-inline-start:8px;font-size:var(--fs-label);}
  #app .qyl-selinfo .qyl-selx:hover{text-decoration:underline;}
  #app .qyl-nav-sel:has(> .qyl-selinfo[hidden]:only-child){display:none;}
  .qy-exp-menu .qy-exp-selh{padding:8px 14px 4px;font-size:var(--fs-label);color:var(--muted);border-top:1px solid var(--line);margin-top:4px;}
  @media print{ .qyl-cb{display:none !important;} tr.qyl-sel > td{background:none !important;} }
  /* (1.42.0) صف التنقل والمحدد: صف واحد إن اتسع، وإلا ينزل «المحدد» وأزراره سطراً دون تكسير الكلمات */
  #app .qyl-nav-bulk{flex-wrap:wrap !important;row-gap:8px;}
  #app .qyl-nav .qyl-pager,#app .qyl-nav .qyl-pos,#app .qyl-nav .qyl-bulk,#app .qyl-nav .qyl-bulk .btn{white-space:nowrap;}
  #app .qyl-nav .qyl-bulk{flex-wrap:nowrap !important;}
  @media (min-width:700px){ #app .qyl-bulk select{width:170px !important;max-width:170px;} }
  /* (1.43.0) تأجيل الصرف */

  #app .defer-box.defer-done{border-color:#bbf7d0;border-right-color:#15803d;background:#f0fdf4;}
  #app .defer-box .defer-t{flex:1 1 auto;min-width:0;color:var(--text);font-size:var(--fs-label);line-height:1.7;}

  /* (1.46.0) السحب والإفلات: الحقول التي تقبل الملفات تتلوّن أثناء السحب، و«أفلت الملف هنا» فوق الحقل المستهدف */
  body.qy-dragging .qy-drop{outline:2px dashed #2563eb;outline-offset:2px;border-radius:8px;}
  .qy-drop.drop-over{position:relative;}
  .qy-drop.drop-over::after{content:'أفلت الملف هنا';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(239,246,255,.95);color:#1d4ed8;font-weight:800;font-size:var(--fs-label);border-radius:8px;pointer-events:none;z-index:2;}
  #app .pj-lock{background:#f8fafc;border:1px solid var(--border);border-right:4px solid #64748b;border-radius:8px;padding:10px 12px;color:var(--text);font-size:var(--fs-hint);margin-bottom:10px;}
  #app .pj-creq-h .pj-creq-ed{margin-inline-start:auto;}
  /* (1.48.0) شكل الملفات الموحّد: المرفوع أخضر مع ✓، والناقص متقطع مع رمز رفع (البرتقالي = مطلوب) */
  #app .btn.file-has{border-color:#86efac;background:#f0fdf4;color:#166534;}
  #app .btn.file-has::before{content:'✓';font-weight:800;margin-inline-end:6px;}
  #app .btn.file-has:hover{background:#dcfce7;}
  #app .btn.file-add{border:1.5px dashed #94a3b8;background:transparent;color:var(--text);gap:6px;}
  #app .btn.file-add.file-need{border-color:#f59e0b;background:#fffbeb;color:#b45309;}
  #app .btn.file-add .file-up-i{flex:0 0 auto;}
  /* (1.48.1) أدوات المشاريع بأربعة فلاتر: حسب عرض البطاقة نفسها (لا عرض النافذة) — إن ضاقت عن صف واحد
     صارت الفلاتر الأربعة في صف بعرض متساوٍ، و🔍 والزران في صف تحته */
  #app .card:has(> .pj-tools){container-type:inline-size;container-name:pjtools;}
  @container pjtools (max-width:1100px){
    #app .pj-tools{flex-wrap:wrap !important;}
    #app .pj-tools select{flex:1 1 calc(25% - 6px) !important;width:auto !important;max-width:none !important;min-width:0 !important;}
    #app .pj-tools > .btn{flex:1 1 0 !important;width:auto !important;min-width:0 !important;}

  /* أضيق من 620: كل فلترين في صف */
  @container pjtools (max-width:620px){
    #app .pj-tools select{flex:1 1 calc(50% - 4px) !important;}
  }
  #app .pj-acts-w .btn.file-add, #app .pj-next .btn.file-add{width:auto !important;min-width:150px;white-space:nowrap;}
</style>
