async function saveUserEdit(){
  const u = state.users.find(x=>x.id===state.editingUserId);
  if(!u) return;
  const name = document.getElementById('editUserName').value.trim();
  const phone = document.getElementById('editUserPhone').value.trim();
  const pass = document.getElementById('editUserPass').value.trim();
  const role = document.getElementById('editUserRole').value;
  const centerId = document.getElementById('editUserCenter').value;
  const companyId = document.getElementById('editUserCompany').value;
  const managerSelect = document.getElementById('editUserManager');
  const managerId = managerSelect ? managerSelect.value : '';
  const jobTitleEl = document.getElementById('editUserJobTitle');
  const jobTitle = jobTitleEl ? jobTitleEl.value.trim() : (u.jobTitle||'');
  const levelEl = document.getElementById('editUserLevel');
  const levelId = levelEl ? levelEl.value : (u.levelId||'');
  const reqApEl = document.getElementById('editUserRequestApprover');
  const reqVal = reqApEl ? reqApEl.value : (u.noRequestApprover ? 'none' : (u.requestApproverId||''));
  const noRequestApprover = reqVal==='none';
  const requestApproverId = noRequestApprover ? '' : reqVal;
  const nextApEl = document.getElementById('editUserNextApprover');
  const nextVal = nextApEl ? nextApEl.value : (u.noNextApprover ? 'none' : (u.nextApproverId||''));
  const noNextApprover = nextVal==='none';
  const nextApproverId = noNextApprover ? '' : nextVal;
  const generalEl = document.getElementById('editUserGeneral');
  const isGeneral = generalEl ? generalEl.checked : !!u.isGeneral;
  const dlEl = document.getElementById('editUserDeadline');
  const approvalDeadlineDays = dlEl ? (dlEl.value==='' ? null : Number(dlEl.value)) : u.approvalDeadlineDays;
  const escModeEl = document.getElementById('editUserEscMode');
  const escalateMode = escModeEl ? escModeEl.value : (u.escalateMode||'');
  const escUserEl = document.getElementById('editUserEscUser');
  const escalateUserId = escalateMode==='user' ? (escUserEl ? escUserEl.value : (u.escalateUserId||'')) : '';
  if(escalateMode==='user' && !escalateUserId){ showToast('اختر الشخص الذي تُحال إليه الخطوة عند انتهاء المهلة','error'); return; }
  const coChecks = [...document.querySelectorAll('[data-access-company]')];
  const linkedIds = coChecks.filter(c=>c.checked).map(c=>c.getAttribute('data-access-company'));
  if(!name || !phone || !pass){ showToast('الرجاء تعبئة جميع الحقول','error'); return; }
  if(state.users.some(x=>x.phone===phone && x.id!==u.id)){ showToast('رقم الهاتف مستخدم من قبل','error'); return; }
  const result = await db.from('users').update({
    name, phone, password:pass, role, center_id: centerId||null, manager_id: managerId||null, company_id: companyId||null,
    job_title: jobTitle||null, level_id: levelId||null, request_approver_id: requestApproverId||null, next_approver_id: nextApproverId||null,
    is_general: isGeneral, no_request_approver: noRequestApprover, no_next_approver: noNextApprover,
    approval_deadline_days: approvalDeadlineDays, escalate_mode: escalateMode||null, escalate_user_id: escalateUserId||null
  }).eq('id', u.id);
  if(!(await dbCheck(result, 'تعديل المستخدم'))) return;
  u.name = name; u.phone = phone; u.password = pass; u.role = role; u.centerId = centerId || null; u.managerId = managerId || null; u.companyId = companyId || null;
  u.jobTitle = jobTitle || ''; u.levelId = levelId || null; u.requestApproverId = requestApproverId || null; u.nextApproverId = nextApproverId || null;
  u.isGeneral = isGeneral; u.noRequestApprover = noRequestApprover; u.noNextApprover = noNextApprover;
  u.approvalDeadlineDays = approvalDeadlineDays; u.escalateMode = escalateMode; u.escalateUserId = escalateUserId||null;
  // ربط المستخدم بشركات إضافية (المستخدم العام لا يحتاج روابط: الخانة تشمل الشركات الحالية والمستقبلية)
  if(coChecks.length || generalEl){
    const wanted = isGeneral ? [] : linkedIds.filter(id=>id!==u.companyId);
    const had = (state.userCompanyLinks||[]).filter(l=>l.userId===u.id).map(l=>l.companyId);
    const toAdd = wanted.filter(id=>!had.includes(id)), toRemove = had.filter(id=>!wanted.includes(id));
    for(const cid of toRemove){
      const rr = await db.from('user_companies').delete().eq('user_id', u.id).eq('company_id', cid);
      if(await dbCheck(rr, 'إزالة ربط الشركة')) state.userCompanyLinks = state.userCompanyLinks.filter(l=>!(l.userId===u.id && l.companyId===cid));
    }
    for(const cid of toAdd){
      const rr = await db.from('user_companies').insert({user_id:u.id, company_id:cid});
      if(await dbCheck(rr, 'ربط المستخدم بشركة')) state.userCompanyLinks.push({userId:u.id, companyId:cid});
    }
  }
  // المدير المباشر بالشركات الأخرى (للموظف المرتبط بأكثر من شركة)
  const ucmSelects = document.querySelectorAll('[data-ucm-company]');
  for(const sel of ucmSelects){
    const companyId2 = sel.getAttribute('data-ucm-company');
    const mgrVal = sel.value || null;
    const existing = (state.userCompanyManagers||[]).find(x=>x.userId===u.id && x.companyId===companyId2);
    if(existing && existing.managerId===mgrVal) continue;
    if(!existing && !mgrVal) continue;
    const r2 = await db.from('user_company_managers').upsert({user_id:u.id, company_id:companyId2, manager_id:mgrVal});
    if(!(await dbCheck(r2, 'تعديل المدير بشركة أخرى'))) continue;
    if(existing) existing.managerId = mgrVal;
    else state.userCompanyManagers.push({userId:u.id, companyId:companyId2, managerId:mgrVal});
  }
  state.editingUserId = null;
  showToast('تم حفظ تعديلات المستخدم', 'success');
  render();
}

function deleteUser(id){
  const u = state.users.find(x=>x.id===id);
  requestDeleteConfirm(`حذف المستخدم "${u?u.name:''}" نهائياً؟`, 'user', id);

async function executeDeleteUser(id){
  const delResult = await db.from('users').delete().eq('id', id);
  if(!(await dbCheck(delResult, 'حذف المستخدم'))) return;
  state.users = state.users.filter(u=>u.id!==id);
  showToast('تم حذف المستخدم', 'success');
  render();
}

function renderDashboard(app){
  const role = state.user.role;
  const myId = state.user.id;
  let listHtml = '';
  let visibleRequests = [];

  if(role==='admin'){
    visibleRequests = state.requests.slice();
  } else if(role==='accountant'){
    visibleRequests = state.requests.filter(r=>
      r.createdById===myId || (r.approvalSteps||[]).some(s=>s.approverId===myId) ||
      ['pending_transfer_request','pending_transfer_approval','pending_disbursement','pending_accountant','pending_cfo','completed'].includes(r.status) ||
      r.history.some(h=>['pending_transfer_request','pending_disbursement','pending_accountant'].includes(h.step))
    );
  } else if(role==='cfo'){
    visibleRequests = state.requests.filter(r=>
      r.createdById===myId || (r.approvalSteps||[]).some(s=>s.approverId===myId) ||
      ['pending_transfer_approval','pending_disbursement','pending_cfo','completed'].includes(r.status) ||
      r.history.some(h=>['pending_transfer_approval','pending_cfo'].includes(h.step))
    );
  } else {
    // موظف، أو أي دور آخر (مدير إدارة/أعلى/تنفيذي أو أي دور مخصص): يرى طلباته هو، وأي طلب هو معتمِد قرار فيه (حالياً أو سابقاً) بغض النظر عن دوره
    visibleRequests = state.requests.filter(r=>
      r.createdById===myId || (r.approvalSteps||[]).some(s=>s.approverId===myId) || r.status===role || r.history.some(h=>h.step===role)
    );
  }

  visibleRequests = visibleRequests.filter(r=>r.companyId===state.currentCompanyId);

  const myPendingCount = getMyPendingRequests().length;
  const pendingBadge = myPendingCount>0
    ? `<div class="pending-badge" style="cursor:pointer;" onclick="state.dashStatusFilter='mypending'; render();">لديك <b>${myPendingCount}</b> ${myPendingCount===1?'طلب':'طلبات'} بانتظار اعتمادك</div>`
    : '';

  if(visibleRequests.length===0){
    listHtml = `<div class="empty">لا توجد طلبات لعرضها حالياً</div>`;
  }

  const newBtn = `<button class="btn btn-primary btn-lg" onclick="openNewRequestChoice()">+ طلب صرف جديد</button>`;
  const listTitle = (role==='employee' || isCustomRole(role)) ? 'طلباتي' : 'الطلبات';

  const periodMode = state.dashPeriodMode || 'all';
  const now = new Date();
  const periodYear = state.dashPeriodYear || now.getFullYear();
  const periodMonth = state.dashPeriodMonth || (now.getMonth()+1);
  const years = new Set([now.getFullYear()]);
  visibleRequests.forEach(r=>{ if(r.createdAtRaw) years.add(new Date(r.createdAtRaw).getFullYear()); });
  const yearsList = Array.from(years).sort((a,b)=>b-a);
  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  let periodFiltered = visibleRequests;
  if(periodMode==='year'){
    periodFiltered = visibleRequests.filter(r=>r.createdAtRaw && new Date(r.createdAtRaw).getFullYear()===Number(periodYear));
  } else if(periodMode==='month'){
    periodFiltered = visibleRequests.filter(r=>{
      if(!r.createdAtRaw) return false;
      const d = new Date(r.createdAtRaw);
      return d.getFullYear()===Number(periodYear) && (d.getMonth()+1)===Number(periodMonth);
    });
  } else if(periodMode==='week'){
    const dayOfWeek = now.getDay(); // 0=Sunday
    const weekStart = new Date(now); weekStart.setHours(0,0,0,0); weekStart.setDate(now.getDate()-dayOfWeek);
    periodFiltered = visibleRequests.filter(r=>r.createdAtRaw && new Date(r.createdAtRaw) >= weekStart);
  } else if(periodMode==='last15'){
    const cutoff = new Date(now); cutoff.setHours(0,0,0,0); cutoff.setDate(now.getDate()-15);
    periodFiltered = visibleRequests.filter(r=>r.createdAtRaw && new Date(r.createdAtRaw) >= cutoff);
  }

  const statusFilter = state.dashStatusFilter || 'all';
  let displayList = periodFiltered;

  else if(statusFilter==='pending') displayList = periodFiltered.filter(r=>!['completed','rejected'].includes(r.status));
  else if(statusFilter==='mypending'){
    const myPendingIds = new Set(getMyPendingRequests().map(r=>r.id));

  else if(STATUS_ORDER[statusFilter]) displayList = periodFiltered.filter(r=>r.status===statusFilter);

  const sortCol = state.myReqSortCol || 'number';

    if(col==='number') return parseInt((r.number||'').match(/-(\d+)\/\d+$/)?.[1] || (r.number||'').match(/(\d+)$/)?.[1] || 0);

    if(col==='amount') return Number(r.totalAmount||0);
    if(col==='status') return STATUS_ORDER[r.status] ?? 99;
    return '';
  };
  const sortedDisplayList = displayList.slice().sort((a,b)=>{
    const va = getSortVal(a, sortCol), vb = getSortVal(b, sortCol);
    let cmp;
    if(typeof va==='number') cmp = va-vb; else cmp = String(va).localeCompare(String(vb),'ar');
    return sortDir==='asc' ? cmp : -cmp;

            <span onclick="toggleReqSort('status')">الحالة${sortArrow('status')}</span>
          </div>
          ${sortedDisplayList.map(r=>{
            const paidEntry = r.history.find(h=>h.action==='تم الصرف');
            const paidTimeRaw = paidEntry ? toWesternDigits(paidEntry.time) : '';
            const paidParts = paidTimeRaw ? paidTimeRaw.split(' ') : [];
            const paidDatePart = paidParts[0] || '';
            const paidTimePart = paidParts.slice(1).join(' ') || '';
            let createdTimePart = '';
            if(r.createdAtRaw){
              const cd = new Date(r.createdAtRaw);
              let ch = cd.getHours(); const cmin = String(cd.getMinutes()).padStart(2,'0');
              const campm = ch>=12 ? 'م' : 'ص'; ch = ch%12; if(ch===0) ch=12;
              createdTimePart = `${ch}:${cmin} ${campm}`;
            }
            const myTurn = canActOn(r);
            const isBigBoxOnly = myTurn || r.status==='completed' || r.isCancelled || r.status==='rejected';
            const iAlreadyApproved = !isBigBoxOnly && (r.approvalSteps||[]).some(s=>s.approverId===state.user.id && s.status==='approved');
            const isFutureContext = !isBigBoxOnly && !iAlreadyApproved
              && ['dept_manager','senior_manager','executive_manager'].includes(state.user.role)
              && r.createdById!==state.user.id
              && (r.approvalSteps||[]).some(s=>s.approverId===state.user.id);

            const subNoteClass = iAlreadyApproved ? 'note-approved' : 'note-waiting';

  const totalCount = periodFiltered.length;
  const paidCount = periodFiltered.filter(r=>r.status==='completed').length;
  const pendingCount = periodFiltered.filter(r=>!['completed','rejected'].includes(r.status)).length;

    ['all','كل الحالات'],

    ['pending_transfer_approval','بانتظار اعتماد التحويل (المدير المالي)'],['pending_disbursement','بانتظار إتمام الصرف (المحاسب)'],

    <div class="row" style="align-items:flex-end;justify-content:space-between;flex-wrap:wrap;">
      <div class="row" style="align-items:flex-end;flex:1;min-width:0;">

            <option value="last15" ${periodMode==='last15'?'selected':''}>آخر 15 يوم</option>
            <option value="year" ${periodMode==='year'?'selected':''}>سنة محددة</option>
            <option value="month" ${periodMode==='month'?'selected':''}>شهر محدد</option>
          </select>
        </div>
        ${periodMode!=='all' && periodMode!=='week' && periodMode!=='last15' ? `
        <div style="flex:0 0 auto;"><label>السنة</label>
          <select onchange="state.dashPeriodYear=this.value; render();">
            ${yearsList.map(y=>`<option value="${y}" ${y==periodYear?'selected':''}>${y}</option>`).join('')}
          </select>
        </div>` : ''}
        ${periodMode==='month' ? `
        <div style="flex:0 0 auto;"><label>الشهر</label>
          <select onchange="state.dashPeriodMonth=this.value; render();">
            ${monthNames.map((m,i)=>`<option value="${i+1}" ${(i+1)==periodMonth?'selected':''}>${m}</option>`).join('')}

      <div style="flex:0 0 auto;">
        <label>حالة الطلب</label>
        <select onchange="state.dashStatusFilter=this.value; render();">
          ${statusOptions.map(([v,l])=>`<option value="${v}" ${statusFilter===v?'selected':''}>${l}</option>`).join('')}

      </div>

  const statCards = `
    <div class="stat-cards">
      <div class="stat-card" style="cursor:pointer;${statusFilter==='all'?'border-color:var(--ink);':''}" onclick="state.dashStatusFilter='all'; render();"><span class="stat-num">${totalCount}</span><span class="stat-label">إجمالي الطلبات</span></div>
      <div class="stat-card" style="cursor:pointer;${statusFilter==='completed'?'border-color:var(--green);':''}" onclick="state.dashStatusFilter='completed'; render();"><span class="stat-num" style="color:var(--green);">${paidCount}</span><span class="stat-label">معتمدة ومصروفة</span></div>
      <div class="stat-card" style="cursor:pointer;${statusFilter==='pending'?'border-color:var(--amber);':''}" onclick="state.dashStatusFilter='pending'; render();"><span class="stat-num" style="color:var(--amber);">${pendingCount}</span><span class="stat-label">قيد الانتظار</span></div>

    </div>
  `;

  app.innerHTML = `
    <h1 style="margin:0;">طلبات الصرف</h1>
    <div class="title-with-badge">
      <p class="sub" style="margin:0;">${findRole(role).name} — ${findRole(role).desc}</p>

      ${statusFilter!=='all' ? `<button class="btn btn-ghost btn-sm" onclick="state.dashStatusFilter='all'; render();">إظهار الكل</button>` : ''}
    </h2>
    ${listHtml}
  `;
}

function renderAppRequestView(req){
  const rows = req.beneficiaries.map((b,i)=>{
    const net = b.amount - (b.deduction||0) + (b.extra||0);
    const ibanClean = (b.iban||'').replace(/\s+/g,'');
    const rowCount = 1 + (b.deduction>0?1:0) + (b.extra>0?1:0);
    const altClass = (i%2===1) ? ' row-alt' : '';
    const extraRows = [];
    if(b.deduction>0){
      const isLast = !(b.extra>0);
      extraRows.push(`
    <tr class="sub-row${isLast?' sub-row-last':''}${altClass}">
      <td style="color:var(--red);"><div class="amt-signed"><span class="amt-number" dir="ltr">-${fmtKWDHtml(b.deduction)}</span></div></td>
      <td class="cell-right" style="color:var(--red);">خصم${b.deductionNote ? ' ' + b.deductionNote : ''}</td>
    </tr>`);
    }
    if(b.extra>0){
      extraRows.push(`
    <tr class="sub-row sub-row-last${altClass}">
      <td style="color:var(--green);"><div class="amt-signed"><span class="amt-number" dir="ltr">+${fmtKWDHtml(b.extra)}</span></div></td>
      <td class="cell-right" style="color:var(--green);">إضافي${b.extraNote ? ' ' + b.extraNote : ''}</td>
    </tr>`);
    }
    const mainBorder = rowCount>1 ? 'border-bottom:none;padding-bottom:0;' : '';
    return `
    <tr class="${altClass.trim()}">
      <td class="num" rowspan="${rowCount}">${i+1}</td>
      <td rowspan="${rowCount}">
        <div class="cell-right">${b.name}</div>
        ${b.nameEn ? `<div class="cell-left">${b.nameEn}</div>` : ''}
      </td>
      <td rowspan="${rowCount}">
        <div class="cell-right">${b.statement || '—'}</div>
        <div class="cell-left" style="font-size:11px;">${b.civilId || '—'}</div>
        <div class="cell-left" style="font-size:10.5px;word-break:break-all;">${ibanClean || '—'}</div>
      </td>
      <td style="${mainBorder}"><div class="amt-signed"><span class="amt-number" dir="ltr">${fmtKWDHtml(b.amount)}</span></div></td>
      <td class="cell-right" style="${mainBorder}">${b.notes || ''}</td>
      <td rowspan="${rowCount}" style="font-weight:700;color:var(--ink);"><div class="amt-signed"><span class="amt-number" dir="ltr" style="width:70px;">${fmtKWDHtml(net)}</span></div></td>
    </tr>${extraRows.join('')}`;
  }).join('');

  return `
    <div class="app-req-header">
      <div>
        <h1 style="margin:0;color:var(--blue);">${req.reason}</h1>
      </div>
      <div class="app-req-meta">
        <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;color:var(--red);">
          <span>رقم الطلب:</span>
          <span dir="ltr" style="unicode-bidi:isolate;">${req.number}</span>
        </div>
        <span style="font-size:15px;font-weight:600;color:var(--text);text-decoration:underline;line-height:1.15;">${req.dateHijri||'—'}</span>
        <span style="font-size:15px;font-weight:600;color:var(--text);text-decoration:underline;line-height:1.15;">${req.dateGreg||'—'}</span>
      </div>
    </div>

    <div class="table-scroll-wrap">
      <table class="app-table">
        <colgroup>
          <col style="width:4%;"><col style="width:27%;"><col style="width:29%;">
          <col style="width:12%;"><col style="width:16%;"><col style="width:12%;">
        </colgroup>
        <thead><tr>
          <th style="text-align:center;">#</th><th>المستفيد</th><th>البيان / رقم الهوية / الآيبان</th><th>المبلغ</th><th>ملاحظات</th><th>الإجمالي</th>

        <tbody>${rows}</tbody>
      </table>
      <div class="scroll-hint no-print">← مرر لعرض كل الأعمدة →</div>
    </div>

    <div class="app-total-box">
      <span style="font-size:13px;font-weight:600;">${amountToArabicWords(req.totalAmount)}</span>
      <span>الإجمالي: ${fmtKWDHtml(req.totalAmount)} د.ك</span>
    </div>
  `;
}

function canSeeBudget(){
  return ['dept_manager','senior_manager','executive_manager','accountant','cfo','admin'].includes(state.user.role);
}
// المصروف الفعلي للوحدة شاملاً وحداتها التابعة (ownOnly=true للوحدة وحدها)
function centerConsumed(centerId, year, month, ownOnly){
  let total = 0;
  const ids = new Set(ownOnly ? [centerId] : [centerId, ...unitDescendantIds(centerId)]);
  state.requests.forEach(r=>{
    if(!ids.has(r.centerId) || r.status!=='completed' || r.isCancelled || !r.createdAtRaw) return;
    const d = new Date(r.createdAtRaw);
    if(d.getFullYear()!==year) return;
    if(month!=null && d.getMonth()!==month) return;
    total += Number(r.totalAmount||0);
  });
  return total;
}
function budgetPct(budget, consumed){
  if(budget==null) return null;
  return budget>0 ? (consumed/budget)*100 : (consumed>0 ? 100 : 0);
}
function budgetLevel(pct){ return pct>=100 ? 'red' : (pct>=80 ? 'amber' : 'ok'); }
function budgetBarHtml(label, budget, consumed){
  if(budget==null) return '';
  const remaining = budget - consumed;
  const pct = budgetPct(budget, consumed);
  const level = budgetLevel(pct);
  const color = level==='red' ? 'var(--red)' : (level==='amber' ? 'var(--amber)' : 'var(--blue)');
  const over = remaining < 0;
  return `
    <div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;gap:8px;">
        <span><b>${label}</b> — المستهلك: ${fmtKWD(consumed)} د.ك من ${fmtKWD(budget)} د.ك (${Math.round(pct)}%)</span>
        <span style="color:${over?'var(--red)':'var(--muted)'};font-weight:600;white-space:nowrap;">${over?'تجاوز بمقدار '+fmtKWD(Math.abs(remaining)):'المتبقي: '+fmtKWD(remaining)} د.ك</span>
      </div>
      <div style="background:var(--line);border-radius:6px;height:8px;overflow:hidden;">
        <div style="width:${Math.min(100,pct)}%;height:100%;background:${color};"></div>
      </div>
    </div>`;
}
function renderBudgetFloat(req){
  if(!canSeeBudget() || !req.centerId) return '';
  const center = state.centers.find(c=>c.id===req.centerId);
  if(!center) return '';
  // الوحدة نفسها ثم كل وحدة أم لها ميزانية (تشمل مصروف تابعيها)
  const budgeted = [center, ...unitAncestorIds(center.id).map(id=>state.centers.find(c=>c.id===id)).filter(Boolean)].filter(u=>u.monthlyBudget!=null || u.annualBudget!=null);
  if(!budgeted.length) return '';
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const monthLabel = now.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const pcts = [];
  const monthlyHtml = budgeted.map(u=>{
    const hasKids = unitChildren(u.id).length>0, sfx = hasKids ? ' — شاملة التابعين' : '', who = u.id===center.id ? '' : ' «'+u.name+'»';
    const mC = centerConsumed(u.id, year, month), aC = centerConsumed(u.id, year, null);
    [budgetPct(u.monthlyBudget, mC), budgetPct(u.annualBudget, aC)].forEach(x=>{ if(x!=null) pcts.push(x); });
    return budgetBarHtml('الميزانية الشهرية'+who+' ('+monthLabel+')'+sfx, u.monthlyBudget, mC) + budgetBarHtml('الميزانية السنوية'+who+' ('+year+')'+sfx, u.annualBudget, aC)
      + (hasKids && (u.monthlyBudget!=null||u.annualBudget!=null) ? `<div class="sub" style="font-size:11.5px;margin:-4px 0 8px;">منها الوحدة وحدها: شهرياً ${fmtKWD(centerConsumed(u.id, year, month, true))} د.ك · سنوياً ${fmtKWD(centerConsumed(u.id, year, null, true))} د.ك</div>` : '');
  }).join('');
  const annualHtml = '';
  const worst = Math.max(...pcts);
  const level = budgetLevel(worst);
  return `
    <div class="budget-fab no-print">
      <div class="budget-panel" id="budgetPanel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <b style="font-size:14px;">ميزانية مركز "${center.name}"</b>
          <span style="cursor:pointer;color:var(--muted);font-size:16px;padding:0 4px;" onclick="document.getElementById('budgetPanel').classList.remove('open')">✕</span>
        </div>
        ${monthlyHtml}
        ${annualHtml}
      </div>
      <button class="budget-fab-btn lv-${level}" onclick="document.getElementById('budgetPanel').classList.toggle('open')">
        ${level==='red' ? '⛔' : (level==='amber' ? '⚠️' : '💰')} الميزانية · ${Math.round(worst)}%
      </button>
    </div>`;
}
function renderDetail(app){
  const req = state.requests.find(r=>r.id===state.activeReqId);

  // خطوات القرار: عدد متغيّر، كل خطوة باسم المعتمِد الفعلي ودوره (لا اسم دور ثابت)
  const orderList = [...new Set((req.approvalSteps||[]).map(x=>x.sequenceOrder))].sort((x,y)=>x-y);
  const userLabel = u => u ? (u.name + (findRole(u.role) ? ' — '+findRole(u.role).name : '')) : 'معتمِد غير معروف';
  const decisionSteps = orderList.map((ord,i)=>{
    const rows = (req.approvalSteps||[]).filter(x=>x.sequenceOrder===ord);
    const primary = rows.find(x=>x.kind!=='escalation') || rows[0];
    const escRows = rows.filter(x=>x.kind==='escalation');
    const pu = state.users.find(x=>x.id===primary.approverId);
    let label = userLabel(pu);
    if(escRows.length) label += ' · أو المحال إليه: ' + escRows.map(r=>(state.users.find(x=>x.id===r.approverId)||{}).name||'').join('، ');
    let info = null;
    const okRow = rows.find(x=>x.status==='approved'), noRow = rows.find(x=>x.status==='rejected');
    if(okRow){
      const au = state.users.find(x=>x.id===okRow.approverId);
      const h = req.history.find(h=>h.action==='اعتماد' && h.userId===okRow.approverId);
      info = {name: (au?au.name:'') + (okRow.kind==='escalation' ? ' (محال إليه)' : ''), time: h?h.time:''};
    } else if(noRow){
      const h = req.history.find(h=>h.action==='رفض الطلب' && h.userId===noRow.approverId);
      info = {name:'✕ مرفوض', time: h?h.note:'', rejected:true};
    }
    return {key:'decision_'+i, label, info, order:ord};
  });
  // ذيل تنفيذي ثابت لكل الطلبات
  const tailKeys = ['pending_transfer_request','pending_transfer_approval','pending_disbursement','completed'];
  const tailSteps = tailKeys.map(key=>{
    if(key==='completed') return {key, label:STEP_LABELS.completed, info:null};
    const rejected = req.history.find(h=>h.step===key && h.action==='رفض الطلب');
    const approved = req.history.find(h=>h.step===key && (h.action==='اعتماد' || h.action==='تم الصرف'));
    let info = null;
    if(rejected) info = {name:'✕ مرفوض', time: rejected.note, rejected:true};
    else if(approved) info = {name: approved.actor, time: approved.time};
    const delegated = key==='pending_transfer_approval' && approved && approved.note==='بالتفويض عن المدير المالي';
    return {key, label: delegated ? STEP_LABELS[key]+' — بالتفويض' : STEP_LABELS[key], info};
  });
  const displaySteps = [...decisionSteps, ...tailSteps];

  let idx;
  if(req.status==='rejected') idx = -1;
  else if(req.status==='completed') idx = displaySteps.length;
  else if(req.status==='pending_decision'){
    const cur = currentDecisionStep(req);
    idx = cur ? decisionSteps.findIndex(d=>d.order===cur.sequenceOrder) : Math.max(0, decisionSteps.length-1);
  } else {
    const ti = tailKeys.indexOf(req.status);
    idx = decisionSteps.length + (ti>=0 ? ti : 0);
  }

  // المنشئ — يظهر دائماً قبل سلسلة الاعتماد بدون رقم
  const creatorUser = state.users.find(u=>u.id===req.createdById);
  const creatorName = req.createdBy || (creatorUser && creatorUser.name) || '';
  const creatorTime = (req.history&&req.history[0]&&req.history[0].time) || '';
  const creatorStepHtml = `<div class="step done" style="min-width:80px;">
    <div class="dot" style="background:var(--primary,#1a56db);font-size:9px;width:26px;height:26px;line-height:26px;">✎</div>
    <p style="font-size:10px;color:var(--muted,#888);">منشئ الطلب</p>
    <span class="step-approver">${escH(creatorName)}</span>
    <span class="step-approve-time">${escH(creatorTime)}</span>
  </div>`;

  const stepperHtml = creatorStepHtml + displaySteps.map((d,i)=>{
    let cls='step';
    if(req.status==='rejected'){
      cls += (i < req.history.filter(h=>h.action==='اعتماد').length) ? ' done' : '';
    } else if(i < idx){
      cls += ' done';
    } else if(i===idx){
      cls += ' current';
    }
    const info = d.info;
    return `<div class="${cls}"><div class="dot">${i+1}</div><p>${escH(d.label)}</p>${info ? `<span class="step-approver" style="${info.rejected?'color:var(--red);':''}">${escH(info.name)}</span><span class="step-approve-time">${escH(info.time)}</span>` : ''}</div>`;
  }).join('');

  const canAct = canActOn(req);
  const lastRejection = req.history.slice().reverse().find(h=>h.action==='رفض الطلب');

  let actionsHtml = '';
  if(req.status==='rejected' && req.createdById===state.user.id){
    actionsHtml = `
      <div class="note-box no-print"><b>سبب الرفض:</b> ${lastRejection ? lastRejection.note : ''}</div>
      <div class="actions-row no-print" data-bar-actions><button class="btn btn-primary btn-lg" onclick="resubmitFix()">تعديل وإعادة الإرسال</button></div>`;
  } else if(canAct && req.status==='pending_transfer_request'){
    actionsHtml = `
      <div class="actions-row no-print" data-bar-actions>
        <button class="btn btn-approve btn-lg" onclick="approveFix()">تسجيل التحويل والمتابعة</button>
        <button class="btn btn-reject btn-lg" onclick="openRejectModal('${req.id}')">رفض لأسباب محاسبية</button>
      </div>`;
  } else if(canAct && req.status==='pending_disbursement'){
    actionsHtml = `
      <div class="actions-row no-print" data-bar-actions>
        <button class="btn btn-approve btn-lg" onclick="markDisbursedFix()">تأكيد إتمام الصرف</button>
        <button class="btn btn-reject btn-md" onclick="openRejectModal('${req.id}')">رفض لأسباب محاسبية</button>
      </div>`;
  } else if(canAct){
    const escT = manualEscalationTarget(req);
    actionsHtml = `
      <div class="actions-row no-print" data-bar-actions>
        <button class="btn btn-approve btn-md" onclick="approveFix()">اعتماد</button>
        ${escT ? `<button class="btn btn-ghost btn-md2" onclick="approveEscalateFix('${escT.id}')" title="تعتمد أنت ثم يُضاف ${escH(escT.name)} كخطوة اعتماد تالية لهذا الطلب"><span class="bl1">اعتماد وإحالة</span><span class="bl2">إلى ${escH(escT.name)}</span></button>` : ''}
        <button class="btn btn-reject btn-md" onclick="openRejectModal('${req.id}')">رفض</button>
      </div>`;
  }

  // هل الطلب وصل للذيل التنفيذي أو اعتمده أحد؟
  const isInTail = TAIL_FLOW.includes(req.status) && req.status !== 'completed';
  const hasAnyApproval = (req.approvalSteps||[]).some(s=>s.actedAt || s.status==='approved');
  const canRebuildPath = state.user.role==='admin' && (req.status==='pending_decision' || OLD_DECISION_STATUSES.includes(req.status)) && !req.isCancelled && !isInTail && !hasAnyApproval;
  const canRebuildAndReset = state.user.role==='admin' && !req.isCancelled && req.status!=='completed' && (isInTail || hasAnyApproval);
  if(canRebuildPath){
    actionsHtml += `
      <div class="actions-row no-print" style="margin-top:8px;" data-bar-actions data-bar-key="rebuild_path">
        <button class="btn btn-ghost btn-md2" onclick="rebuildRequestPathFix()"><span class="bl1">إعادة بناء المسار</span><span class="bl2">حسب المدير الحالي</span></button>
      </div>`;
  }
  if(canRebuildAndReset){
    actionsHtml += `
      <div class="actions-row no-print" style="margin-top:8px;" data-bar-actions data-bar-key="rebuild_reset">
        <button class="btn btn-warning btn-md2" onclick="rebuildResetFix()" title="يُعيد بناء المسار ويُلغي الاعتمادات السابقة ويُرسل إشعاراً للمعتمدين"><span class="bl1">⟳ إعادة المسار والاعتماد</span><span class="bl2">${isInTail ? 'الطلب وصل للتنفيذ — إعادة للاعتماد' : 'هناك اعتماد سابق — إعادة للاعتماد'}</span></button>
      </div>`;
  }

  let debugPanelHtml = '';
  if(state.user.role==='admin'){
    const creator = state.users.find(u=>u.id===req.createdById);
    const freshBuild = creator ? buildDecisionChain(creator) : {steps:[], error:null};
    const freshChain = freshBuild.steps;
    const stepsRows = (req.approvalSteps||[]).map(s=>{
      const u = state.users.find(x=>x.id===s.approverId);
      return `<tr><td>${s.sequenceOrder}</td><td>${u ? u.name+' — '+findRole(u.role).name : s.approverId}</td><td>${s.status}</td></tr>`;
    }).join('') || '<tr><td colspan="3">لا يوجد أي صف بمسار الاعتماد لهذا الطلب (ذهب مباشرة للذيل التنفيذي)</td></tr>';
    const freshRows = freshChain.map((s,i)=>{
      const u = state.users.find(x=>x.id===s.approverId);
      return `<tr><td>${i+1}</td><td>${u ? u.name+' — '+findRole(u.role).name : s.approverId}</td></tr>`;
    }).join('') || (freshBuild.error ? `<tr><td colspan="2">⛔ ${escH(freshBuild.error)}</td></tr>` : '<tr><td colspan="2">لا يوجد مسار محسوب من "من يعتمد طلبه" الحالي — يذهب مباشرة للذيل التنفيذي</td></tr>');
    debugPanelHtml = `
      <div class="note-box no-print" style="font-size:12px;">
        <b>لوحة تشخيص (أدمن فقط)</b><br>
        حالة الطلب الحالية: <b>${req.status}</b> — منشئ الطلب: ${req.createdBy} (${req.createdById})<br><br>
        <b>المسار المخزّن فعلياً بقاعدة البيانات (request_approval_steps):</b>
        <table style="width:100%;font-size:11px;border-collapse:collapse;margin-top:4px;">
          <tr style="font-weight:700;"><td>role_label</td><td>المعتمد</td><td>status</td></tr>
          ${stepsRows}
        </table>
        <br><b>المسار المحسوب الآن لو أعدنا البناء (buildApprovalChain حسب manager_id الحالي):</b>
        <table style="width:100%;font-size:11px;border-collapse:collapse;margin-top:4px;">
          <tr style="font-weight:700;"><td>role_label</td><td>المعتمد</td></tr>
          ${freshRows}
        </table>
      </div>`;
  }

  const isDocView = true;

  app.innerHTML = `
    <span class="back-link no-print" onclick="state.view='dashboard'; render();">→ رجوع للقائمة</span>
    ${req.isCancelled ? `
      <div class="note-box no-print" style="background:#F3F2ED;border-color:#B8B4A8;">
        <b>هذا الطلب ملغى</b> — تم إبطاله ${req.cancelledAt ? 'بتاريخ ' + new Date(req.cancelledAt).toLocaleDateString('en-GB') : ''}.
        ${state.user.role==='admin' ? `<button class="btn btn-approve btn-sm2" style="margin-right:10px;" onclick="restoreRequest('${req.id}')"><span class="bl1">استرجاع</span><span class="bl2">الطلب</span></button>` : ''}
      </div>` : ''}
    ${req.fastTracked ? `
      <div class="note-box no-print" style="background:var(--amber-bg);border-color:var(--amber);color:var(--amber);">
        <b>⚡ طلب بالحد الأدنى</b> — تخطّى بعض خطوات الاعتماد لأن مبلغه ضمن الحد الأدنى المحدد لمركزه.
      </div>` : ''}
    ${renderBudgetFloat(req)}
    <div class="doc${req.isCancelled ? ' doc-cancelled' : ''}">
      <div class="top-action-bar no-print">
        <div class="header-actions-flex">
          <div class="doc-actions-col">
            ${isDocView ? `<div class="row" style="gap:8px;"><button class="btn btn-ghost btn-md" onclick="openPrintPreview('${req.id}')">معاينة الطلب</button><button class="btn btn-ghost btn-md" onclick="downloadRequestPdf('${req.id}')">تحميل PDF</button></div>` : ''}
            ${(req.createdById===state.user.id && isEditable(req) && !req.isCancelled) ? `
              <div class="doc-actions-row" data-bar-actions>
                <button class="btn btn-ghost btn-sm" onclick="editRequest('${req.id}')">تعديل الطلب</button>
                <button class="btn btn-reject btn-sm" onclick="deleteRequest('${req.id}')">إبطال الطلب</button>
              </div>` : ''}
          </div>
          <div class="stepper" style="margin:0;">${stepperHtml}</div>
        </div>
      </div>

      ${renderAppRequestView(req)}

      ${actionsHtml}
      ${debugPanelHtml}

      <div class="history no-print">
        <h2>سجل الطلب</h2>
        ${req.history.map(h=>`
          <div class="history-item">
            <div class="t">${h.time}</div>
            <div><b>${h.actor}</b> — ${h.action} <span style="color:var(--muted);">(${STEP_LABELS[h.step]||h.step})</span>
              ${h.note ? `<div style="color:var(--red);margin-top:2px;">${h.note}</div>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>
  `;

  window.approveFix = ()=>{ state.pendingEscalate = null; approve(req); };   // اعتماد عادي يلغي أي إحالة معلّقة من محاولة سابقة
  window.markDisbursedFix = ()=>markDisbursed(req);
  window.approveEscalateFix = (targetId)=>{ state.pendingEscalate = {reqId:req.id, targetId}; approve(req); };
  window.resubmitFix = ()=>resubmit(req);
  window.rebuildRequestPathFix = ()=>rebuildRequestPath(req);
  window.rebuildResetFix = ()=>rebuildRequestPathAndReset(req);
}

// ===================== أثر الضغط على الأزرار: انشغال + منع الضغط المزدوج + ✓ عند النجاح =====================
const BUSY_FNS = ['approve','markDisbursed','resubmit','confirmRejectModal','submitBankTransfer','confirmManualSign','saveAccount','addCompany','addCenter','addCustomRole','addUser','saveUserEdit','saveCenterEdit','saveCompanyEdit','saveSigDesignerConfig','restoreRequest','confirmDeletePassword'];
const _busyLocks = {};
function clickedButton(){
  const ev = window.event, t = ev && ev.target;
  return (t && t.closest) ? t.closest('button, a.btn') : null;
}
function sameActionButtons(btn){
  const oc = btn.getAttribute && btn.getAttribute('onclick');
  if(!oc) return [btn];
  return Array.from(document.querySelectorAll('button[onclick]')).filter(b=>b.getAttribute('onclick')===oc);   // نسخة الشريط السفلي وأصلها معاً
}
function setBtnBusy(btn, on, done){
  if(!btn || !btn.isConnected) return;
  sameActionButtons(btn).forEach(b=>{
    if(on){
      if(b.dataset.orig===undefined){ const wide = b.offsetWidth>=90; b.dataset.orig = b.innerHTML; b.innerHTML = '<span class="spin"></span>' + (wide ? ' جارٍ...' : ''); }
      b.disabled = true; b.classList.add('is-busy');
    } else {
      b.disabled = false; b.classList.remove('is-busy');
      if(b.dataset.orig!==undefined){ const orig = b.dataset.orig; delete b.dataset.orig; b.innerHTML = orig; if(done) flashDone(b, orig); }
    }
  });
}
function flashDone(b, orig){
  b.classList.add('is-done'); b.innerHTML = '✓';
  setTimeout(()=>{ if(b.isConnected){ b.classList.remove('is-done'); b.innerHTML = orig; } }, 900);
}
function wrapBusy(name){
  const orig = window[name];
  if(typeof orig!=='function') return;
  window[name] = function(...args){
    if(_busyLocks[name]) return;                       // ضغطة ثانية أثناء التنفيذ: تُتجاهل
    const btn = clickedButton();
    _busyLocks[name] = true; setBtnBusy(btn, true);
    let res;
    try{ res = orig.apply(this, args); }
    catch(e){ _busyLocks[name] = false; setBtnBusy(btn, false); throw e; }
    Promise.resolve(res).then(()=>{ _busyLocks[name] = false; setBtnBusy(btn, false, true); },
                              ()=>{ _busyLocks[name] = false; setBtnBusy(btn, false); });
    return res;
  };
}
BUSY_FNS.forEach(wrapBusy);
(function(){
  const origExport = window.exportAnalyticsCSV;
  if(typeof origExport==='function'){
    window.exportAnalyticsCSV = function(...a){ const b = clickedButton(); const r = origExport.apply(this, a); if(b && b.isConnected){ const orig = b.innerHTML; flashDone(b, orig); } return r; };
  }
})();

initApp();
</script>
